<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0E1113"><title>LENSA Yönetim</title>
<style>
:root{--bg:#0e1113;--panel:#171b1e;--line:#2a3034;--text:#eee8dc;--muted:#899196;--gold:#d5a354;--bad:#d06b52;--good:#72a89a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,sans-serif}.wrap{max-width:1180px;margin:auto;padding:24px}.top{display:flex;align-items:center;gap:12px;margin-bottom:24px}.top h1{margin:0;font:500 28px Georgia,serif;letter-spacing:.08em}.top a,.top button{margin-left:auto;color:var(--gold);background:none;border:1px solid var(--line);padding:9px 12px;border-radius:10px;text-decoration:none}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}.login{max-width:430px;margin:8vh auto}.login input{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid var(--line);background:#101315;color:var(--text)}button{cursor:pointer}.solid{width:100%;padding:12px;border:0;border-radius:10px;background:var(--gold);font-weight:800;color:#17110a}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.metric{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px}.metric b{display:block;font:500 27px Georgia,serif}.metric span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.tabs{display:flex;gap:8px;margin:16px 0}.tabs button{padding:9px 13px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--muted)}.tabs button.on{background:var(--gold);color:#16110a;border-color:var(--gold)}table{width:100%;border-collapse:collapse;font-size:12.5px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em}select{background:#101315;color:var(--text);border:1px solid var(--line);padding:7px;border-radius:8px}.pill{display:inline-block;padding:4px 8px;border-radius:9px;background:#272e31;font-size:10px}.ok{color:var(--good)}.bad{color:var(--bad)}pre{white-space:pre-wrap;word-break:break-word}.hidden{display:none}@media(max-width:800px){.metrics{grid-template-columns:repeat(2,1fr)}.wrap{padding:14px}.tablewrap{overflow:auto}}
</style>
</head>
<body><div class="wrap">
<div class="top"><h1>LENSA · Yönetim</h1><a href="./index.html">Uygulamaya dön</a><button id="logout" class="hidden">Çıkış</button></div>
<section id="login" class="card login"><h2>Yönetici girişi</h2><p>Yalnızca <code>lensa_profiles.is_admin = true</code> kullanıcılar erişebilir.</p><input id="email" type="email" placeholder="E-posta"><input id="pass" type="password" placeholder="Şifre"><button id="go" class="solid">Giriş yap</button><p id="msg"></p></section>
<section id="app" class="hidden"><div class="metrics" id="metrics"></div><div class="tabs"><button data-tab="overview" class="on">Genel</button><button data-tab="users">Kullanıcılar</button><button data-tab="feedback">Geri bildirim</button></div><div id="body" class="card"></div></section>
</div>
<script>
(function(){'use strict';
var CFG={url:'https://wwondiajwpvvjwwkrxej.supabase.co',key:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind3b25kaWFqd3B2dmp3d2tyeGVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3NzgzNjYsImV4cCI6MjEwMTM1NDM2Nn0.-VDfg7bGJgfv1Ie4DsJPemNLHNDQiXXGj0mXt7mpXw8',admin:'https://wwondiajwpvvjwwkrxej.supabase.co/functions/v1/lensa-admin'};
var $=function(x){return document.getElementById(x)},session=null,tab='overview';
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function head(){return{'Content-Type':'application/json',apikey:CFG.key,Authorization:'Bearer '+session.access_token}}
function save(){localStorage.setItem('lensa.admin.session',JSON.stringify(session||null))}function restore(){try{session=JSON.parse(localStorage.getItem('lensa.admin.session'))}catch(e){}}
function api(action,data){return fetch(CFG.admin,{method:'POST',headers:head(),body:JSON.stringify(Object.assign({action:action},data||{}))}).then(function(r){return r.json().then(function(d){if(!r.ok)throw new Error(d.error||'İstek başarısız');return d})})}
function auth(email,pass){return fetch(CFG.url+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json',apikey:CFG.key},body:JSON.stringify({email:email,password:pass})}).then(function(r){return r.json().then(function(d){if(!r.ok)throw new Error(d.error_description||d.msg||'Giriş başarısız');return d})})}
function open(){ $('login').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');loadDashboard() }
function loadDashboard(){api('dashboard').then(function(d){var m=d.metrics||{},p=m.plans||{};$('metrics').innerHTML=[['Kullanıcı',m.users],['Bugünkü istek',m.requestsToday],['30 gün istek',m.requests30d],['30 gün hata',m.failures30d],['Premium',(p.plus||0)+(p.pro||0)]].map(function(x){return'<div class="metric"><b>'+esc(x[1]||0)+'</b><span>'+esc(x[0])+'</span></div>'}).join('');paintOverview(m)}).catch(fail)}
function paintOverview(m){if(tab!=='overview')return;var rows=(m.actions||[]).map(function(x){return'<tr><td>'+esc(x.name)+'</td><td>'+x.count+'</td><td class="'+(x.failures?'bad':'ok')+'">'+x.failures+'</td><td>'+x.avgLatency+' ms</td></tr>'}).join('');$('body').innerHTML='<h2>İstek kalitesi</h2><div class="tablewrap"><table><thead><tr><th>İşlem</th><th>Adet</th><th>Hata</th><th>Ortalama süre</th></tr></thead><tbody>'+rows+'</tbody></table></div><p>Plan dağılımı: Free '+(m.plans.free||0)+' · Plus '+(m.plans.plus||0)+' · Pro '+(m.plans.pro||0)+'</p>'}
function loadUsers(){api('users',{size:100}).then(function(d){$('body').innerHTML='<h2>Kullanıcılar</h2><div class="tablewrap"><table><thead><tr><th>E-posta</th><th>Ad</th><th>Plan</th><th>Admin</th><th>Kayıt</th></tr></thead><tbody>'+(d.users||[]).map(function(u){return'<tr><td>'+esc(u.email)+'</td><td>'+esc(u.display_name||'')+'</td><td><select data-plan="'+u.id+'"><option'+(u.plan==='free'?' selected':'')+'>free</option><option'+(u.plan==='plus'?' selected':'')+'>plus</option><option'+(u.plan==='pro'?' selected':'')+'>pro</option></select></td><td><input type="checkbox" data-admin="'+u.id+'" '+(u.is_admin?'checked':'')+'></td><td>'+esc((u.created_at||'').slice(0,10))+'</td></tr>'}).join('')+'</tbody></table></div>';document.querySelectorAll('[data-plan]').forEach(function(n){n.onchange=function(){api('set_plan',{userId:n.dataset.plan,plan:n.value}).catch(fail)}});document.querySelectorAll('[data-admin]').forEach(function(n){n.onchange=function(){api('set_admin',{userId:n.dataset.admin,isAdmin:n.checked}).catch(fail)}})}).catch(fail)}
function loadFeedback(){api('feedback').then(function(d){var f=(d.feedback||[]).map(function(x){return'<tr><td>'+esc((x.created_at||'').slice(0,16))+'</td><td>'+esc(x.message)+'</td></tr>'}).join('');var a=(d.analysisFeedback||[]).map(function(x){return'<tr><td>'+esc((x.created_at||'').slice(0,16))+'</td><td><span class="pill">'+esc(x.verdict)+'</span> '+esc(x.predicted_title)+' → '+esc(x.corrected_title||'—')+'</td></tr>'}).join('');$('body').innerHTML='<h2>Genel geri bildirim</h2><div class="tablewrap"><table>'+f+'</table></div><h2>Analiz doğruluğu</h2><div class="tablewrap"><table>'+a+'</table></div>'}).catch(fail)}
function fail(e){$('body').innerHTML='<p class="bad">'+esc(e.message||e)+'</p>';if(/ADMIN|AUTH/.test(String(e.message||e))){session=null;save();location.reload()}}
$('go').onclick=function(){auth($('email').value.trim(),$('pass').value).then(function(d){session={access_token:d.access_token,refresh_token:d.refresh_token};save();return api('dashboard')}).then(open).catch(function(e){$('msg').textContent=e.message})};
$('logout').onclick=function(){session=null;save();location.reload()};document.querySelectorAll('[data-tab]').forEach(function(b){b.onclick=function(){tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(function(x){x.classList.toggle('on',x===b)});if(tab==='overview')loadDashboard();if(tab==='users')loadUsers();if(tab==='feedback')loadFeedback()}});
restore();if(session)api('dashboard').then(open).catch(function(){session=null;save()});
})();
</script></body></html>
