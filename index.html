<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0E1113">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LENSA">
<meta name="description" content="Bilmediğin şeyin fotoğrafını çek. LENSA ne olduğunu sesli anlatsın, nerede bulunacağını söylesin.">
<title>LENSA — Ne bu? Nerede bulunur?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ─────────────────────────────────────────────
   LENSA — tasarım belirteçleri
   Kamera karanlıkta çalışır, cevap ışıkta durur.
   Vizör soğuk mürekkep siyahı; cevap müze etiketi
   gibi kemik rengi bir plaket. Metal her yerde pirinç.
   ───────────────────────────────────────────── */
:root{
  --void:#0E1113; --void-2:#161A1D; --void-3:#1E2327;
  --label:#EDE7DA; --ink:#15181A; --ink-soft:#5A5A52;
  --brass:#B8853F; --brass-hi:#E0AE63;
  --patina:#4C6B63; --alarm:#B4523C;
  --chrome:#9AA0A2; --chrome-2:#5F686C;
  --line:rgba(255,255,255,.10); --line-ink:rgba(21,24,26,.14);
  --r-s:10px; --r-m:16px; --r-l:24px; --pad:18px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --tabbar:calc(67px + var(--safe-b));
  --disp:"Bodoni Moda",'Times New Roman',Georgia,serif;
  --ui:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--void);color:var(--label);
  font-family:var(--ui);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
button[disabled]{opacity:.4;cursor:default}
a{color:inherit}
:focus-visible{outline:2px solid var(--brass-hi);outline-offset:3px;border-radius:6px}
::selection{background:var(--brass);color:#111}
.hide{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── kabuk ───────────────────────────────── */
#app{max-width:520px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden;z-index:1}
#bgart{position:fixed;inset:-14%;z-index:0;background-size:cover;background-position:center;
  filter:blur(48px) saturate(1.8) brightness(.4);opacity:0;transition:opacity .9s var(--ease);pointer-events:none}
#bgart.on{opacity:.9}
.topbar{
  position:sticky;top:0;z-index:40;
  padding:calc(var(--safe-t) + 12px) var(--pad) 12px;
  display:flex;align-items:center;gap:10px;
  background:linear-gradient(180deg,rgba(14,17,19,.92) 58%,rgba(14,17,19,0));
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand-mark{width:30px;display:block;color:var(--label)}
.brand-mark .lensa-mark{width:100%;height:auto;display:block}
.wordmark{font-size:17px;letter-spacing:.34em;font-weight:600;padding-left:.34em;
  animation:chroma .78s steps(2,end) both}
.idle-mark{display:block;width:78px;margin:0 auto;color:var(--label);opacity:.9}
.idle-mark .lensa-mark{width:100%;height:auto;display:block}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);color:var(--chrome);transition:.2s var(--ease)}
.icon-btn:active{transform:scale(.92);background:var(--void-2)}
.lang-btn{width:auto;padding:0 12px;font-size:11px;font-weight:600;letter-spacing:.1em;border-radius:19px}
main{flex:1;display:flex;flex-direction:column;min-height:0;padding-bottom:var(--tabbar)}
.view{display:none;flex:1;flex-direction:column;min-height:0}
.view.active{display:flex}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 var(--pad) 30px}

#netbar{
  position:fixed;top:0;left:0;right:0;z-index:80;text-align:center;
  padding:calc(var(--safe-t) + 7px) 12px 7px;background:var(--alarm);color:#fff;
  font-size:12px;font-weight:600;letter-spacing:.04em;
  transform:translateY(-110%);transition:transform .3s var(--ease);
}
#netbar.on{transform:none}

/* ── mod seçimi ──────────────────────────── */
.modes,.filterbar{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.modes::-webkit-scrollbar,.filterbar::-webkit-scrollbar{display:none}
.modes{padding:2px var(--pad) 14px}
.filterbar{padding:0 0 14px}
.mode{
  flex:0 0 auto;padding:8px 14px;border-radius:20px;border:1px solid var(--line);
  color:var(--chrome);font-size:12.5px;font-weight:500;white-space:nowrap;transition:.2s var(--ease);
}
.mode[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:#14100A;font-weight:600}

/* ── vizör ───────────────────────────────── */
.finder-wrap{padding:0 var(--pad);flex:1;display:flex;flex-direction:column;min-height:0}
.finder{
  position:relative;flex:1 1 auto;min-height:170px;border-radius:var(--r-l);overflow:hidden;
  background:#08090A;border:1px solid var(--line);display:grid;place-items:center;
}
.finder video,.finder img.shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.finder.mirror video{transform:scaleX(-1)}
.finder-idle{position:relative;z-index:2;text-align:center;padding:32px 26px;max-width:300px}
.finder-idle h2{font-family:var(--disp);font-weight:400;font-size:26px;line-height:1.22;margin:14px 0 8px}
.finder-idle p{color:var(--chrome-2);font-size:13.5px;margin:0}
.aperture-mark{color:var(--brass);opacity:.85}
.ticks span{position:absolute;width:22px;height:22px;border:1.5px solid rgba(224,174,99,.55);pointer-events:none}
.ticks span:nth-child(1){top:14px;left:14px;border-right:0;border-bottom:0;border-radius:4px 0 0 0}
.ticks span:nth-child(2){top:14px;right:14px;border-left:0;border-bottom:0;border-radius:0 4px 0 0}
.ticks span:nth-child(3){bottom:14px;left:14px;border-right:0;border-top:0;border-radius:0 0 0 4px}
.ticks span:nth-child(4){bottom:14px;right:14px;border-left:0;border-top:0;border-radius:0 0 4px 0}
.finder .torch{position:absolute;top:12px;right:12px;z-index:4;width:38px;height:38px;border-radius:50%;
  display:grid;place-items:center;background:rgba(8,9,10,.6);backdrop-filter:blur(6px);color:var(--chrome);border:1px solid var(--line)}
.finder .torch.on{color:var(--brass-hi);border-color:var(--brass)}

.sweep{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;overflow:hidden}
.sweep.on{opacity:1}
.sweep::after{
  content:"";position:absolute;left:0;right:0;height:120px;
  background:linear-gradient(180deg,transparent,rgba(224,174,99,.16) 46%,rgba(224,174,99,.9) 50%,rgba(224,174,99,.16) 54%,transparent);
  animation:sweep 1.9s var(--ease) infinite;
}
@keyframes sweep{0%{top:-120px}100%{top:100%}}

/* ── deklanşör satırı ────────────────────── */
.shutter-row{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:34px;padding:16px 0 10px}
.shutter{width:76px;height:76px;border-radius:50%;position:relative;display:grid;place-items:center;
  border:1.5px solid var(--brass);transition:transform .16s var(--ease)}
.shutter::before{content:"";position:absolute;inset:6px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,var(--brass-hi),var(--brass) 62%,#7C5824);transition:inset .16s var(--ease)}
.shutter:active{transform:scale(.95)}
.shutter:active::before{inset:12px}
.shutter-ring{position:absolute;inset:-7px;border-radius:50%;border:1px dashed rgba(184,133,63,.45)}
.side-btn{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;border:1px solid var(--line);color:var(--chrome);transition:.2s var(--ease)}
.side-btn:active{transform:scale(.93);background:var(--void-2)}

/* ── plaka + plaket ──────────────────────── */
.result-top{display:flex;gap:8px;padding:12px 0 10px}
.ghost-chip{display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:20px;
  border:1px solid var(--line);color:var(--chrome);font-size:12.5px;font-weight:500;transition:.18s var(--ease)}
.ghost-chip:active{transform:scale(.96);background:var(--void-2)}
.plate{border-radius:var(--r-m);overflow:hidden;background:#0A0C0D;border:1px solid var(--line);margin-bottom:-22px;position:relative}
.plate img{display:block;width:100%;max-height:44dvh;object-fit:cover}
.plate .kat{position:absolute;left:12px;top:12px;padding:5px 10px;border-radius:6px;background:rgba(10,12,13,.72);
  backdrop-filter:blur(6px);font-size:10px;letter-spacing:.16em;font-weight:600;color:var(--brass-hi)}
.plate.scanning img{filter:grayscale(.72) contrast(1.06) brightness(.66)}
.plate.scanning .kat{color:var(--chrome);letter-spacing:.2em}

.card{background:rgba(237,231,218,.9);backdrop-filter:blur(26px) saturate(1.5);
  -webkit-backdrop-filter:blur(26px) saturate(1.5);
  color:var(--ink);border-radius:var(--r-l);padding:22px 20px 26px;position:relative;
  box-shadow:0 -18px 54px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.5);
  animation:rise .5s var(--ease) both}
@keyframes rise{from{transform:translateY(26px);opacity:0}to{transform:none;opacity:1}}
.card::before{content:"";position:absolute;left:20px;right:20px;top:11px;height:2px;
  background:linear-gradient(90deg,transparent,var(--brass) 12%,var(--brass) 88%,transparent);opacity:.55}
.card .kicker{font-size:10.5px;letter-spacing:.19em;text-transform:uppercase;font-weight:600;color:var(--brass);margin-bottom:8px}
.card h1{font-family:var(--disp);font-weight:500;font-size:clamp(30px,8.4vw,40px);line-height:1.06;margin:0 0 12px;letter-spacing:-.01em}
.hallmark{display:inline-flex;align-items:center;gap:7px;padding:6px 12px 6px 9px;border:1px solid rgba(184,133,63,.55);
  border-radius:20px;font-size:11.5px;font-weight:600;letter-spacing:.05em;color:#7A5623;background:rgba(184,133,63,.09)}
.hallmark.low{border-color:rgba(180,82,60,.5);color:var(--alarm);background:rgba(180,82,60,.08)}
.hallmark.sure{border-color:rgba(76,107,99,.5);color:#33544C;background:rgba(76,107,99,.09)}
.lede{font-size:15.5px;line-height:1.62;margin:16px 0 0;color:#2B2E30}
.rule{height:1px;background:var(--line-ink);margin:22px 0 16px}
.sec-title{font-size:10.5px;letter-spacing:.19em;text-transform:uppercase;font-weight:700;color:var(--ink-soft);margin:0 0 12px}

dl.specs{margin:0}
.spec{display:flex;align-items:baseline;gap:6px;padding:7px 0;font-size:14px}
.spec dt{color:var(--ink-soft);flex:0 0 auto;max-width:46%}
.spec .lead{flex:1;border-bottom:1px dotted rgba(21,24,26,.28);transform:translateY(-4px)}
.spec dd{margin:0;flex:0 0 auto;font-weight:600;text-align:right;max-width:52%}
.spec.alt dt{color:var(--ink);font-weight:600;max-width:50%}
.spec.alt dd{font-weight:400;color:var(--ink-soft);font-size:13px;max-width:48%}

.transport{display:flex;align-items:center;gap:12px;margin-top:18px;padding:11px 12px;
  border:1px solid var(--line-ink);border-radius:14px;background:rgba(21,24,26,.035)}
.play{width:44px;height:44px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;
  background:var(--ink);color:var(--label);transition:transform .15s var(--ease)}
.play:active{transform:scale(.93)}
.bars{flex:1;display:flex;align-items:center;gap:2.5px;height:26px;overflow:hidden}
.bars i{flex:1;background:rgba(21,24,26,.2);border-radius:2px;height:22%;transition:height .18s var(--ease),background .18s}
.bars.on i{background:var(--brass);animation:eq .9s ease-in-out infinite}
.bars.on i:nth-child(3n){animation-delay:.15s}
.bars.on i:nth-child(3n+1){animation-delay:.3s}
.bars.on i:nth-child(4n){animation-delay:.45s}
@keyframes eq{0%,100%{height:20%}50%{height:88%}}
.rate{padding:6px 10px;border:1px solid var(--line-ink);border-radius:9px;font-size:12px;font-weight:600;color:var(--ink-soft)}

.warn{display:flex;gap:10px;padding:12px 14px;border-radius:12px;margin-top:16px;
  background:rgba(180,82,60,.1);border:1px solid rgba(180,82,60,.3);font-size:13.5px;line-height:1.5;color:#7C3626}

.links{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.link{display:flex;align-items:center;gap:9px;padding:12px 13px;border-radius:12px;border:1px solid var(--line-ink);
  text-decoration:none;font-size:13.5px;font-weight:600;background:rgba(255,255,255,.42);transition:.16s var(--ease)}
.link:active{transform:scale(.975);background:rgba(184,133,63,.14)}
.link .glyph{width:26px;height:26px;flex:0 0 auto;border-radius:8px;display:grid;place-items:center;
  background:var(--ink);color:var(--label);font-size:11px;font-weight:700}
.link.wide{grid-column:1/-1}
.link small{display:block;font-weight:400;font-size:11px;color:var(--ink-soft)}

.pricebox{display:flex;align-items:flex-end;gap:10px;padding:14px 16px;border-radius:14px;
  border:1px dashed rgba(184,133,63,.5);background:rgba(184,133,63,.07)}
.pricebox .amount{font-family:var(--disp);font-size:27px;line-height:1;font-weight:500}
.pricebox small{color:var(--ink-soft);font-size:11.5px;line-height:1.4}

.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:9px 13px;border-radius:18px;border:1px solid var(--line-ink);font-size:13px;font-weight:500;
  background:rgba(255,255,255,.4);transition:.16s var(--ease);text-align:left;text-decoration:none;color:var(--ink)}
.chip:active{transform:scale(.96);background:rgba(184,133,63,.16)}
.chip.flat{pointer-events:none;background:transparent;color:var(--ink-soft);font-size:12.5px}
.chip .tiny{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--brass);margin-left:5px}

.qa{margin-top:12px}
.qa-item{padding:13px 0;border-top:1px solid var(--line-ink)}
.qa-item .q{font-weight:700;font-size:13.5px;margin-bottom:5px}
.qa-item .a{font-size:14px;line-height:1.6;color:#2B2E30}
.ask-row{display:flex;gap:8px;margin-top:14px}
.ask-row input{flex:1;padding:13px 15px;border-radius:13px;border:1px solid var(--line-ink);
  background:rgba(255,255,255,.55);font-size:15px}
.ask-row input::placeholder{color:#9A968E}
.ask-row button{width:48px;border-radius:13px;background:var(--ink);color:var(--label);display:grid;place-items:center}

.card-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:22px}
.act{padding:13px 6px;border-radius:13px;border:1px solid var(--line-ink);font-size:12px;font-weight:600;
  display:flex;flex-direction:column;align-items:center;gap:6px;background:rgba(255,255,255,.42);transition:.16s var(--ease)}
.act:active{transform:scale(.96)}
.act.filled{background:var(--ink);color:var(--label);border-color:var(--ink)}
.act.done{background:var(--patina);border-color:var(--patina);color:#fff}

.fact{margin-top:20px;padding:16px 18px;border-radius:14px;background:rgba(21,24,26,.055);font-size:14px;line-height:1.6}
.fact b{display:block;font-family:var(--disp);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--brass);margin-bottom:6px;font-weight:600}
.provenance{margin-top:18px;font-size:10.5px;letter-spacing:.06em;color:#96918A;text-align:center}
.card .provenance{color:#96918A}

.skeleton{padding:26px 20px;background:rgba(237,231,218,.88);backdrop-filter:blur(26px) saturate(1.5);
  -webkit-backdrop-filter:blur(26px) saturate(1.5);border-radius:var(--r-l);color:var(--ink)}
.sk-line{height:13px;border-radius:6px;background:rgba(21,24,26,.1);margin-bottom:11px;animation:pulse 1.3s ease-in-out infinite}
.sk-line.tall{height:34px;width:68%;margin-bottom:18px}
.sk-line.w7{width:72%}.sk-line.w5{width:52%}
@keyframes pulse{50%{opacity:.42}}
.skeleton .stage{margin-top:20px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;color:#8A8578}

/* ── ızgara: koleksiyon ve akış ──────────── */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;padding-top:4px}
.tile{border-radius:var(--r-m);overflow:hidden;background:var(--void-2);border:1px solid var(--line);position:relative}
.tile-main{display:block;width:100%;text-align:left;transition:.18s var(--ease)}
.tile-main:active{transform:scale(.98)}
.tile img,.tile .noimg{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#0A0C0D}
.tile .meta{padding:11px 12px 13px}
.tile .tt{font-family:var(--disp);font-size:16px;line-height:1.2;margin-bottom:4px}
.tile .ts{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--chrome-2)}
.tile-x{position:absolute;top:7px;right:7px;width:26px;height:26px;border-radius:50%;
  background:rgba(8,9,10,.66);backdrop-filter:blur(5px);color:var(--chrome);font-size:16px;line-height:1;display:grid;place-items:center}
.tile-bar{display:flex;gap:6px;padding:0 10px 11px}
.mini{display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:14px;border:1px solid var(--line);
  color:var(--chrome-2);font-size:11.5px;font-weight:600}
.mini.liked{color:var(--brass-hi);border-color:rgba(184,133,63,.45)}

.empty{text-align:center;padding:52px 26px;color:var(--chrome-2)}
.empty .aperture-mark{opacity:.5}
.empty h3{font-family:var(--disp);font-weight:400;font-size:23px;color:var(--label);margin:14px 0 7px}
.empty p{font-size:13.5px;margin:0 0 18px}
.ghost-btn{padding:12px 22px;border-radius:22px;border:1px solid var(--brass);color:var(--brass-hi);font-size:13px;font-weight:600}
.ghost-btn.sm{padding:9px 15px;font-size:12.5px;border-radius:18px}
.ghost-btn.danger{border-color:rgba(180,82,60,.6);color:#D07A63}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

.search{width:100%;padding:12px 15px;border-radius:13px;background:var(--void-2);border:1px solid var(--line);
  color:var(--label);font-size:14.5px;margin:2px 0 12px}
.search::placeholder{color:var(--chrome-2)}
.feed-head{display:flex;gap:8px;align-items:center;padding:2px 0 14px;flex-wrap:wrap}
.badge{padding:7px 12px;border-radius:18px;font-size:11px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;border:1px solid var(--line);color:var(--chrome-2)}
.badge.live{color:var(--patina);border-color:rgba(76,107,99,.5)}
.note{padding:12px 14px;border-radius:12px;background:var(--void-2);border:1px solid var(--line);
  color:var(--chrome);font-size:12.5px;margin-bottom:12px}

/* ── ayarlar ─────────────────────────────── */
.set-h{font-family:var(--disp);font-size:19px;font-weight:500;margin:26px 0 2px;color:var(--label)}
.field{padding:14px 0;border-bottom:1px solid var(--line)}
.field label{display:block;font-size:13.5px;font-weight:600;margin-bottom:4px}
.field p{margin:0 0 10px;font-size:12px;color:var(--chrome-2);line-height:1.55}
.field input,.field select{width:100%;padding:12px 14px;border-radius:12px;background:var(--void-2);
  border:1px solid var(--line);color:var(--label);font-size:14.5px;margin-bottom:8px}
.field input:last-of-type{margin-bottom:0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:8px 13px;border-radius:16px;border:1px solid var(--line);color:var(--chrome);font-size:12.5px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:#14100A;font-weight:600}
.test-out{display:block;margin-top:9px;font-size:12px;color:var(--chrome-2)}
.test-out.ok{color:var(--patina)}
.test-out.bad{color:#D07A63}
.diag{margin:10px 0;padding:13px 14px;border-radius:12px;background:#0A0C0D;border:1px solid var(--line);
  color:var(--chrome);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;line-height:1.65;
  white-space:pre-wrap;word-break:break-all;overflow-x:auto}
.switch{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:15px 0;border-bottom:1px solid var(--line)}
.switch .txt strong{display:block;font-size:14px;font-weight:600}
.switch .txt span{font-size:12px;color:var(--chrome-2);line-height:1.5}
.toggle{width:50px;height:30px;border-radius:16px;background:var(--void-3);border:1px solid var(--line);
  position:relative;flex:0 0 auto;transition:.22s var(--ease)}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;
  background:var(--chrome-2);transition:.22s var(--ease)}
.toggle[aria-checked="true"]{background:rgba(184,133,63,.3);border-color:var(--brass)}
.toggle[aria-checked="true"]::after{left:23px;background:var(--brass-hi)}

/* ── nesne işaretleme katmanı ────────────── */
#marker{position:fixed;inset:0;z-index:95;background:rgba(8,9,10,.96);display:flex;flex-direction:column;
  padding:calc(var(--safe-t) + 16px) 16px calc(var(--safe-b) + 16px)}
#markerHint{text-align:center;font-size:13.5px;color:var(--chrome);margin:0 auto 14px;max-width:320px;line-height:1.5}
#markerStage{position:relative;flex:1;display:grid;place-items:center;touch-action:none;overflow:hidden;border-radius:var(--r-m)}
#markerImg{max-width:100%;max-height:100%;object-fit:contain;pointer-events:none;user-select:none}
#markerBox{position:absolute;border:1.5px solid var(--brass-hi);background:rgba(224,174,99,.14);
  box-shadow:0 0 0 9999px rgba(8,9,10,.5);pointer-events:none;border-radius:3px}
.marker-actions{display:flex;gap:10px;margin-top:16px}
.marker-actions button{flex:1;padding:14px;border-radius:14px;font-size:14px;font-weight:600;border:1px solid var(--line);color:var(--chrome)}
.marker-actions #markerUse{background:var(--brass);border-color:var(--brass);color:#14100A}

/* ── alt gezinti ─────────────────────────── */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:520px;margin:0 auto;
  display:grid;grid-template-columns:repeat(4,1fr);padding:9px 8px calc(var(--safe-b) + 9px);
  background:rgba(14,17,19,.9);backdrop-filter:blur(18px) saturate(1.3);border-top:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;color:var(--chrome-2);
  font-size:10px;letter-spacing:.08em;font-weight:600;text-transform:uppercase;transition:.18s var(--ease)}
.tab[aria-selected="true"]{color:var(--brass-hi)}
.tab svg{width:21px;height:21px}

#toast{position:fixed;left:50%;bottom:calc(var(--tabbar) + 18px);transform:translate(-50%,14px);z-index:90;
  padding:12px 18px;border-radius:24px;background:var(--label);color:var(--ink);font-size:13.5px;font-weight:600;
  opacity:0;pointer-events:none;transition:.28s var(--ease);max-width:88vw;text-align:center;box-shadow:0 10px 34px rgba(0,0,0,.45)}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ── optik katman ─────────────────────────────
   Glitch burada süs değil, merceğin henüz odaklanmadığı an.
   Kanal ayrışması bir kez olur ve yerine oturur. */
@keyframes chroma{
  0%  {opacity:0;transform:translateX(-8px);text-shadow:-6px 0 rgba(255,42,90,.95),6px 0 rgba(0,229,255,.95)}
  14% {opacity:1;transform:translateX(7px); text-shadow:7px 0 rgba(255,42,90,.8),-7px 0 rgba(0,229,255,.8)}
  28% {transform:translateX(-4px);text-shadow:-4px 0 rgba(255,42,90,.62),4px 0 rgba(0,229,255,.62)}
  44% {transform:translateX(3px); text-shadow:3px 0 rgba(255,42,90,.44),-3px 0 rgba(0,229,255,.44)}
  64% {transform:translateX(-1px);text-shadow:-1px 0 rgba(255,42,90,.26),1px 0 rgba(0,229,255,.26)}
  100%{transform:none;text-shadow:none;opacity:1}
}
.card h1{animation:chroma .6s steps(2,end) both}
.wordmark{animation:chroma .78s steps(2,end) both}
.card .kicker{animation:rise .5s .16s var(--ease) both}
.hallmark{animation:rise .5s .24s var(--ease) both}

/* tarama çizgileri: cam altındaki bir optik alet gibi */
.scan-lines::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:3;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.19) 0 1px,transparent 1px 3px);
  mix-blend-mode:overlay;opacity:.55;
}
.finder::before{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:2;
  box-shadow:inset 0 0 90px 18px rgba(6,7,8,.62);
}

/* inceleme anında kanal kayması */
@keyframes jitter{
  0%,44%,54%,100%{transform:none;filter:grayscale(.72) contrast(1.06) brightness(.62)}
  46%{transform:translateX(-3px);filter:grayscale(.15) contrast(1.6) brightness(.86) hue-rotate(-12deg)}
  48%{transform:translateX(4px) skewX(.4deg);filter:grayscale(.1) contrast(1.7) brightness(.9) hue-rotate(14deg)}
  50%{transform:translateX(-2px);filter:grayscale(.5) contrast(1.2) brightness(.7)}
}
.plate.scanning img{animation:jitter 3.2s ease-in-out infinite}
.plate.scanning .kat{animation:blinkcap 1.4s steps(2,end) infinite}
@keyframes blinkcap{50%{opacity:.35}}

/* ── arşiv: tarihi yapılar için ─────────────── */
.archive{
  margin-top:24px;padding:20px 18px 22px;border-radius:16px;position:relative;overflow:hidden;
  background:rgba(21,24,26,.055);border:1px solid rgba(184,133,63,.3);
}
.archive::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--brass),rgba(184,133,63,0));
}
.archive::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(21,24,26,.035) 0 1px,transparent 1px 4px);
}
.archive-top{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.arch-eyebrow{font-size:10px;letter-spacing:.22em;text-transform:uppercase;font-weight:700;color:var(--brass)}
.arch-badge{
  margin-left:auto;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;
  padding:5px 10px;border-radius:12px;border:1px solid rgba(184,133,63,.5);color:#7A5623;
  background:rgba(184,133,63,.08);
}
.arch-specs{margin:14px 0 0;position:relative;z-index:1}
.arch-specs .spec{padding:5px 0;font-size:13.5px}
.arch-story{font-size:14.5px;line-height:1.7;margin:16px 0 0;color:#2B2E30;position:relative;z-index:1}
.arch-listen{
  display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:9px 16px;border-radius:20px;
  background:var(--ink);color:var(--label);font-size:12.5px;font-weight:600;position:relative;z-index:1;
  transition:transform .15s var(--ease);
}
.arch-listen:active{transform:scale(.95)}
.timeline{list-style:none;margin:20px 0 0 4px;padding:0 0 0 15px;border-left:1px solid rgba(184,133,63,.42);position:relative;z-index:1}
.timeline li{position:relative;padding:0 0 15px 10px}
.timeline li:last-child{padding-bottom:0}
.timeline li::before{
  content:"";position:absolute;left:-20px;top:8px;width:7px;height:7px;border-radius:50%;
  background:var(--brass);box-shadow:0 0 0 3px rgba(237,231,218,.9);
}
.timeline b{display:block;font-family:var(--disp);font-size:18px;font-weight:500;line-height:1.15;letter-spacing:.01em}
.timeline span{display:block;font-size:13px;color:var(--ink-soft);line-height:1.55;margin-top:2px}
.arch-visit{
  margin:16px 0 0;padding-top:13px;border-top:1px solid var(--line-ink);
  font-size:12.5px;line-height:1.6;color:var(--ink-soft);position:relative;z-index:1;
}

/* ── hesap kartı ─────────────────────────── */
.acct{padding:16px 0 4px}
.acct-row{display:flex;align-items:center;gap:13px}
.avatar{
  width:48px;height:48px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;
  font-family:var(--disp);font-size:21px;color:var(--chrome);
  border:1px solid var(--line);background:var(--void-2);
}
.avatar.on{color:#14100A;background:linear-gradient(140deg,var(--brass-hi),var(--brass));border-color:var(--brass)}
.acct-txt{flex:1;min-width:0}
.acct-txt strong{display:block;font-size:15px;font-weight:600}
.acct-txt span{display:block;font-size:12px;color:var(--chrome-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-out{padding:8px 13px;border-radius:16px;border:1px solid var(--line);color:var(--chrome-2);font-size:12px;font-weight:600}
.acct-note{margin:12px 0 0;font-size:12px;color:var(--chrome-2);line-height:1.55}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.statrow div{padding:13px 8px;border-radius:13px;border:1px solid var(--line);text-align:center;background:rgba(255,255,255,.02)}
.statrow b{display:block;font-family:var(--disp);font-size:23px;font-weight:500;line-height:1}
.statrow span{display:block;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--chrome-2);margin-top:5px}
.tabs2{display:flex;gap:6px;margin-bottom:12px}
.tabs2 button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);color:var(--chrome-2);font-size:13px;font-weight:600}
.tabs2 button[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:#14100A}
.acct input{width:100%;padding:12px 14px;border-radius:12px;background:var(--void-2);border:1px solid var(--line);
  color:var(--label);font-size:14.5px;margin-bottom:8px}
.solid-btn{width:100%;padding:13px;border-radius:13px;background:var(--brass);color:#14100A;font-size:14px;font-weight:700;
  transition:transform .15s var(--ease)}
.solid-btn:active{transform:scale(.98)}
.link-btn{display:block;width:100%;padding:12px;margin-top:6px;color:var(--brass-hi);font-size:12.5px;font-weight:600}
.field textarea{width:100%;padding:12px 14px;border-radius:12px;background:var(--void-2);border:1px solid var(--line);
  color:var(--label);font-size:14.5px;resize:vertical;font-family:inherit}

/* ── ilk kullanım turu ───────────────────── */
#intro{position:fixed;inset:0;z-index:98;display:flex;align-items:flex-end;
  background:rgba(8,9,10,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  padding:24px 18px calc(var(--safe-b) + 24px)}
.intro-card{width:100%;max-width:480px;margin:0 auto;background:rgba(237,231,218,.94);
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  color:var(--ink);border-radius:var(--r-l);padding:26px 22px 22px;position:relative;
  box-shadow:0 20px 60px rgba(0,0,0,.6)}
.intro-card::before{content:"";position:absolute;left:22px;right:22px;top:12px;height:2px;
  background:linear-gradient(90deg,transparent,var(--brass) 14%,var(--brass) 86%,transparent);opacity:.6}
.intro-num{font-size:10px;letter-spacing:.22em;font-weight:700;color:var(--brass)}
.intro-card h2{font-family:var(--disp);font-weight:500;font-size:29px;line-height:1.1;margin:10px 0 10px;
  animation:chroma .5s steps(2,end) both}
.intro-card p{margin:0;font-size:14.5px;line-height:1.65;color:#2B2E30}
.intro-dots{display:flex;gap:6px;margin:20px 0 16px}
.intro-dots i{width:22px;height:3px;border-radius:2px;background:rgba(21,24,26,.18);transition:.25s var(--ease)}
.intro-dots i.on{background:var(--brass);width:34px}
.intro-actions{display:flex;gap:10px;align-items:center}
.intro-actions #introSkip{padding:13px 16px;color:var(--ink-soft);font-size:13px;font-weight:600}
.intro-actions .solid-btn{flex:1}

/* ── belge sayfası ───────────────────────── */
#sheet{position:fixed;inset:0;z-index:97;display:flex;align-items:flex-end;
  background:rgba(8,9,10,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.sheet-card{width:100%;max-width:520px;margin:0 auto;max-height:86dvh;display:flex;flex-direction:column;
  background:rgba(237,231,218,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  color:var(--ink);border-radius:var(--r-l) var(--r-l) 0 0;animation:rise .4s var(--ease) both}
.sheet-top{display:flex;align-items:center;gap:12px;padding:20px 20px 12px;border-bottom:1px solid var(--line-ink)}
.sheet-top h3{flex:1;margin:0;font-family:var(--disp);font-weight:500;font-size:23px}
.sheet-top button{width:34px;height:34px;border-radius:50%;background:rgba(21,24,26,.07);font-size:20px;line-height:1;color:var(--ink-soft)}
.sheet-body{overflow-y:auto;padding:16px 20px calc(var(--safe-b) + 28px)}
.sheet-body h4{margin:18px 0 5px;font-size:10.5px;letter-spacing:.19em;text-transform:uppercase;font-weight:700;color:var(--brass)}
.sheet-body h4:first-child{margin-top:2px}
.sheet-body p{margin:0;font-size:14px;line-height:1.68;color:#2B2E30}
.doc-foot{margin-top:24px!important;font-size:11px!important;color:#96918A!important;text-align:center}

/* ── barkod ──────────────────────────────── */
.finder .bcbtn{position:absolute;top:12px;left:12px;z-index:4;width:38px;height:38px;border-radius:50%;
  display:grid;place-items:center;background:rgba(8,9,10,.6);backdrop-filter:blur(6px);
  color:var(--chrome);border:1px solid var(--line)}
.finder .bcbtn.on{color:#14100A;background:var(--brass);border-color:var(--brass)}
.bcband{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:36px 16px 16px;
  background:linear-gradient(0deg,rgba(8,9,10,.94),transparent);display:flex;align-items:center;gap:11px}
.bcband em{flex:1;font-style:normal;font-size:12.5px;color:var(--brass-hi)}
.bcband button{padding:8px 13px;border-radius:16px;border:1px solid var(--line);color:var(--chrome);font-size:12px;font-weight:600}
.bcline{position:absolute;left:8%;right:8%;top:34%;height:2px;background:var(--brass-hi);
  box-shadow:0 0 14px 2px rgba(224,174,99,.6);animation:bcsweep 1.6s var(--ease) infinite}
@keyframes bcsweep{0%,100%{top:26%;opacity:.35}50%{top:64%;opacity:1}}
.bc-chip{display:inline-flex;align-items:center;gap:7px;margin-left:7px;padding:6px 11px;border-radius:20px;
  border:1px solid var(--line-ink);background:rgba(255,255,255,.4);text-decoration:none;
  font-size:11.5px;font-weight:600;font-family:ui-monospace,Menlo,monospace;letter-spacing:.02em}
.bc-chip:active{transform:scale(.96)}

/* ── ürün veritabanı ─────────────────────── */
.dbhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.score{margin-left:auto;padding:5px 11px;border-radius:14px;font-size:10.5px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:#fff;background:#7A7A72}
.score.nA{background:#1E8E3E}.score.nB{background:#7CB342}.score.nC{background:#F9A825;color:#2B2410}
.score.nD{background:#EF6C00}.score.nE{background:#C62828}
.ingr{margin-top:12px;border-top:1px solid var(--line-ink);padding-top:10px}
.ingr summary{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);cursor:pointer}
.ingr p{margin:9px 0 0;font-size:13px;line-height:1.6;color:#2B2E30}

/* ── canlı fiyat ─────────────────────────── */
.live-btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;margin-top:12px;
  padding:13px;border-radius:13px;border:1px dashed rgba(184,133,63,.6);color:#7A5623;
  background:rgba(184,133,63,.06);font-size:13.5px;font-weight:600;transition:transform .15s var(--ease)}
.live-btn:active{transform:scale(.98)}
.live-btn[disabled]{opacity:.55}
.lp-wait{margin-top:10px;padding:13px;border-radius:12px;background:rgba(21,24,26,.05);
  font-size:13px;color:var(--ink-soft);text-align:center}
.lp-box{margin-top:12px;border:1px solid var(--line-ink);border-radius:14px;overflow:hidden;background:rgba(255,255,255,.36)}
.lp-head{padding:11px 14px;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;
  color:var(--brass);border-bottom:1px solid var(--line-ink)}
.lp-row{display:flex;align-items:center;gap:12px;padding:12px 14px;text-decoration:none;color:var(--ink);
  border-bottom:1px solid rgba(21,24,26,.07)}
.lp-row:last-of-type{border-bottom:0}
.lp-row:active{background:rgba(184,133,63,.12)}
.lp-seller{flex:1;font-size:13.5px;font-weight:600}
.lp-seller small{display:block;font-weight:400;font-size:11px;color:var(--ink-soft)}
.lp-price{font-family:var(--disp);font-size:19px;font-weight:500}
.lp-price.best{color:#1E8E3E}
.lp-note{margin:0;padding:11px 14px;font-size:11px;line-height:1.55;color:var(--ink-soft);
  border-top:1px solid var(--line-ink)}

/* ── açılış ekranı ───────────────────────────
   Mercek açılır, halka çizilir, tarama köşeleri yerine oturur,
   sonra ad harf harf yükselir. Dokunulursa atlanır. */
#splash{
  position:fixed;inset:0;z-index:120;background:var(--void);display:grid;place-items:center;
  transition:opacity .55s var(--ease),visibility .55s;
}
#splash.gone{opacity:0;visibility:hidden;pointer-events:none}
.sp-inner{text-align:center;transform:translateY(-4%);padding:0 24px}
.sp-mark{width:min(46vw,178px);margin:0 auto;color:var(--label)}
.sp-mark .lensa-mark{width:100%;height:auto;display:block;overflow:visible}

.sp-mark .ls-ring path{stroke-dasharray:100;stroke-dashoffset:100;animation:lsDraw .8s var(--ease) forwards}
.sp-mark .ls-a1{animation-delay:.06s}
.sp-mark .ls-a2{animation-delay:.26s}
.sp-mark .ls-a3{animation-delay:.42s}
@keyframes lsDraw{to{stroke-dashoffset:0}}

.sp-mark .ls-lens{transform-origin:100px 90px;animation:lsLens .8s .3s var(--ease) both}
@keyframes lsLens{from{transform:scale(.16) rotate(-40deg);opacity:0}to{transform:none;opacity:1}}
.sp-mark .ls-blades{transform-origin:100px 90px;animation:lsSpin 14s linear infinite}
@keyframes lsSpin{to{transform:rotate(360deg)}}

.sp-mark .ls-corner path{opacity:0;animation:lsCorner .55s .8s var(--ease) forwards}
.sp-mark .ls-corner path:last-child{animation-delay:.92s}
@keyframes lsCorner{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}

.sp-mark .ls-dot{opacity:0;animation:lsDot .4s var(--ease) forwards}
.sp-mark .d1{animation-delay:.98s}.sp-mark .d2{animation-delay:1.06s}.sp-mark .d3{animation-delay:1.14s}
@keyframes lsDot{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

.sp-word{margin-top:26px;display:flex;justify-content:center;gap:.30em;
  font-size:clamp(30px,9vw,42px);font-weight:600;letter-spacing:.06em;color:var(--label)}
.sp-word span{display:inline-block;opacity:0;animation:lsUp .55s var(--ease) forwards}
.sp-word span:nth-child(1){animation-delay:1.12s}
.sp-word span:nth-child(2){animation-delay:1.19s}
.sp-word span:nth-child(3){animation-delay:1.26s}
.sp-word span:nth-child(4){animation-delay:1.33s}
.sp-word span:nth-child(5){animation-delay:1.40s}
@keyframes lsUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

.sp-tag{margin-top:12px;display:flex;justify-content:center;gap:9px;
  font-size:11.5px;font-weight:600;letter-spacing:.26em}
.sp-tag i{font-style:normal;opacity:0;animation:lsFade .5s var(--ease) forwards}
.sp-tag i:nth-child(1){color:var(--chrome);animation-delay:1.5s}
.sp-tag i:nth-child(2){color:#3B82F6;animation-delay:1.6s}
.sp-tag i:nth-child(3){color:#8B5CF6;animation-delay:1.7s}
@keyframes lsFade{to{opacity:1}}

.early{display:flex;align-items:center;gap:9px;margin-top:16px;font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;font-weight:600;color:var(--brass)}
.early-dot{width:6px;height:6px;border-radius:50%;background:var(--brass);animation:blinkcap 1s infinite}
.link.shelf{border-color:rgba(184,133,63,.42);background:rgba(184,133,63,.09)}
.link.shelf .glyph{background:var(--brass);color:#14100A}
.arch-pin{display:inline-block;margin:14px 0 0 8px;padding:9px 15px;border-radius:20px;
  border:1px solid rgba(184,133,63,.55);color:#7A5623;font-size:12.5px;font-weight:600;position:relative;z-index:1}
.arch-wiki{display:inline-block;margin-top:14px;font-size:12px;font-weight:600;color:var(--brass);
  text-decoration:none;border-bottom:1px solid rgba(184,133,63,.4);padding-bottom:2px;position:relative;z-index:1}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>

  function loadPrefs() {

    var known = false;
    for (var i = 0; i < LANGS.length; i++) if (LANGS[i].c === nav) known = true;

    var p = store.json('lensa.prefs', null);

    S.ui = S.lang === 'tr' ? 'tr' : 'en';

      var adj = ['Sessiz', 'Mavi', 'Uzak', 'Erken', 'Yalın', 'Derin', 'Açık', 'Gri'];
      var noun = ['Objektif', 'Diyafram', 'Kadraj', 'Poz', 'Mercek', 'Netlik', 'Işık', 'Kare'];

  /* ── 6. Kamera ─────────────────────────────────────────── */
  var video = null, finder = null;

  function stopCam() {
    if (S.stream) { S.stream.getTracks().forEach(function (tr) { tr.stop(); }); }
    S.stream = null; S.track = null; S.torch = false;
    if (video) video.classList.add('hide');
    var tb = $('torchBtn');
    if (tb) { tb.classList.add('hide'); tb.classList.remove('on'); }
  }

  function startCam() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return Promise.resolve(false);
    stopCam();
    return navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: S.facing }, width: { ideal: 1920 }, height: { ideal: 1440 } },
      audio: false
    }).then(function (st) {
      S.stream = st;
      S.track = st.getVideoTracks()[0] || null;
      video.srcObject = st;
      video.classList.remove('hide');
      $('shot').classList.add('hide');
      $('finderIdle').classList.add('hide');
      finder.classList.toggle('mirror', S.facing === 'user');
      var pl = video.play();
      if (pl && pl.catch) pl.catch(function () {});
      setupTorch();
      return true;
    }).catch(function () { return false; });
  }

  function caps() {
    try { return (S.track && S.track.getCapabilities) ? S.track.getCapabilities() : {}; }
    catch (e) { return {}; }
  }
  function setupTorch() {
    var tb = $('torchBtn');
    if (!tb) return;
    if (caps().torch) tb.classList.remove('hide');
    else tb.classList.add('hide');
  }
  function toggleTorch() {
    if (!S.track || !caps().torch) return;
    S.torch = !S.torch;
    S.track.applyConstraints({ advanced: [{ torch: S.torch }] })
      .then(function () { $('torchBtn').classList.toggle('on', S.torch); })
      .catch(function () { S.torch = false; });
  }

  /* iki parmakla yakınlaştırma */
  function setupZoom() {
    var startDist = 0, startZoom = 1;
    finder.addEventListener('touchstart', function (e) {
      if (e.touches.length !== 2 || !S.track) return;
      var c = caps();
      if (!c.zoom) return;
      startDist = dist(e.touches);
      try { startZoom = S.track.getSettings().zoom || c.zoom.min || 1; } catch (er) { startZoom = 1; }
    }, { passive: true });
    finder.addEventListener('touchmove', function (e) {
      if (e.touches.length !== 2 || !S.track) return;
      var c = caps();
      if (!c.zoom || !startDist) return;
      var z = clamp(startZoom * (dist(e.touches) / startDist), c.zoom.min, c.zoom.max);
      S.track.applyConstraints({ advanced: [{ zoom: z }] }).catch(function () {});
    }, { passive: true });
    function dist(ts) {
      var dx = ts[0].clientX - ts[1].clientX, dy = ts[0].clientY - ts[1].clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }
  }

  /* ── 7. Görsel işleme ──────────────────────────────────── */
  /* 1120 piksel görme modelleri için 1568 kadar iyi sonuç verir ama
     yüklenmesi yarı yarıya sürer. Fark doğrudan bekleme süresine yansır. */
  var MAXPX = 1120;

  function grabFrame() {
    var w = video.videoWidth, h = video.videoHeight;
    if (!w || !h) return null;
    var c = $('work'), ctx = c.getContext('2d');
    if (!ctx) return null;
    var sc = Math.min(1, MAXPX / Math.max(w, h));
    c.width = Math.round(w * sc); c.height = Math.round(h * sc);
    if (S.facing === 'user') { ctx.translate(c.width, 0); ctx.scale(-1, 1); }
    ctx.drawImage(video, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.82);
  }

  function fileToImage(file) {
    return new Promise(function (res, rej) {
      if (!/^image\//.test(file.type || '')) return rej(new Error('type'));
      var fr = new FileReader();
      fr.onload = function () {
        var img = new Image();
        img.onload = function () {
          var c = $('work'), ctx = c.getContext('2d');
          if (!ctx) return rej(new Error('canvas'));
          var sc = Math.min(1, MAXPX / Math.max(img.width, img.height));
          c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
          ctx.drawImage(img, 0, 0, c.width, c.height);
          res(c.toDataURL('image/jpeg', 0.88));
        };
        img.onerror = function () { rej(new Error('decode')); };
        img.src = fr.result;
      };
      fr.onerror = rej;
      fr.readAsDataURL(file);
    });
  }

  function shrink(dataUrl, size, q) {
    return new Promise(function (res) {
      if (!dataUrl) return res('');
      var img = new Image();
      img.onload = function () {
        var c = document.createElement('canvas'), ctx = c.getContext('2d');
        if (!ctx) return res(dataUrl);
        var sc = Math.min(1, size / Math.max(img.width, img.height));
        c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', q));
      };
      img.onerror = function () { res(dataUrl); };
      img.src = dataUrl;
    });
  }

  /* oransal kutuya göre kırp; küçük seçimleri yukarı ölçekle */
  function cropTo(dataUrl, box) {
    return new Promise(function (res) {
      var img = new Image();
      img.onload = function () {
        var sx = clamp(box.x, 0, 1) * img.width;
        var sy = clamp(box.y, 0, 1) * img.height;
        var sw = clamp(box.w, 0.02, 1) * img.width;
        var sh = clamp(box.h, 0.02, 1) * img.height;
        /* nesneyi bağlamından tamamen koparma: %8 pay bırak */
        var padX = sw * 0.08, padY = sh * 0.08;
        sx = clamp(sx - padX, 0, img.width); sy = clamp(sy - padY, 0, img.height);
        sw = Math.min(sw + padX * 2, img.width - sx); sh = Math.min(sh + padY * 2, img.height - sy);
        var scale = clamp(900 / Math.max(sw, sh), 1, 3);
        var c = document.createElement('canvas'), ctx = c.getContext('2d');
        if (!ctx) return res(dataUrl);
        c.width = Math.round(sw * scale); c.height = Math.round(sh * scale);
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.9));
      };
      img.onerror = function () { res(dataUrl); };
      img.src = dataUrl;
    });
  }

  function asPayload(dataUrl) {
    return {

      b64: dataUrl.split(',')[1],
      mime: (dataUrl.match(/^data:([^;]+);/) || [, 'image/jpeg'])[1]

  }

  /* ── 8. Nesneyi işaretle (kırpma katmanı) ──────────────── */
  function openMarker(onDone) {
    if (!S.fullImage) return;
    var lay = $('marker');
    lay.classList.remove('hide');
    lay.setAttribute('aria-hidden', 'false');
    $('markerImg').src = S.fullImage.dataUrl;
    $('markerHint').textContent = t('markHint');
    $('markerUse').textContent = t('markUse');
    $('markerCancel').textContent = t('cancel');

    var stage = $('markerStage'), boxEl = $('markerBox');
    var drag = null, box = null;
    boxEl.classList.add('hide');
    $('markerUse').disabled = true;

    function rel(ev) {
      var r = stage.getBoundingClientRect();
      var p = ev.touches ? ev.touches[0] : ev;
      return { x: clamp((p.clientX - r.left) / r.width, 0, 1), y: clamp((p.clientY - r.top) / r.height, 0, 1) };
    }
    function paint() {
      if (!box) return;
      boxEl.classList.remove('hide');
      boxEl.style.left = (box.x * 100) + '%';
      boxEl.style.top = (box.y * 100) + '%';
      boxEl.style.width = (box.w * 100) + '%';
      boxEl.style.height = (box.h * 100) + '%';
      $('markerUse').disabled = !(box.w > 0.04 && box.h > 0.04);
    }
    function down(e) { e.preventDefault(); drag = rel(e); box = { x: drag.x, y: drag.y, w: 0, h: 0 }; paint(); }
    function move(e) {
      if (!drag) return;
      e.preventDefault();
      var p = rel(e);
      box = { x: Math.min(drag.x, p.x), y: Math.min(drag.y, p.y), w: Math.abs(p.x - drag.x), h: Math.abs(p.y - drag.y) };
      paint();
    }
    function up() { drag = null; }

    stage.addEventListener('touchstart', down, { passive: false });
    stage.addEventListener('touchmove', move, { passive: false });
    stage.addEventListener('touchend', up);
    stage.addEventListener('mousedown', down);
    stage.addEventListener('mousemove', move);
    stage.addEventListener('mouseup', up);

    function close() {
      stage.removeEventListener('touchstart', down);
      stage.removeEventListener('touchmove', move);
      stage.removeEventListener('touchend', up);
      stage.removeEventListener('mousedown', down);
      stage.removeEventListener('mousemove', move);
      stage.removeEventListener('mouseup', up);

    $('markerCancel').onclick = close;

  /* ── 10. Yanıt ayrıştırma ve onarım ────────────────────── */
  function pullText(data) {
    if (!data) return '';
    if (typeof data === 'string') return data;
    if (data.content && data.content.length) {
      return data.content.map(function (b) {
        if (b.type === 'text') return b.text || '';
        if (b.type === 'mcp_tool_result' && b.content && b.content[0]) return b.content[0].text || '';
        return '';
      }).filter(Boolean).join('\n');
    }
    if (data.choices && data.choices[0]) {
      var m = data.choices[0].message;
      if (m) return typeof m.content === 'string' ? m.content : JSON.stringify(m.content);
      if (data.choices[0].text) return data.choices[0].text;
    }
    if (data.message) {
      var c = data.message.content;
      if (typeof c === 'string') return c;
      if (c && c[0] && c[0].text) return c[0].text;
    }
    if (data.text) return data.text;
    return '';
  }

  function parseJSON(raw) {
    if (!raw) return null;
    var s = String(raw).replace(/```json/gi, '').replace(/```/g, '').trim();
    var a = s.indexOf('{'), b = s.lastIndexOf('}');
    if (a < 0 || b <= a) return null;
    var body = s.slice(a, b + 1);
    var tries = [
      body,
      body.replace(/,\s*([}\]])/g, '$1'),
      body.replace(/,\s*([}\]])/g, '$1').replace(/([{,]\s*)'([^']+)'\s*:/g, '$1"$2":'),
      body.replace(/[\u0000-\u001F]+/g, ' ').replace(/,\s*([}\]])/g, '$1')
    ];
    for (var i = 0; i < tries.length; i++) {
      try { return JSON.parse(tries[i]); } catch (e) {}
    }
    return null;
  }

  /* "1.200 TL", "1,200", "1.234,56", "1,234.56" hepsi doğru okunmalı.
     Kural: son ayraçtan sonra tam üç basamak varsa o ayraç binliktir. */
  function parseNum(v) {
    if (v == null) return null;
    if (typeof v === 'number') return isFinite(v) ? v : null;
    var s = String(v).replace(/[^\d.,]/g, '');
    if (!s) return null;
    var sep = Math.max(s.lastIndexOf('.'), s.lastIndexOf(','));
    var out;
    if (sep < 0) out = s;
    else {
      var head = s.slice(0, sep), tail = s.slice(sep + 1);
      if (/^\d{3}$/.test(tail) && head && head !== '0') out = s.replace(/[.,]/g, '');
      else out = head.replace(/[.,]/g, '') + '.' + tail;
    }
    var n = parseFloat(out);
    return isFinite(n) ? n : null;
  }

  /* Modeller ara sıra alan atlar veya tip kaydırır; burada hepsini hizaya sokuyoruz. */
  function normalize(d) {
    if (!d || typeof d !== 'object') return null;
    var o = {};
    var str = function (v) { return v == null ? '' : String(v).trim(); };
    o.title = str(d.title || d.name || d.baslik);
    if (!o.title) return null;
    o.category = str(d.category || d.kategori);
    var c = parseInt(d.confidence, 10);
    o.confidence = isNaN(c) ? 60 : clamp(c, 0, 100);
    o.summary = str(d.summary || d.ozet);
    o.narration = str(d.narration || d.sesli_anlatim || o.summary);
    /* anlatımı TTS için temizle */
    o.narration = o.narration.replace(/[*_#`>]/g, '').replace(/^\s*[-•]\s*/gm, '').replace(/\s+/g, ' ').trim();
    if (!o.summary) o.summary = o.narration;

    o.evidence = Array.isArray(d.evidence) ? d.evidence.map(str).filter(Boolean).slice(0, 6) : [];
    o.others = Array.isArray(d.others) ? d.others.map(str).filter(Boolean).slice(0, 6) : [];
    o.questions = Array.isArray(d.questions) ? d.questions.map(str).filter(Boolean).slice(0, 3) : [];
    o.fact = str(d.fact);
    var RETAIL = ['market','elektronik','kozmetik','ev','yapi','giyim','kitap','spor',
      'oyuncak','bahce','evcil','eczane','ikinci_el','otomotiv','genel'];
    o.retail = RETAIL.indexOf(str(d.retail)) >= 0 ? str(d.retail) : 'genel';
    o.warning = str(d.warning) || null;

    o.specs = [];
    if (Array.isArray(d.specs)) {
      d.specs.forEach(function (s) {
        if (!s) return;
        var k = str(s.k || s.key || s.label), v = str(s.v || s.value || s.val);
        if (k && v && !/^(bilinmiyor|unknown|n\/a|-)$/i.test(v)) o.specs.push({ k: k, v: v });
      });
    } else if (d.specs && typeof d.specs === 'object') {
      Object.keys(d.specs).forEach(function (k) {
        var v = str(d.specs[k]);
        if (v) o.specs.push({ k: k, v: v });
      });
    }
    o.specs = o.specs.slice(0, 8);

    var p = d.price || {};
    o.price = { min: parseNum(p.min), max: parseNum(p.max), cur: str(p.cur || p.currency) || langInfo(S.lang).cur, note: str(p.note) };
    if (o.price.min != null && o.price.max != null && o.price.min > o.price.max) {
      var tmp = o.price.min; o.price.min = o.price.max; o.price.max = tmp;
    }
    if (o.price.min == null || o.price.max == null) { o.price.min = null; o.price.max = null; }

    var se = d.search || {};
    o.search = { local: str(se.local) || o.title, global: str(se.global) || str(se.local) || o.title };

    var pair = function (arr) {
      if (!Array.isArray(arr)) return [];
      return arr.map(function (w) {
        if (!w) return null;
        if (typeof w === 'string') return { name: w, why: '' };
        return { name: str(w.name), why: str(w.why) };
      }).filter(function (w) { return w && w.name; }).slice(0, 5);
    };
    var hv = d.heritage;
    o.heritage = null;
    if (hv && typeof hv === 'object' && (str(hv.story) || str(hv.built) || str(hv.era))) {
      var line = function (v) { return str(v).replace(/[*_#`>]/g, '').replace(/\s+/g, ' '); };
      o.heritage = {
        era: str(hv.era), built: str(hv.built), patron: str(hv.patron),
        architect: str(hv.architect), style: str(hv.style), status: str(hv.status),
        story: line(hv.story), visit: line(hv.visit),
        wiki: str(hv.wiki), pinned: (typeof hv.pinned === 'number' ? hv.pinned : null),
        timeline: Array.isArray(hv.timeline) ? hv.timeline.map(function (x) {
          if (!x) return null;
          if (typeof x === 'string') return null;
          return { y: str(x.y || x.year), e: line(x.e || x.event) };
        }).filter(function (x) { return x && x.y && x.e; }).slice(0, 5) : []
      };
    }
    o.where = pair(d.where);
    o.alts = pair(d.alts);
    return o;
  }

  /* ── 11. Sağlayıcılar ──────────────────────────────────── */
  function loadScript(src) {
    return new Promise(function (res, rej) {
      if (document.querySelector('script[data-src="' + src + '"]')) return res();
      var s = document.createElement('script');
      s.src = src; s.async = true;
      s.setAttribute('data-src', src);
      s.onload = function () { res(); };
      s.onerror = function () { rej(new Error('script yüklenemedi')); };
      document.head.appendChild(s);
    });
  }

  function imagesFor(imgs) { return imgs.filter(Boolean); }

  /* Akış halinde gelen yanıtı parçala; her parçada erken gösterim tetiklenir */
  function pumpSSE(reader, dec, state, onPartial) {
    return reader.read().then(function (res) {
      if (res.done) return state.text;
      state.buf += dec.decode(res.value, { stream: true });
      var lines = state.buf.split('\n');
      state.buf = lines.pop();
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i];
        if (line.indexOf('data:') !== 0) continue;
        try {
          var ev = JSON.parse(line.slice(5).trim());
          if (ev.type === 'content_block_delta' && ev.delta) {
            var chunk = ev.delta.text || ev.delta.partial_json || '';
            if (chunk) {
              state.text += chunk;
              if (onPartial) onPartial(state.text);
            }
          }
        } catch (e) {}
      }
      return pumpSSE(reader, dec, state, onPartial);
    });
  }

  /* A — Anthropic (Claude içinde anahtarsız, dışarıda anahtarla) */
  function pAnthropic(system, prompt, imgs, onPartial) {
    var content = [];
    imagesFor(imgs).forEach(function (im) {
      content.push({ type: 'image', source: { type: 'base64', media_type: im.mime, data: im.b64 } });
    });
    content.push({ type: 'text', text: prompt });
    var headers = { 'Content-Type': 'application/json' };
    if (S.apiKey) {
      headers['x-api-key'] = S.apiKey;
      headers['anthropic-version'] = '2023-06-01';
      headers['anthropic-dangerous-direct-browser-access'] = 'true';
    }
    var ctrl = new AbortController();
    S.abort = ctrl;
    var canStream = !!(onPartial && window.ReadableStream && window.TextDecoder);
    return withTimeout(fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST', headers: headers, signal: ctrl.signal,
      body: JSON.stringify({
        model: 'claude-sonnet-4-6', max_tokens: 1200, system: system,
        stream: canStream, messages: [{ role: 'user', content: content }]
      })
    }).then(function (r) {
      if (!r.ok) throw new Error('anthropic ' + r.status);
      if (!canStream || !r.body || !r.body.getReader) {
        return r.json().then(function (d) { return pullText(d); });
      }
      return pumpSSE(r.body.getReader(), new TextDecoder(), { buf: '', text: '' }, onPartial);
    }).then(function (txt) {
      if (!txt) throw new Error('empty');
      return { text: txt, via: 'Claude' };
    }), 60000, ctrl);
  }

  /* Puter, oturum açık değilken kendi giriş sayfasına yönlendiriyor ve
     kullanıcı uygulamadan kopuyor. Bu yüzden ancak iki durumda çağırıyoruz:
     kullanıcı Puter'ı elle seçtiyse, ya da zaten oturum açıksa. */
  var PUTER_URL = 'https://js.puter.com/v2/';
  function puterGate(explicit) {
    return loadScript(PUTER_URL).then(function () {
      if (!window.puter || !window.puter.ai) throw new Error('puter yok');
      if (explicit) return window.puter;
      var signed = false;
      try {
        signed = !!(window.puter.auth && typeof window.puter.auth.isSignedIn === 'function' &&
          window.puter.auth.isSignedIn());
      } catch (e) { signed = false; }
      if (!signed) throw new Error('puter-auth');
      return window.puter;
    });
  }

  /* B — Puter.js (anahtarsız) */
  function pPuter(system, prompt, imgs) {
    return puterGate(S.provider === 'puter').then(function (puter) {
      if (!puter.ai.chat) throw new Error('puter yok');
      var first = imagesFor(imgs)[0];
      var full = system + '\n\n' + prompt;
      return withTimeout(
        first ? puter.ai.chat(full, first.dataUrl) : puter.ai.chat(full),
        60000, null
      );
    }).then(function (r) {
      var txt = pullText(r) || (typeof r === 'string' ? r : '');
      if (!txt) throw new Error('empty');
      return { text: txt, via: 'Puter' };
    });
  }

  /* C — Pollinations (anahtarsız yedek) */
  function pPollinations(system, prompt, imgs) {
    var content = [{ type: 'text', text: prompt }];
    imagesFor(imgs).forEach(function (im) {
      content.push({ type: 'image_url', image_url: { url: im.dataUrl } });
    });
    var ctrl = new AbortController();
    S.abort = ctrl;
    return withTimeout(fetch('https://text.pollinations.ai/openai', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, signal: ctrl.signal,
      body: JSON.stringify({
        model: 'openai', max_tokens: 1200,
        messages: [{ role: 'system', content: system }, { role: 'user', content: content }]
      })
    }).then(function (r) {
      if (!r.ok) throw new Error('pollinations ' + r.status);
      return r.json();
    }).then(function (d) {
      var txt = pullText(d);
      if (!txt) throw new Error('empty');
      return { text: txt, via: 'Pollinations' };
    }), 60000, ctrl);
  }

  /* D — kullanıcının kendi OpenAI uyumlu ucu */
  function pCustom(system, prompt, imgs) {
    var base = S.customBase.replace(/\/+$/, '');
    var content = [{ type: 'text', text: prompt }];
    imagesFor(imgs).forEach(function (im) {
      content.push({ type: 'image_url', image_url: { url: im.dataUrl } });
    });
    var ctrl = new AbortController();
    S.abort = ctrl;
    return withTimeout(fetch(base + '/chat/completions', {
      method: 'POST', signal: ctrl.signal,
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + S.customKey },
      body: JSON.stringify({
        model: S.customModel || 'gpt-4o-mini', max_tokens: 1500,
        messages: [{ role: 'system', content: system }, { role: 'user', content: content }]
      })
    }).then(function (r) {
      if (!r.ok) throw new Error('custom ' + r.status);
      return r.json();
    }).then(function (d) {
      var txt = pullText(d);
      if (!txt) throw new Error('empty');
      return { text: txt, via: S.customModel || 'Özel uç' };
    }), 60000, ctrl);
  }

  var PROVIDERS = { anthropic: pAnthropic, puter: pPuter, pollinations: pPollinations, custom: pCustom };

  function providerOrder() {
    if (S.provider !== 'auto') {
      var only = PROVIDERS[S.provider];
      return only ? [only] : [pAnthropic];
    }
    var list = [];
    if (S.customBase && S.customKey) list.push(pCustom);
    list.push(pAnthropic, pPollinations, pPuter);
    return list;
  }

  /* Zincir: sırayla dene, ağ hatasında bir kez tekrarla, hepsi düşerse en anlamlı hatayı döndür */
  function chain(system, prompt, imgs, onPartial) {
    if (!navigator.onLine) return Promise.reject(new Error('offline'));
    var list = providerOrder(), i = 0, lastErr = null;
    function attempt(fn, retried) {
      return fn(system, prompt, imgs, onPartial).catch(function (e) {
        var msg = String(e && e.message || e);
        var retryable = /timeout|Failed to fetch|NetworkError|5\d\d|429/i.test(msg);
        if (!retried && retryable && navigator.onLine) {
          return new Promise(function (r) { setTimeout(r, 900); }).then(function () { return attempt(fn, true); });
        }
        throw e;
      });
    }
    function next() {
      if (i >= list.length) return Promise.reject(lastErr || new Error('all-failed'));
      var fn = list[i++];
      return attempt(fn, false).catch(function (e) { lastErr = e; return next(); });
    }
    return next();
  }

  /* Sadece metin isteyen çağrılar (takip soruları) */
  function chainText(system, prompt, imgs) {
    return chain(system, prompt, imgs).then(function (r) {
      return { text: String(r.text || '').replace(/```/g, '').trim(), via: r.via };
    });
  }

  /* JSON isteyen çağrılar: ayrıştır, onar, gerekirse bir kez daha iste */
  function chainJSON(system, prompt, imgs, onPartial) {
    return chain(system, prompt, imgs, onPartial).then(function (r) {
      var d = normalize(parseJSON(r.text));
      if (d) return { data: d, via: r.via };
      return chain(system, prompt + '\n\nONEMLI: Onceki yanit gecersizdi. SADECE gecerli JSON dondur, baska hicbir sey yazma.', imgs)
        .then(function (r2) {
          var d2 = normalize(parseJSON(r2.text));
          if (!d2) throw new Error('parse');
          return { data: d2, via: r2.via };
        });
    });
  }

  /* ── 12. Sesli anlatım ─────────────────────────────────── */

  /* Ekranda doğru duran şeyler kulakta yanlış duruluyor.
     Sembolleri, kısaltmaları ve aralıkları söylenebilir hale getir. */
  function speakable(text) {
    var s = ' ' + String(text || '') + ' ';
    var tr = S.lang === 'tr';
    var W = tr
      ? { pct: ' yüzde ', range: '$1 ile $2', cm: ' santimetre', mm: ' milimetre', m: ' metre',
          kg: ' kilogram', g: ' gram', l: ' litre', ml: ' mililitre', w: ' vat', v: ' volt',
          vb: 've benzeri', orn: 'örneğin', yak: 'yaklaşık', deg: ' derece', x: ' çarpı ' }
      : { pct: ' percent ', range: '$1 to $2', cm: ' centimetres', mm: ' millimetres', m: ' metres',
          kg: ' kilograms', g: ' grams', l: ' litres', ml: ' millilitres', w: ' watts', v: ' volts',
          vb: 'and so on', orn: 'for example', yak: 'about', deg: ' degrees', x: ' by ' };
    var CUR = tr
      ? { '₺': 'lira', '$': 'dolar', '€': 'avro', '£': 'sterlin' }
      : { '₺': 'lira', '$': 'dollars', '€': 'euros', '£': 'pounds' };

    /* 1 — biçim işaretlerini at */
    s = s.replace(/[*_#`>|~]/g, '');

    /* 2 — binlik ayracı sayının içinden çıkar; yoksa "bir nokta iki yüz" diye okunur */
    s = s.replace(/(\d)\.(\d{3})(?!\d)/g, '$1$2').replace(/(\d),(\d{3})(?!\d)/g, '$1$2');

    /* 3 — para birimi her zaman sayıdan sonra söylenir */
    Object.keys(CUR).forEach(function (sym) {
      var esc = sym.replace(/[$]/g, '\\$');
      s = s.replace(new RegExp(esc + '\\s*(\\d[\\d.,]*)', 'g'), '$1 ' + CUR[sym]);
      s = s.replace(new RegExp('(\\d[\\d.,]*)\\s*' + esc, 'g'), '$1 ' + CUR[sym]);
    });
    s = s.replace(/(\d)\s*(TL|TRY)\b/gi, '$1 ' + CUR['₺'])
         .replace(/(\d)\s*USD\b/gi, '$1 ' + CUR.$)
         .replace(/(\d)\s*EUR\b/gi, '$1 ' + CUR['€']);

    /* 4 — yüzde, aralık, çarpı, derece */
    s = s.replace(/%\s*(\d)/g, W.pct + '$1').replace(/(\d)\s*%/g, '$1' + W.pct);
    s = s.replace(/(\d+)\s*[–—-]\s*(\d+)/g, W.range);
    s = s.replace(/(\d)\s*[x×]\s*(\d)/gi, '$1' + W.x + '$2');
    s = s.replace(/(\d)\s*°\s*C?\b/g, '$1' + W.deg);

    /* 5 — ölçü birimleri, uzundan kısaya */
    s = s.replace(/(\d)\s*mm\b/g, '$1' + W.mm).replace(/(\d)\s*cm\b/g, '$1' + W.cm)
         .replace(/(\d)\s*kg\b/g, '$1' + W.kg).replace(/(\d)\s*ml\b/g, '$1' + W.ml)
         .replace(/(\d)\s*lt\b/gi, '$1' + W.l)
         .replace(/(\d)\s*m\b/g, '$1' + W.m).replace(/(\d)\s*gr?\b/g, '$1' + W.g)
         .replace(/(\d)\s*l\b/g, '$1' + W.l)
         .replace(/(\d)\s*W\b/g, '$1' + W.w).replace(/(\d)\s*V\b/g, '$1' + W.v);

    /* 6 — kısaltmalar ve parantezler */
    s = s.replace(/\bvb\.?/gi, W.vb).replace(/\bör\.?/gi, W.orn)
         .replace(/\be\.g\./gi, W.orn).replace(/\betc\.?/gi, W.vb)
         .replace(/\byak\.(?=\s)/gi, W.yak).replace(/\bapprox\.?/gi, W.yak);
    s = s.replace(/\(([^)]{1,40})\)/g, ', $1,');

    return s.replace(/\s+([.,!?])/g, '$1').replace(/\s{2,}/g, ' ').trim();
  }

  var VOICE_HINT = { tr: 'Filiz', en: 'Joanna', de: 'Vicki', fr: 'Lea', es: 'Lucia',
    it: 'Bianca', pt: 'Camila', nl: 'Lotte', ru: 'Tatyana', ar: 'Zeina', pl: 'Ewa',
    ja: 'Mizuki', ko: 'Seoyeon', zh: 'Zhiyu', hi: 'Aditi' };

  var TTS = {
    queue: [], idx: 0, on: false, unlocked: false, audio: null, token: 0,

    unlock: function () {
      if (this.unlocked || !window.speechSynthesis) return;
      try {
        var u = new SpeechSynthesisUtterance(' ');
        u.volume = 0;
        speechSynthesis.speak(u);
        this.unlocked = true;
      } catch (e) {}
    },

    voices: function () {
      if (!window.speechSynthesis) return [];
      var all = speechSynthesis.getVoices() || [], base = S.lang.toLowerCase();
      return all.filter(function (v) { return v.lang.toLowerCase().replace('_', '-').indexOf(base) === 0; });
    },
    voice: function () {
      var pool = this.voices();
      if (!pool.length) return null;
      if (S.voiceURI) {
        for (var i = 0; i < pool.length; i++) if (pool[i].voiceURI === S.voiceURI) return pool[i];
      }
      var want = langInfo(S.lang).v.toLowerCase();
      var exact = pool.filter(function (v) { return v.lang.toLowerCase().replace('_', '-') === want; });
      var p = exact.length ? exact : pool;
      /* iOS'ta indirilmiş gelişmiş sesler adlarında bunları taşır */
      var nice = p.filter(function (v) { return /premium|enhanced|neural|natural|siri|google/i.test(v.name); });
      return nice[0] || p[0];
    },

    /* Cümleleri kulağa rahat gelen uzunlukta grupla */
    chunk: function (text) {
      var parts = String(text).match(/[^.!?…]+[.!?…]*/g) || [String(text)];
      var out = [], cur = '';
      parts.forEach(function (p) {
        if ((cur + p).length > 150 && cur) { out.push(cur.trim()); cur = p; }
        else cur += p;
      });
      if (cur.trim()) out.push(cur.trim());
      return out.filter(Boolean);
    },

    speak: function (text) {
      if (!text) return;
      this.stop();
      var clean = speakable(text);
      this.on = true;
      this.token++;
      paintTransport();
      var self = this, my = this.token;

      if (S.voiceEngine === 'natural' || S.voiceEngine === 'auto') {
        this.natural(clean).then(function (ok) {
          if (my !== self.token) return;
          if (!ok) self.device(clean, my);
        });
        return;
      }
      this.device(clean, my);
    },

    /* Doğal ses: bulut TTS. Başarısız olursa sessizce cihaz sesine düşer. */
    natural: function (text) {
      var self = this, my = this.token;
      return puterGate(S.voiceEngine === 'natural').then(function (puter) {
        if (!puter.ai.txt2speech) throw new Error('yok');
        var opt = { language: langInfo(S.lang).v };
        if (VOICE_HINT[S.lang]) opt.voice = VOICE_HINT[S.lang];
        return withTimeout(puter.ai.txt2speech(text.slice(0, 2800), opt), 20000, null);
      }).then(function (a) {
        if (my !== self.token) return true;
        var audio = (a && a.play) ? a : (a && a.audio ? a.audio : null);
        if (!audio || !audio.play) throw new Error('ses yok');
        self.audio = audio;
        audio.playbackRate = S.rate;
        audio.onended = function () { if (my === self.token) { self.on = false; paintTransport(); } };
        audio.onerror = function () { if (my === self.token) { self.on = false; paintTransport(); } };
        var pr = audio.play();
        if (pr && pr.catch) pr.catch(function () {});
        return true;
      }).catch(function () { return false; });
    },

    /* Cihaz sesi: parçalar arasına küçük bir nefes koyarak okur */
    device: function (text, my) {
      if (!window.speechSynthesis) {
        this.on = false; paintTransport();
        toast(S.ui === 'tr' ? 'Bu cihazda sesli okuma yok.' : 'Speech is unavailable here.');
        return;
      }
      this.queue = this.chunk(text);
      this.idx = 0;
      this.step(my == null ? this.token : my);
    },
    step: function (my) {
      var self = this;
      if (!self.on || my !== self.token || self.idx >= self.queue.length) {
        if (my === self.token) { self.on = false; paintTransport(); }
        return;
      }
      var piece = self.queue[self.idx];
      var u = new SpeechSynthesisUtterance(piece);
      var v = self.voice();
      if (v) u.voice = v;
      u.lang = langInfo(S.lang).v;
      u.rate = S.rate * 0.97;
      u.pitch = 1;
      var next = function () {
        if (my !== self.token) return;
        self.idx++;
        /* cümle sonunda nefes, virgülle biten parçada daha kısa */
        setTimeout(function () { self.step(my); }, /[.!?…]$/.test(piece) ? 190 : 90);
      };
      u.onend = next;
      u.onerror = next;
      try { speechSynthesis.speak(u); } catch (e) { self.on = false; paintTransport(); }
    },

    sample: function () {
      this.unlock();
      this.speak(S.lang === 'tr'
        ? 'Elindeki şey bir moka pot. Alt hazneye su, huniye öğütülmüş kahve koyup ocağa alıyorsun.'
        : 'What you are holding is a moka pot. You put water in the base and ground coffee in the funnel.');
    },
    toggle: function (text) { if (this.on) this.stop(); else this.speak(text); },
    stop: function () {
      this.token++;
      this.on = false; this.queue = []; this.idx = 0;
      if (this.audio) { try { this.audio.pause(); this.audio.currentTime = 0; } catch (e) {} this.audio = null; }
      try { speechSynthesis.cancel(); } catch (e) {}
      paintTransport();
    }
  };

      if (d.where.length) {
        h.push('<div style="height:12px"></div><div class="chips">');
        d.where.forEach(function (w) {
          h.push('<a class="chip" target="_blank" rel="noopener" title="' + esc(w.why) + '" href="https://www.google.com/search?q=' +
            encodeURIComponent(w.name + ' ' + (d.search.local || d.title)) + '">' + esc(w.name) + '</a>');

    if (shop && d.alts.length) {

      d.alts.forEach(function (a) {

    if (d.heritage) {
      var H = d.heritage;
      h.push('<section class="archive">');
      h.push('<div class="archive-top"><span class="arch-eyebrow">' + esc(t('heritage')) + '</span>');

        h.push('<dl class="specs arch-specs">');
        shown.forEach(function (f) {

        h.push('<p class="arch-story">' + esc(H.story) + '</p>');
        h.push('<button class="arch-listen" id="histPlay">' + ICON.play + '<span>' + esc(t('hListen')) + '</span></button>');
        if (!H.wiki) h.push('<button class="arch-pin" id="pinBtn">' + esc(S.ui === 'tr' ? 'Konumla doğrula' : 'Confirm by location') + '</button>');
      }
      if (H.timeline.length) {
        h.push('<ol class="timeline">');
        H.timeline.forEach(function (x) {

        h.push('<a class="arch-wiki" target="_blank" rel="noopener" href="' + H.wiki + '">' +

      d.others.forEach(function (o) {
