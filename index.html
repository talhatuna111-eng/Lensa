<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0E1113">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LENSA">
<meta name="description" content="Bilmediğin şeyin fotoğrafını çek. LENSA ne olduğunu sesli anlatsın, nerede bulunacağını söylesin.">
<title>LENSA — Ne bu? Nerede bulunur?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ─────────────────────────────────────────────
   LENSA — tasarım belirteçleri
   Kamera karanlıkta çalışır, cevap ışıkta durur.
   Vizör soğuk mürekkep siyahı; cevap müze etiketi
   gibi kemik rengi bir plaket. Metal her yerde pirinç.
   ───────────────────────────────────────────── */
:root{
  --void:#0E1113; --void-2:#161A1D; --void-3:#1E2327;
  --label:#EDE7DA; --ink:#15181A; --ink-soft:#5A5A52;
  --brass:#B8853F; --brass-hi:#E0AE63;
  --patina:#4C6B63; --alarm:#B4523C;
  --chrome:#9AA0A2; --chrome-2:#5F686C;
  --line:rgba(255,255,255,.10); --line-ink:rgba(21,24,26,.14);
  --r-s:10px; --r-m:16px; --r-l:24px; --pad:18px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --disp:"Bodoni Moda",'Times New Roman',Georgia,serif;
  --ui:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--void);color:var(--label);
  font-family:var(--ui);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
button[disabled]{opacity:.4;cursor:default}
a{color:inherit}
:focus-visible{outline:2px solid var(--brass-hi);outline-offset:3px;border-radius:6px}
::selection{background:var(--brass);color:#111}
.hide{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── kabuk ───────────────────────────────── */
#app{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;position:relative}
.topbar{
  position:sticky;top:0;z-index:40;
  padding:calc(var(--safe-t) + 12px) var(--pad) 12px;
  display:flex;align-items:center;gap:10px;
  background:linear-gradient(180deg,var(--void) 62%,rgba(14,17,19,0));
}
.wordmark{font-family:var(--disp);font-size:21px;letter-spacing:.26em;font-weight:500;margin-right:auto;padding-left:.26em}
.wordmark b{color:var(--brass-hi);font-weight:500}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);color:var(--chrome);transition:.2s var(--ease)}
.icon-btn:active{transform:scale(.92);background:var(--void-2)}
.lang-btn{width:auto;padding:0 12px;font-size:11px;font-weight:600;letter-spacing:.1em;border-radius:19px}
main{flex:1;display:flex;flex-direction:column;min-height:0}
.view{display:none;flex:1;flex-direction:column;min-height:0}
.view.active{display:flex}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 var(--pad) calc(var(--safe-b) + 108px)}

#netbar{
  position:fixed;top:0;left:0;right:0;z-index:80;text-align:center;
  padding:calc(var(--safe-t) + 7px) 12px 7px;background:var(--alarm);color:#fff;
  font-size:12px;font-weight:600;letter-spacing:.04em;
  transform:translateY(-110%);transition:transform .3s var(--ease);
}
#netbar.on{transform:none}

/* ── mod seçimi ──────────────────────────── */
.modes,.filterbar{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.modes::-webkit-scrollbar,.filterbar::-webkit-scrollbar{display:none}
.modes{padding:2px var(--pad) 14px}
.filterbar{padding:0 0 14px}
.mode{
  flex:0 0 auto;padding:8px 14px;border-radius:20px;border:1px solid var(--line);
  color:var(--chrome);font-size:12.5px;font-weight:500;white-space:nowrap;transition:.2s var(--ease);
}
.mode[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:#14100A;font-weight:600}

/* ── vizör ───────────────────────────────── */
.finder-wrap{padding:0 var(--pad);flex:1;display:flex;flex-direction:column;min-height:0}
.finder{
  position:relative;flex:1;min-height:290px;border-radius:var(--r-l);overflow:hidden;
  background:#08090A;border:1px solid var(--line);display:grid;place-items:center;
}
.finder video,.finder img.shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.finder.mirror video{transform:scaleX(-1)}
.finder-idle{position:relative;z-index:2;text-align:center;padding:32px 26px;max-width:300px}
.finder-idle h2{font-family:var(--disp);font-weight:400;font-size:26px;line-height:1.22;margin:14px 0 8px}
.finder-idle p{color:var(--chrome-2);font-size:13.5px;margin:0}
.aperture-mark{color:var(--brass);opacity:.85}
.ticks span{position:absolute;width:22px;height:22px;border:1.5px solid rgba(224,174,99,.55);pointer-events:none}
.ticks span:nth-child(1){top:14px;left:14px;border-right:0;border-bottom:0;border-radius:4px 0 0 0}
.ticks span:nth-child(2){top:14px;right:14px;border-left:0;border-bottom:0;border-radius:0 4px 0 0}
.ticks span:nth-child(3){bottom:14px;left:14px;border-right:0;border-top:0;border-radius:0 0 0 4px}
.ticks span:nth-child(4){bottom:14px;right:14px;border-left:0;border-top:0;border-radius:0 0 4px 0}
.finder .torch{position:absolute;top:12px;right:12px;z-index:4;width:38px;height:38px;border-radius:50%;
  display:grid;place-items:center;background:rgba(8,9,10,.6);backdrop-filter:blur(6px);color:var(--chrome);border:1px solid var(--line)}
.finder .torch.on{color:var(--brass-hi);border-color:var(--brass)}

.sweep{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;overflow:hidden}
.sweep.on{opacity:1}
.sweep::after{
  content:"";position:absolute;left:0;right:0;height:120px;
  background:linear-gradient(180deg,transparent,rgba(224,174,99,.16) 46%,rgba(224,174,99,.9) 50%,rgba(224,174,99,.16) 54%,transparent);
  animation:sweep 1.9s var(--ease) infinite;
}
@keyframes sweep{0%{top:-120px}100%{top:100%}}

/* ── deklanşör satırı ────────────────────── */
.shutter-row{display:flex;align-items:center;justify-content:center;gap:34px;padding:20px 0 calc(var(--safe-b) + 14px)}
.shutter{width:76px;height:76px;border-radius:50%;position:relative;display:grid;place-items:center;
  border:1.5px solid var(--brass);transition:transform .16s var(--ease)}
.shutter::before{content:"";position:absolute;inset:6px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,var(--brass-hi),var(--brass) 62%,#7C5824);transition:inset .16s var(--ease)}
.shutter:active{transform:scale(.95)}
.shutter:active::before{inset:12px}
.shutter-ring{position:absolute;inset:-7px;border-radius:50%;border:1px dashed rgba(184,133,63,.45)}
.side-btn{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;border:1px solid var(--line);color:var(--chrome);transition:.2s var(--ease)}
.side-btn:active{transform:scale(.93);background:var(--void-2)}

/* ── plaka + plaket ──────────────────────── */
.result-top{display:flex;gap:8px;padding:12px 0 10px}
.ghost-chip{display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:20px;
  border:1px solid var(--line);color:var(--chrome);font-size:12.5px;font-weight:500;transition:.18s var(--ease)}
.ghost-chip:active{transform:scale(.96);background:var(--void-2)}
.plate{border-radius:var(--r-m);overflow:hidden;background:#0A0C0D;border:1px solid var(--line);margin-bottom:-22px;position:relative}
.plate img{display:block;width:100%;max-height:44dvh;object-fit:cover}
.plate .kat{position:absolute;left:12px;top:12px;padding:5px 10px;border-radius:6px;background:rgba(10,12,13,.72);
  backdrop-filter:blur(6px);font-size:10px;letter-spacing:.16em;font-weight:600;color:var(--brass-hi)}
.plate.scanning img{filter:grayscale(.72) contrast(1.06) brightness(.66)}
.plate.scanning .kat{color:var(--chrome);letter-spacing:.2em}

.card{background:var(--label);color:var(--ink);border-radius:var(--r-l);padding:22px 20px 26px;position:relative;
  box-shadow:0 -18px 44px rgba(0,0,0,.5);animation:rise .5s var(--ease) both}
@keyframes rise{from{transform:translateY(26px);opacity:0}to{transform:none;opacity:1}}
.card::before{content:"";position:absolute;left:20px;right:20px;top:11px;height:2px;
  background:linear-gradient(90deg,transparent,var(--brass) 12%,var(--brass) 88%,transparent);opacity:.55}
.card .kicker{font-size:10.5px;letter-spacing:.19em;text-transform:uppercase;font-weight:600;color:var(--brass);margin-bottom:8px}
.card h1{font-family:var(--disp);font-weight:500;font-size:clamp(30px,8.4vw,40px);line-height:1.06;margin:0 0 12px;letter-spacing:-.01em}
.hallmark{display:inline-flex;align-items:center;gap:7px;padding:6px 12px 6px 9px;border:1px solid rgba(184,133,63,.55);
  border-radius:20px;font-size:11.5px;font-weight:600;letter-spacing:.05em;color:#7A5623;background:rgba(184,133,63,.09)}
.hallmark.low{border-color:rgba(180,82,60,.5);color:var(--alarm);background:rgba(180,82,60,.08)}
.hallmark.sure{border-color:rgba(76,107,99,.5);color:#33544C;background:rgba(76,107,99,.09)}
.lede{font-size:15.5px;line-height:1.62;margin:16px 0 0;color:#2B2E30}
.rule{height:1px;background:var(--line-ink);margin:22px 0 16px}
.sec-title{font-size:10.5px;letter-spacing:.19em;text-transform:uppercase;font-weight:700;color:var(--ink-soft);margin:0 0 12px}

dl.specs{margin:0}
.spec{display:flex;align-items:baseline;gap:6px;padding:7px 0;font-size:14px}
.spec dt{color:var(--ink-soft);flex:0 0 auto;max-width:46%}
.spec .lead{flex:1;border-bottom:1px dotted rgba(21,24,26,.28);transform:translateY(-4px)}
.spec dd{margin:0;flex:0 0 auto;font-weight:600;text-align:right;max-width:52%}
.spec.alt dt{color:var(--ink);font-weight:600;max-width:50%}
.spec.alt dd{font-weight:400;color:var(--ink-soft);font-size:13px;max-width:48%}

.transport{display:flex;align-items:center;gap:12px;margin-top:18px;padding:11px 12px;
  border:1px solid var(--line-ink);border-radius:14px;background:rgba(21,24,26,.035)}
.play{width:44px;height:44px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;
  background:var(--ink);color:var(--label);transition:transform .15s var(--ease)}
.play:active{transform:scale(.93)}
.bars{flex:1;display:flex;align-items:center;gap:2.5px;height:26px;overflow:hidden}
.bars i{flex:1;background:rgba(21,24,26,.2);border-radius:2px;height:22%;transition:height .18s var(--ease),background .18s}
.bars.on i{background:var(--brass);animation:eq .9s ease-in-out infinite}
.bars.on i:nth-child(3n){animation-delay:.15s}
.bars.on i:nth-child(3n+1){animation-delay:.3s}
.bars.on i:nth-child(4n){animation-delay:.45s}
@keyframes eq{0%,100%{height:20%}50%{height:88%}}
.rate{padding:6px 10px;border:1px solid var(--line-ink);border-radius:9px;font-size:12px;font-weight:600;color:var(--ink-soft)}

.warn{display:flex;gap:10px;padding:12px 14px;border-radius:12px;margin-top:16px;
  background:rgba(180,82,60,.1);border:1px solid rgba(180,82,60,.3);font-size:13.5px;line-height:1.5;color:#7C3626}

.links{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.link{display:flex;align-items:center;gap:9px;padding:12px 13px;border-radius:12px;border:1px solid var(--line-ink);
  text-decoration:none;font-size:13.5px;font-weight:600;background:rgba(255,255,255,.42);transition:.16s var(--ease)}
.link:active{transform:scale(.975);background:rgba(184,133,63,.14)}
.link .glyph{width:26px;height:26px;flex:0 0 auto;border-radius:8px;display:grid;place-items:center;
  background:var(--ink);color:var(--label);font-size:11px;font-weight:700}
.link.wide{grid-column:1/-1}
.link small{display:block;font-weight:400;font-size:11px;color:var(--ink-soft)}

.pricebox{display:flex;align-items:flex-end;gap:10px;padding:14px 16px;border-radius:14px;
  border:1px dashed rgba(184,133,63,.5);background:rgba(184,133,63,.07)}
.pricebox .amount{font-family:var(--disp);font-size:27px;line-height:1;font-weight:500}
.pricebox small{color:var(--ink-soft);font-size:11.5px;line-height:1.4}

.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:9px 13px;border-radius:18px;border:1px solid var(--line-ink);font-size:13px;font-weight:500;
  background:rgba(255,255,255,.4);transition:.16s var(--ease);text-align:left;text-decoration:none;color:var(--ink)}
.chip:active{transform:scale(.96);background:rgba(184,133,63,.16)}
.chip.flat{pointer-events:none;background:transparent;color:var(--ink-soft);font-size:12.5px}
.chip .tiny{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--brass);margin-left:5px}

.qa{margin-top:12px}
.qa-item{padding:13px 0;border-top:1px solid var(--line-ink)}
.qa-item .q{font-weight:700;font-size:13.5px;margin-bottom:5px}
.qa-item .a{font-size:14px;line-height:1.6;color:#2B2E30}
.ask-row{display:flex;gap:8px;margin-top:14px}
.ask-row input{flex:1;padding:13px 15px;border-radius:13px;border:1px solid var(--line-ink);
  background:rgba(255,255,255,.55);font-size:15px}
.ask-row input::placeholder{color:#9A968E}
.ask-row button{width:48px;border-radius:13px;background:var(--ink);color:var(--label);display:grid;place-items:center}

.card-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:22px}
.act{padding:13px 6px;border-radius:13px;border:1px solid var(--line-ink);font-size:12px;font-weight:600;
  display:flex;flex-direction:column;align-items:center;gap:6px;background:rgba(255,255,255,.42);transition:.16s var(--ease)}
.act:active{transform:scale(.96)}
.act.filled{background:var(--ink);color:var(--label);border-color:var(--ink)}
.act.done{background:var(--patina);border-color:var(--patina);color:#fff}

.fact{margin-top:20px;padding:16px 18px;border-radius:14px;background:rgba(21,24,26,.055);font-size:14px;line-height:1.6}
.fact b{display:block;font-family:var(--disp);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--brass);margin-bottom:6px;font-weight:600}
.provenance{margin-top:18px;font-size:10.5px;letter-spacing:.06em;color:#96918A;text-align:center}
.card .provenance{color:#96918A}

.skeleton{padding:26px 20px;background:var(--label);border-radius:var(--r-l);color:var(--ink)}
.sk-line{height:13px;border-radius:6px;background:rgba(21,24,26,.1);margin-bottom:11px;animation:pulse 1.3s ease-in-out infinite}
.sk-line.tall{height:34px;width:68%;margin-bottom:18px}
.sk-line.w7{width:72%}.sk-line.w5{width:52%}
@keyframes pulse{50%{opacity:.42}}
.skeleton .stage{margin-top:20px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;color:#8A8578}

/* ── ızgara: koleksiyon ve akış ──────────── */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;padding-top:4px}
.tile{border-radius:var(--r-m);overflow:hidden;background:var(--void-2);border:1px solid var(--line);position:relative}
.tile-main{display:block;width:100%;text-align:left;transition:.18s var(--ease)}
.tile-main:active{transform:scale(.98)}
.tile img,.tile .noimg{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#0A0C0D}
.tile .meta{padding:11px 12px 13px}
.tile .tt{font-family:var(--disp);font-size:16px;line-height:1.2;margin-bottom:4px}
.tile .ts{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--chrome-2)}
.tile-x{position:absolute;top:7px;right:7px;width:26px;height:26px;border-radius:50%;
  background:rgba(8,9,10,.66);backdrop-filter:blur(5px);color:var(--chrome);font-size:16px;line-height:1;display:grid;place-items:center}
.tile-bar{display:flex;gap:6px;padding:0 10px 11px}
.mini{display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:14px;border:1px solid var(--line);
  color:var(--chrome-2);font-size:11.5px;font-weight:600}
.mini.liked{color:var(--brass-hi);border-color:rgba(184,133,63,.45)}

.empty{text-align:center;padding:52px 26px;color:var(--chrome-2)}
.empty .aperture-mark{opacity:.5}
.empty h3{font-family:var(--disp);font-weight:400;font-size:23px;color:var(--label);margin:14px 0 7px}
.empty p{font-size:13.5px;margin:0 0 18px}
.ghost-btn{padding:12px 22px;border-radius:22px;border:1px solid var(--brass);color:var(--brass-hi);font-size:13px;font-weight:600}
.ghost-btn.sm{padding:9px 15px;font-size:12.5px;border-radius:18px}
.ghost-btn.danger{border-color:rgba(180,82,60,.6);color:#D07A63}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

.search{width:100%;padding:12px 15px;border-radius:13px;background:var(--void-2);border:1px solid var(--line);
  color:var(--label);font-size:14.5px;margin:2px 0 12px}
.search::placeholder{color:var(--chrome-2)}
.feed-head{display:flex;gap:8px;align-items:center;padding:2px 0 14px;flex-wrap:wrap}
.badge{padding:7px 12px;border-radius:18px;font-size:11px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;border:1px solid var(--line);color:var(--chrome-2)}
.badge.live{color:var(--patina);border-color:rgba(76,107,99,.5)}
.note{padding:12px 14px;border-radius:12px;background:var(--void-2);border:1px solid var(--line);
  color:var(--chrome);font-size:12.5px;margin-bottom:12px}

/* ── ayarlar ─────────────────────────────── */
.set-h{font-family:var(--disp);font-size:19px;font-weight:500;margin:26px 0 2px;color:var(--label)}
.field{padding:14px 0;border-bottom:1px solid var(--line)}
.field label{display:block;font-size:13.5px;font-weight:600;margin-bottom:4px}
.field p{margin:0 0 10px;font-size:12px;color:var(--chrome-2);line-height:1.55}
.field input,.field select{width:100%;padding:12px 14px;border-radius:12px;background:var(--void-2);
  border:1px solid var(--line);color:var(--label);font-size:14.5px;margin-bottom:8px}
.field input:last-of-type{margin-bottom:0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:8px 13px;border-radius:16px;border:1px solid var(--line);color:var(--chrome);font-size:12.5px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:#14100A;font-weight:600}
.test-out{display:block;margin-top:9px;font-size:12px;color:var(--chrome-2)}
.test-out.ok{color:var(--patina)}
.test-out.bad{color:#D07A63}
.diag{margin:10px 0;padding:13px 14px;border-radius:12px;background:#0A0C0D;border:1px solid var(--line);
  color:var(--chrome);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;line-height:1.65;
  white-space:pre-wrap;word-break:break-all;overflow-x:auto}
.switch{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:15px 0;border-bottom:1px solid var(--line)}
.switch .txt strong{display:block;font-size:14px;font-weight:600}
.switch .txt span{font-size:12px;color:var(--chrome-2);line-height:1.5}
.toggle{width:50px;height:30px;border-radius:16px;background:var(--void-3);border:1px solid var(--line);
  position:relative;flex:0 0 auto;transition:.22s var(--ease)}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;
  background:var(--chrome-2);transition:.22s var(--ease)}
.toggle[aria-checked="true"]{background:rgba(184,133,63,.3);border-color:var(--brass)}
.toggle[aria-checked="true"]::after{left:23px;background:var(--brass-hi)}

/* ── nesne işaretleme katmanı ────────────── */

    var startDist = 0, startZoom = 1;
    finder.addEventListener('touchstart', function (e) {
      if (e.touches.length !== 2 || !S.track) return;
      var c = caps();
      if (!c.zoom) return;
      startDist = dist(e.touches);
      try { startZoom = S.track.getSettings().zoom || c.zoom.min || 1; } catch (er) { startZoom = 1; }
    }, { passive: true });
    finder.addEventListener('touchmove', function (e) {
      if (e.touches.length !== 2 || !S.track) return;

      if (!c.zoom || !startDist) return;
      var z = clamp(startZoom * (dist(e.touches) / startDist), c.zoom.min, c.zoom.max);
      S.track.applyConstraints({ advanced: [{ zoom: z }] }).catch(function () {});
    }, { passive: true });
    function dist(ts) {
      var dx = ts[0].clientX - ts[1].clientX, dy = ts[0].clientY - ts[1].clientY;

  /* ── 7. Görsel işleme ──────────────────────────────────── */
  var MAXPX = 1568;

  function grabFrame() {
    var w = video.videoWidth, h = video.videoHeight;
    if (!w || !h) return null;
    var c = $('work'), ctx = c.getContext('2d');
    if (!ctx) return null;
    var sc = Math.min(1, MAXPX / Math.max(w, h));
    c.width = Math.round(w * sc); c.height = Math.round(h * sc);
    if (S.facing === 'user') { ctx.translate(c.width, 0); ctx.scale(-1, 1); }
    ctx.drawImage(video, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.88);
  }

  function fileToImage(file) {
    return new Promise(function (res, rej) {
      if (!/^image\//.test(file.type || '')) return rej(new Error('type'));
      var fr = new FileReader();
      fr.onload = function () {
        var img = new Image();
        img.onload = function () {
          var c = $('work'), ctx = c.getContext('2d');
          if (!ctx) return rej(new Error('canvas'));
          var sc = Math.min(1, MAXPX / Math.max(img.width, img.height));
          c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
          ctx.drawImage(img, 0, 0, c.width, c.height);
          res(c.toDataURL('image/jpeg', 0.88));
        };
        img.onerror = function () { rej(new Error('decode')); };
        img.src = fr.result;
      };
      fr.onerror = rej;
      fr.readAsDataURL(file);
    });
  }

  function shrink(dataUrl, size, q) {
    return new Promise(function (res) {
      if (!dataUrl) return res('');
      var img = new Image();
      img.onload = function () {
        var c = document.createElement('canvas'), ctx = c.getContext('2d');
        if (!ctx) return res(dataUrl);
        var sc = Math.min(1, size / Math.max(img.width, img.height));
        c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', q));
      };
      img.onerror = function () { res(dataUrl); };
      img.src = dataUrl;
    });
  }

  /* oransal kutuya göre kırp; küçük seçimleri yukarı ölçekle */
  function cropTo(dataUrl, box) {
    return new Promise(function (res) {
      var img = new Image();
      img.onload = function () {
        var sx = clamp(box.x, 0, 1) * img.width;
        var sy = clamp(box.y, 0, 1) * img.height;
        var sw = clamp(box.w, 0.02, 1) * img.width;
        var sh = clamp(box.h, 0.02, 1) * img.height;
        /* nesneyi bağlamından tamamen koparma: %8 pay bırak */
        var padX = sw * 0.08, padY = sh * 0.08;
        sx = clamp(sx - padX, 0, img.width); sy = clamp(sy - padY, 0, img.height);
        sw = Math.min(sw + padX * 2, img.width - sx); sh = Math.min(sh + padY * 2, img.height - sy);
        var scale = clamp(900 / Math.max(sw, sh), 1, 3);
        var c = document.createElement('canvas'), ctx = c.getContext('2d');
        if (!ctx) return res(dataUrl);
        c.width = Math.round(sw * scale); c.height = Math.round(sh * scale);
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.9));
      };
      img.onerror = function () { res(dataUrl); };
      img.src = dataUrl;
    });
  }

  function asPayload(dataUrl) {

  /* ── 8. Nesneyi işaretle (kırpma katmanı) ──────────────── */
  function openMarker(onDone) {
    if (!S.fullImage) return;
    var lay = $('marker');
    lay.classList.remove('hide');
    lay.setAttribute('aria-hidden', 'false');
    $('markerImg').src = S.fullImage.dataUrl;
    $('markerHint').textContent = t('markHint');
    $('markerUse').textContent = t('markUse');
    $('markerCancel').textContent = t('cancel');

    var stage = $('markerStage'), boxEl = $('markerBox');
    var drag = null, box = null;
    boxEl.classList.add('hide');
    $('markerUse').disabled = true;

    function rel(ev) {
      var r = stage.getBoundingClientRect();
      var p = ev.touches ? ev.touches[0] : ev;
      return { x: clamp((p.clientX - r.left) / r.width, 0, 1), y: clamp((p.clientY - r.top) / r.height, 0, 1) };
    }
    function paint() {
      if (!box) return;
      boxEl.classList.remove('hide');
      boxEl.style.left = (box.x * 100) + '%';
      boxEl.style.top = (box.y * 100) + '%';
      boxEl.style.width = (box.w * 100) + '%';
      boxEl.style.height = (box.h * 100) + '%';
      $('markerUse').disabled = !(box.w > 0.04 && box.h > 0.04);
    }
    function down(e) { e.preventDefault(); drag = rel(e); box = { x: drag.x, y: drag.y, w: 0, h: 0 }; paint(); }
    function move(e) {
      if (!drag) return;
      e.preventDefault();
      var p = rel(e);
      box = { x: Math.min(drag.x, p.x), y: Math.min(drag.y, p.y), w: Math.abs(p.x - drag.x), h: Math.abs(p.y - drag.y) };
      paint();
    }
    function up() { drag = null; }

    stage.addEventListener('touchstart', down, { passive: false });
    stage.addEventListener('touchmove', move, { passive: false });
    stage.addEventListener('touchend', up);
    stage.addEventListener('mousedown', down);
    stage.addEventListener('mousemove', move);
    stage.addEventListener('mouseup', up);

    function close() {
      stage.removeEventListener('touchstart', down);
      stage.removeEventListener('touchmove', move);
      stage.removeEventListener('touchend', up);
      stage.removeEventListener('mousedown', down);
      stage.removeEventListener('mousemove', move);
      stage.removeEventListener('mouseup', up);
      lay.classList.add('hide');
      lay.setAttribute('aria-hidden', 'true');
    }
    $('markerCancel').onclick = close;
    $('markerUse').onclick = function () {
      if (!box) return;
      close();
      cropTo(S.fullImage.dataUrl, box).then(function (cropped) {
        S.image = asPayload(cropped);
        S.focusNote = S.ui === 'tr'
          ? 'Kullanici ilk gorselde isaretledigi bolgeyi soruyor. Sadece o bolgedeki nesneye odaklan.'
          : 'The user marked this region. Focus only on the object inside it.';
        onDone && onDone();
      });
    };
  }

  /* ── 10. Yanıt ayrıştırma ve onarım ────────────────────── */
  function pullText(data) {
    if (!data) return '';
    if (typeof data === 'string') return data;
    if (data.content && data.content.length) {
      return data.content.map(function (b) {
        if (b.type === 'text') return b.text || '';
        if (b.type === 'mcp_tool_result' && b.content && b.content[0]) return b.content[0].text || '';
        return '';
      }).filter(Boolean).join('\n');
    }
    if (data.choices && data.choices[0]) {
      var m = data.choices[0].message;
      if (m) return typeof m.content === 'string' ? m.content : JSON.stringify(m.content);
      if (data.choices[0].text) return data.choices[0].text;
    }
    if (data.message) {
      var c = data.message.content;
      if (typeof c === 'string') return c;
      if (c && c[0] && c[0].text) return c[0].text;
    }
    if (data.text) return data.text;
    return '';
  }

  function parseJSON(raw) {
    if (!raw) return null;
    var s = String(raw).replace(/```json/gi, '').replace(/```/g, '').trim();
    var a = s.indexOf('{'), b = s.lastIndexOf('}');
    if (a < 0 || b <= a) return null;
    var body = s.slice(a, b + 1);
    var tries = [
      body,
      body.replace(/,\s*([}\]])/g, '$1'),
      body.replace(/,\s*([}\]])/g, '$1').replace(/([{,]\s*)'([^']+)'\s*:/g, '$1"$2":'),
      body.replace(/[\u0000-\u001F]+/g, ' ').replace(/,\s*([}\]])/g, '$1')
    ];
    for (var i = 0; i < tries.length; i++) {
      try { return JSON.parse(tries[i]); } catch (e) {}
    }
    return null;
  }

  /* "1.200 TL", "1,200", "1.234,56", "1,234.56" hepsi doğru okunmalı.
     Kural: son ayraçtan sonra tam üç basamak varsa o ayraç binliktir. */
  function parseNum(v) {
    if (v == null) return null;
    if (typeof v === 'number') return isFinite(v) ? v : null;
    var s = String(v).replace(/[^\d.,]/g, '');
    if (!s) return null;
    var sep = Math.max(s.lastIndexOf('.'), s.lastIndexOf(','));
    var out;
    if (sep < 0) out = s;
    else {
      var head = s.slice(0, sep), tail = s.slice(sep + 1);
      if (/^\d{3}$/.test(tail) && head && head !== '0') out = s.replace(/[.,]/g, '');
      else out = head.replace(/[.,]/g, '') + '.' + tail;
    }
    var n = parseFloat(out);
    return isFinite(n) ? n : null;
  }

  /* Modeller ara sıra alan atlar veya tip kaydırır; burada hepsini hizaya sokuyoruz. */
  function normalize(d) {
    if (!d || typeof d !== 'object') return null;
    var o = {};
    var str = function (v) { return v == null ? '' : String(v).trim(); };
    o.title = str(d.title || d.name || d.baslik);
    if (!o.title) return null;
    o.category = str(d.category || d.kategori);
    var c = parseInt(d.confidence, 10);
    o.confidence = isNaN(c) ? 60 : clamp(c, 0, 100);
    o.summary = str(d.summary || d.ozet);
    o.narration = str(d.narration || d.sesli_anlatim || o.summary);
    /* anlatımı TTS için temizle */
    o.narration = o.narration.replace(/[*_#`>]/g, '').replace(/^\s*[-•]\s*/gm, '').replace(/\s+/g, ' ').trim();
    if (!o.summary) o.summary = o.narration;

    o.evidence = Array.isArray(d.evidence) ? d.evidence.map(str).filter(Boolean).slice(0, 6) : [];
    o.others = Array.isArray(d.others) ? d.others.map(str).filter(Boolean).slice(0, 6) : [];
    o.questions = Array.isArray(d.questions) ? d.questions.map(str).filter(Boolean).slice(0, 3) : [];
    o.fact = str(d.fact);
    o.warning = str(d.warning) || null;

    o.specs = [];
    if (Array.isArray(d.specs)) {
      d.specs.forEach(function (s) {
        if (!s) return;
        var k = str(s.k || s.key || s.label), v = str(s.v || s.value || s.val);
        if (k && v && !/^(bilinmiyor|unknown|n\/a|-)$/i.test(v)) o.specs.push({ k: k, v: v });
      });
    } else if (d.specs && typeof d.specs === 'object') {
      Object.keys(d.specs).forEach(function (k) {
        var v = str(d.specs[k]);
        if (v) o.specs.push({ k: k, v: v });
      });
    }
    o.specs = o.specs.slice(0, 8);

    var p = d.price || {};
    o.price = { min: parseNum(p.min), max: parseNum(p.max), cur: str(p.cur || p.currency) || langInfo(S.lang).cur, note: str(p.note) };
    if (o.price.min != null && o.price.max != null && o.price.min > o.price.max) {
      var tmp = o.price.min; o.price.min = o.price.max; o.price.max = tmp;
    }
    if (o.price.min == null || o.price.max == null) { o.price.min = null; o.price.max = null; }

    var se = d.search || {};
    o.search = { local: str(se.local) || o.title, global: str(se.global) || str(se.local) || o.title };

    var pair = function (arr) {
      if (!Array.isArray(arr)) return [];
      return arr.map(function (w) {
        if (!w) return null;
        if (typeof w === 'string') return { name: w, why: '' };
        return { name: str(w.name), why: str(w.why) };
      }).filter(function (w) { return w && w.name; }).slice(0, 5);
    };
    o.where = pair(d.where);
    o.alts = pair(d.alts);
    return o;
  }

  function loadScript(src) {
    return new Promise(function (res, rej) {
      if (document.querySelector('script[data-src="' + src + '"]')) return res();
      var s = document.createElement('script');
      s.src = src; s.async = true;
      s.setAttribute('data-src', src);
      s.onload = function () { res(); };
      s.onerror = function () { rej(new Error('script yüklenemedi')); };
      document.head.appendChild(s);
    });
  }

  function imagesFor(imgs) { return imgs.filter(Boolean); }

  /* A — Anthropic (Claude içinde anahtarsız, dışarıda anahtarla) */
  function pAnthropic(system, prompt, imgs) {
    var content = [];
    imagesFor(imgs).forEach(function (im) {
      content.push({ type: 'image', source: { type: 'base64', media_type: im.mime, data: im.b64 } });

  /* Zincir: sırayla dene, ağ hatasında bir kez tekrarla, hepsi düşerse en anlamlı hatayı döndür */
  function chain(system, prompt, imgs) {
    if (!navigator.onLine) return Promise.reject(new Error('offline'));
    var list = providerOrder(), i = 0, lastErr = null;
    function attempt(fn, retried) {
      return fn(system, prompt, imgs).catch(function (e) {
        var msg = String(e && e.message || e);
        var retryable = /timeout|Failed to fetch|NetworkError|5\d\d|429/i.test(msg);
        if (!retried && retryable && navigator.onLine) {
          return new Promise(function (r) { setTimeout(r, 900); }).then(function () { return attempt(fn, true); });
        }
        throw e;
      });
    }
    function next() {
      if (i >= list.length) return Promise.reject(lastErr || new Error('all-failed'));
      var fn = list[i++];
      return attempt(fn, false).catch(function (e) { lastErr = e; return next(); });
    }
    return next();
  }

  /* Sadece metin isteyen çağrılar (takip soruları) */
  function chainText(system, prompt, imgs) {
    return chain(system, prompt, imgs).then(function (r) {
      return { text: String(r.text || '').replace(/```/g, '').trim(), via: r.via };
    });
  }

  /* JSON isteyen çağrılar: ayrıştır, onar, gerekirse bir kez daha iste */
  function chainJSON(system, prompt, imgs) {
    return chain(system, prompt, imgs).then(function (r) {
      var d = normalize(parseJSON(r.text));
      if (d) return { data: d, via: r.via };
      return chain(system, prompt + '\n\nONEMLI: Onceki yanit gecersizdi. SADECE gecerli JSON dondur, baska hicbir sey yazma.', imgs)
        .then(function (r2) {
          var d2 = normalize(parseJSON(r2.text));
          if (!d2) throw new Error('parse');
          return { data: d2, via: r2.via };
        });
    });
  }

  var TTS = {
    queue: [], idx: 0, on: false, unlocked: false,
    unlock: function () {
      if (this.unlocked || !window.speechSynthesis) return;
      try {
        var u = new SpeechSynthesisUtterance(' ');
        u.volume = 0;
        speechSynthesis.speak(u);
        this.unlocked = true;
      } catch (e) {}
    },
    voice: function () {
      if (!window.speechSynthesis) return null;
      var vs = speechSynthesis.getVoices() || [];
      var want = langInfo(S.lang).v.toLowerCase(), base = S.lang.toLowerCase();
      var norm = function (v) { return v.lang.toLowerCase().replace('_', '-'); };
      var exact = vs.filter(function (v) { return norm(v) === want; });
      var loose = vs.filter(function (v) { return norm(v).indexOf(base) === 0; });
      var pool = exact.length ? exact : loose;
      var nice = pool.filter(function (v) { return /google|natural|enhanced|premium|siri|neural/i.test(v.name); });
      return nice[0] || pool[0] || null;
    },
    chunk: function (text) {
      var parts = String(text).replace(/\s+/g, ' ').match(/[^.!?…]+[.!?…]*/g) || [String(text)];
      var out = [], cur = '';
      parts.forEach(function (p) {
        if ((cur + p).length > 170 && cur) { out.push(cur.trim()); cur = p; }
        else cur += p;
      });
      if (cur.trim()) out.push(cur.trim());
      return out.filter(Boolean);
    },
    speak: function (text) {
      if (!window.speechSynthesis) { toast(S.ui === 'tr' ? 'Bu cihazda sesli okuma yok.' : 'Speech is unavailable here.'); return; }
      if (!text) return;
      this.stop();
      this.queue = this.chunk(text);
      this.idx = 0; this.on = true;
      paintTransport();
      this.step();
    },
    step: function () {
      var self = this;
      if (!self.on || self.idx >= self.queue.length) { self.on = false; paintTransport(); return; }
      var u = new SpeechSynthesisUtterance(self.queue[self.idx]);
      var v = self.voice();
      if (v) u.voice = v;
      u.lang = langInfo(S.lang).v;
      u.rate = S.rate; u.pitch = 1;
      u.onend = function () { self.idx++; self.step(); };
      u.onerror = function () { self.idx++; self.step(); };
      try { speechSynthesis.speak(u); } catch (e) { self.on = false; paintTransport(); }
    },
    toggle: function (text) { if (this.on) this.stop(); else this.speak(text); },
    stop: function () {
      this.on = false; this.queue = []; this.idx = 0;
      try { speechSynthesis.cancel(); } catch (e) {}
      paintTransport();
    }
  };

  function paintTransport() {
    var bars = document.querySelector('.card .bars');

    h.push('<div class="rule"></div><h3 class="sec-title">' + esc(t('ask')) + '</h3>');
    h.push('<div class="chips" id="qChips">');

    h.push('<button class="chip" data-q="__deep">' + esc(t('deeper')) + '</button>');

      '" enterkeyhint="send" aria-label="' + esc(t('ask')) + '"><button id="askBtn" aria-label="' + esc(t('ask')) + '">' + ICON.send + '</button></div>');

    h.push('<div class="card-actions">');
    h.push('<button class="act' + (rec.saved ? ' done' : '') + '" id="saveBtn">' + ICON.save + '<span>' + esc(rec.saved ? t('saved') : t('save')) + '</span></button>');
    h.push('<button class="act filled" id="shareBtn">' + ICON.share + '<span>' + esc(t('share')) + '</span></button>');
    h.push('<button class="act" id="cardBtn">' + ICON.card + '<span>' + esc(t('card')) + '</span></button>');
    h.push('</div>');

    h.push('<div class="provenance">' + esc(t('provider')) + ': ' + esc(rec.via || '—') +

    box.scrollTop = 0;

  function renderQA(rec) {
    var list = $('qaList');
    if (!list) return;
    list.innerHTML = (rec.qa || []).map(function (x) {
      return '<div class="qa-item"><div class="q">' + esc(x.q) + '</div><div class="a">' + esc(x.a) + '</div></div>';
    }).join('');

  function wireResult(rec) {
    var d = rec.data;
    $('backScan').onclick = function () { TTS.stop(); go('scan'); resetScan(); };
    var mb = $('markBtn');
    if (mb) mb.onclick = function () { TTS.stop(); openMarker(function () { analyse(true); }); };

    $('playBtn').onclick = function () { TTS.unlock(); TTS.toggle(d.narration); buzz(8); };
    $('rateBtn').onclick = function () {
      var steps = [0.85, 1, 1.15, 1.35];
      S.rate = steps[(steps.indexOf(S.rate) + 1) % steps.length];
      $('rateBtn').textContent = S.rate.toFixed(1) + '×';
      savePrefs();
      if (TTS.on) TTS.speak(d.narration);
    };

    $('saveBtn').onclick = function () {
      if (rec.saved) { go('collection'); return; }

    $('shareBtn').onclick = function () { shareRecord(rec); };
    $('cardBtn').onclick = function () { makeCard(rec); };

    Array.prototype.forEach.call(document.querySelectorAll('#qChips .chip'), function (b) {
      b.onclick = function () {
        var q = b.getAttribute('data-q');

          askFollowUp(rec, S.ui === 'tr'
            ? 'Bunu bir uzman gibi daha derin anlat: kökeni, nasıl üretildiği, ayırt edici detayları ve alırken nelere dikkat edilmeli.'
            : 'Explain this in more depth like an expert: origin, how it is made, distinguishing details, and what to check before buying.');
        } else askFollowUp(rec, q);
      };
    });
    var oc = $('otherChips');
    if (oc) {
      Array.prototype.forEach.call(oc.querySelectorAll('.chip'), function (b) {
        b.onclick = function () {

          TTS.stop();

  }

  /* ── 17. Analiz akışı ──────────────────────────────────── */
  function errorText(e) {
    var m = String(e && e.message || e);
    if (!navigator.onLine || m === 'offline') return t('failOffline');
    if (/timeout/i.test(m)) return t('failTimeout');
    if (/parse/i.test(m)) return t('failParse');
    if (/all-failed/i.test(m)) return t('failAll');
    return t('failGeneric');
  }

  function analyse(keepFocus) {
    if (!S.image) { toast(t('noImage')); return; }
    if (S.busy) return;
    if (!keepFocus) S.focusNote = '';
    S.busy = true;
    TTS.unlock();
    go('result');
    mountSkeleton(t('analysing'));

    var stages = [t('reading'), t('writing')], si = 0;
    var tick = setInterval(function () { if (si < stages.length) setStage(stages[si++]); }, 3400);

    /* kırpım varsa tam kareyi bağlam olarak ekle */
    var imgs = [S.image];
    if (S.fullImage && S.fullImage.dataUrl !== S.image.dataUrl) imgs.push(S.fullImage);

    chainJSON(systemPrompt(), userPrompt(), imgs)
      .then(function (r) {
        if (S.doubleCheck && r.data.confidence < 70) {
          clearInterval(tick);
          setStage(t('checking'));
          return verifyPass(r.data, imgs)
            .then(function (r2) { return { data: r2.data, via: r2.via + ' ×2' }; })
            .catch(function () { return r; });
        }
        return r;
      })
      .then(function (r) {
        clearInterval(tick);
        return shrink(S.image.dataUrl, 760, 0.74).then(function (thumb) {
          var rec = {
            id: 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
            ts: Date.now(), mode: S.mode, lang: S.lang, via: r.via,
            thumb: thumb, data: r.data, qa: [], saved: false, no: null,
            focused: !!S.focusNote
          };
          S.current = rec;
          S.busy = false;
          if (S.autoSave) saveRecord(rec);
          renderResult(rec);
          buzz(18);
          if (S.autoSpeak) setTimeout(function () { TTS.speak(r.data.narration); }, 280);
        });
      })
      .catch(function (e) {
        clearInterval(tick);
        S.busy = false;
        var box = $('resultScroll');
        box.innerHTML =
          '<div style="height:14px"></div>' +
          (S.image ? '<div class="plate"><img src="' + S.image.dataUrl + '" alt=""></div>' : '') +
          '<div class="card"><div class="kicker">' + (S.ui === 'tr' ? 'Sorun' : 'Problem') + '</div>' +
          '<h1>' + esc(t('cantRead')) + '</h1>' +
          '<p class="lede">' + esc(errorText(e)) + '</p>' +
          '<div class="card-actions" style="grid-template-columns:1fr 1fr">' +
          '<button class="act filled" id="retryBtn"><span>' + esc(t('retry')) + '</span></button>' +
          '<button class="act" id="backScan2"><span>' + esc(t('newScan')) + '</span></button></div></div>';
        $('retryBtn').onclick = function () { analyse(true); };
        $('backScan2').onclick = function () { go('scan'); resetScan(); };
      });
  }

  function askFollowUp(rec, q) {
    if (S.busy || !q) return;
    S.busy = true;
    rec.qa = rec.qa || [];
    rec.qa.push({ q: q, a: t('thinking') });
    renderQA(rec);
    var last = document.querySelector('#qaList .qa-item:last-child');

    var L = langInfo(S.lang);
    var sys = 'Sen LENSA\'sin. Kullanicinin fotografi ve onceki teshis hakkinda takip sorusu yanitliyorsun. ' +
      'Teshis: ' + rec.data.title + '. Ozet: ' + rec.data.summary + '. ' +
      'Kisa, net, dogrudan yanit ver. En fazla 90 kelime. Madde isareti ve markdown kullanma. ' +
      'Emin degilsen soyle. Ilac dozu, mantar yenilebilirligi ve tibbi teshis konusunda hukum verme, uzmana yonlendir. ' +
      'SADECE ' + L.n + ' dilinde yaz. JSON degil duz metin dondur.';

    chainText(sys, q, S.image ? [S.image] : [])
      .then(function (r) {
        rec.qa[rec.qa.length - 1].a = r.text;
        S.busy = false;
        renderQA(rec);
        updateRecord(rec);
        if (S.autoSpeak) TTS.speak(r.text);
      })
      .catch(function (e) {
        rec.qa[rec.qa.length - 1].a = errorText(e);
        S.busy = false;
        renderQA(rec);
      });
  }

  /* ── 18. Koleksiyon ────────────────────────────────────── */
  function allRecords() { return store.json('lensa.recs', []); }
  function writeRecords(list) {
    try { store.set('lensa.recs', JSON.stringify(list)); return true; }
    catch (e) {
      /* kota doldu: en eskileri at */
      var copyList = list.slice();
      while (copyList.length > 8) {
        copyList.shift();
        try { store.set('lensa.recs', JSON.stringify(copyList)); return true; } catch (e2) {}
      }
      return false;
    }
  }
  function nextNo() {
    var n = parseInt(store.get('lensa.counter') || '0', 10) + 1;
    try { store.set('lensa.counter', String(n)); } catch (e) {}
    return n;
  }
  function stripForStore(rec) {
    return {
      id: rec.id, ts: rec.ts, mode: rec.mode, lang: rec.lang, via: rec.via,
      thumb: rec.thumb, data: rec.data, qa: (rec.qa || []).slice(-8),
      saved: true, no: rec.no, published: !!rec.published, focused: !!rec.focused
    };
  }
  function saveRecord(rec) {
    if (rec.saved) return;
    rec.saved = true;
    rec.no = nextNo();
    var list = allRecords();
    list.push(stripForStore(rec));
    if (list.length > 80) list = list.slice(-80);
    writeRecords(list);
  }
  function updateRecord(rec) {
    if (!rec.saved) return;
    var list = allRecords();
    for (var i = 0; i < list.length; i++) {
      if (list[i].id === rec.id) { list[i] = stripForStore(rec); break; }
    }
    writeRecords(list);
  }
  function deleteRecord(id) {
    writeRecords(allRecords().filter(function (r) { return r.id !== id; }));
  }

  function emptyBlock(title, sub, btn, id) {
    return '<div class="empty">' + ICON.aperture +
      '<h3>' + esc(title) + '</h3><p>' + esc(sub) + '</p>' +
      (btn ? '<button class="ghost-btn" id="' + id + '">' + esc(btn) + '</button>' : '') + '</div>';
  }

  function renderCollection() {
    var list = allRecords().slice().reverse();
    var head = $('colHead');
    head.innerHTML = list.length
      ? '<input class="search" id="colSearch" placeholder="' + esc(t('searchPh')) + '" value="' + esc(S.colQuery) + '" aria-label="' + esc(t('searchPh')) + '">' +
        '<div class="filterbar" id="colFilters"></div>'
      : '';

    if (list.length) {
      var cats = {};
      list.forEach(function (r) { var c = (r.data && r.data.category) || '—'; cats[c] = (cats[c] || 0) + 1; });
      var keys = Object.keys(cats).sort(function (a, b) { return cats[b] - cats[a]; }).slice(0, 8);

        .concat(keys.map(function (k) {
          return '<button class="mode" aria-pressed="' + (S.colFilter === k) + '" data-c="' + esc(k) + '">' + esc(k) + ' · ' + cats[k] + '</button>';
        })).join('');
      Array.prototype.forEach.call(fb.children, function (b) {
        b.onclick = function () { S.colFilter = b.getAttribute('data-c') || ''; renderCollection(); };
      });
      var si = $('colSearch');
      si.oninput = function () { S.colQuery = si.value; paintTiles(); };
    }
    paintTiles();

    function paintTiles() {
      var q = S.colQuery.toLocaleLowerCase(S.lang === 'tr' ? 'tr' : 'en');
      var shown = list.filter(function (r) {
        if (S.colFilter && (r.data && r.data.category) !== S.colFilter) return false;
        if (!q) return true;

        return hay.toLocaleLowerCase(S.lang === 'tr' ? 'tr' : 'en').indexOf(q) >= 0;
      });
      var body = $('colBody');
      if (!list.length) {
        body.innerHTML = emptyBlock(t('emptyColT'), t('emptyColP'), t('startScan'), 'goScan1');

      }
      if (!shown.length) { body.innerHTML = '<div class="empty"><p>' + esc(t('noMatch')) + '</p></div>'; return; }
      body.innerHTML = '<div class="grid">' + shown.map(function (r) {
        return '<div class="tile"><button class="tile-main" data-id="' + r.id + '">' +
          '<img src="' + r.thumb + '" alt="" loading="lazy">' +
          '<div class="meta"><div class="tt">' + esc((r.data && r.data.title) || '—') + '</div>' +
          '<div class="ts">' + esc(catNo(r)) + ' · ' + esc((r.data && r.data.category) || '') + '</div></div></button>' +
          '<button class="tile-x" data-del="' + r.id + '" aria-label="' + esc(t('removed')) + '">×</button></div>';
      }).join('') + '</div>';
      Array.prototype.forEach.call(body.querySelectorAll('.tile-main'), function (b) {
        b.onclick = function () { openSaved(b.getAttribute('data-id')); };
      });
      Array.prototype.forEach.call(body.querySelectorAll('.tile-x'), function (b) {
        b.onclick = function (e) {
          e.stopPropagation();

          deleteRecord(b.getAttribute('data-del'));

          toast(t('removed'));
        };
      });

  }

  function openSaved(id) {
    var list = allRecords(), r = null;
    for (var i = 0; i < list.length; i++) if (list[i].id === id) r = list[i];
    if (!r) return;
    S.current = r;
    S.mode = r.mode; S.lang = r.lang; S.ui = r.lang === 'tr' ? 'tr' : 'en';
    S.image = r.thumb ? asPayload(r.thumb) : null;
    S.fullImage = S.image;
    S.focusNote = '';
    applyUI();
    go('result');
    renderResult(r);
  }

  /* ── 19. Paylaşım bağlantısı ───────────────────────────── */
  function b64url(str) {
    var bytes = new TextEncoder().encode(str), bin = '';
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function unb64url(s) {
    s = String(s).replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    var bin = atob(s), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }

  function plainText(rec) {
    var d = rec.data, tr = S.ui === 'tr';
    var lines = [d.title, ''];
    if (d.summary) lines.push(d.summary, '');
    d.specs.slice(0, 6).forEach(function (s) { lines.push(s.k + ': ' + s.v); });
    if (d.price.min != null) lines.push('', (tr ? 'Tahmini fiyat: ' : 'Estimated price: ') + money(d.price));
    if (d.search.local) lines.push('', (tr ? 'Arama terimi: ' : 'Search term: ') + d.search.local);
    lines.push('', '— LENSA');
    return lines.join('\n');
  }

  function shareLink(rec) {
    return shrink(rec.thumb, 200, 0.45).then(function (small) {
      var d = rec.data;
      var payload = {
        v: 2, t: d.title, c: d.category, s: d.summary, n: d.narration,
        sp: d.specs.slice(0, 5), q: d.search.local, p: d.price.min != null ? d.price : null,
        l: rec.lang, m: rec.mode, im: small
      };
      var enc = b64url(JSON.stringify(payload));
      if (enc.length > 60000) { delete payload.im; enc = b64url(JSON.stringify(payload)); }
      return location.origin + location.pathname + '#k=' + enc;
    });
  }

  function shareRecord(rec) {
    var text = plainText(rec);
    shareLink(rec).then(function (url) {
      publishFind(rec);
      if (navigator.share) {
        navigator.share({ title: rec.data.title, text: text, url: url })
          .catch(function () { copy(url + '\n\n' + text).then(function () { toast(t('linkCopied')); }); });
      } else {
        copy(url + '\n\n' + text).then(function () { toast(t('linkCopied')); });
      }
    });
  }

  /* ── 20. Paylaşım kartı (1080×1350) ────────────────────── */
  function makeCard(rec) {
    var ready = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
    ready.then(function () { drawCard(rec); }).catch(function () { drawCard(rec); });
  }
  function drawCard(rec) {
    var d = rec.data;
    var c = document.createElement('canvas');
    c.width = 1080; c.height = 1350;
    var x = c.getContext('2d');
    if (!x) { toast(t('failGeneric')); return; }
    x.fillStyle = '#0E1113'; x.fillRect(0, 0, 1080, 1350);

    function finish() {
      x.fillStyle = '#B8853F'; x.fillRect(72, 686, 936, 3);
      x.fillStyle = '#B8853F';
      x.font = '600 24px Archivo, Helvetica, sans-serif';
      x.fillText(String(d.category || '').toUpperCase().slice(0, 42), 72, 758);

      x.fillStyle = '#15181A';
      var size = 84;
      x.font = '500 ' + size + 'px "Bodoni Moda", Georgia, serif';
      var title = d.title;
      while (x.measureText(title).width > 936 && size > 38) {
        size -= 4; x.font = '500 ' + size + 'px "Bodoni Moda", Georgia, serif';
      }
      x.fillText(title, 72, 758 + size + 12);

      x.fillStyle = '#3A3D3F';
      x.font = '400 30px Archivo, Helvetica, sans-serif';
      wrapText(x, d.summary, 72, 758 + size + 78, 936, 44, 7);

      x.fillStyle = '#8A8578';
      x.font = '600 22px Archivo, Helvetica, sans-serif';
      x.fillText('LENSA  ·  ' + catNo(rec), 72, 1294);
      if (d.price.min != null) {
        x.textAlign = 'right'; x.fillStyle = '#B8853F';
        x.fillText(money(d.price), 1008, 1294);
        x.textAlign = 'left';
      }
      c.toBlob(function (blob) {
        if (!blob) return;
        var file = new File([blob], 'lensa-' + (rec.no || 'kesif') + '.jpg', { type: 'image/jpeg' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          navigator.share({ files: [file], title: d.title }).catch(function () {});
        } else {
          var a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = file.name; a.click();
          setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
        }
      }, 'image/jpeg', 0.92);
    }

    x.fillStyle = '#EDE7DA'; x.fillRect(0, 680, 1080, 670);
    if (!rec.thumb) return finish();
    var img = new Image();
    img.onload = function () {
      var ih = 720, sc = Math.max(1080 / img.width, ih / img.height);
      var w = img.width * sc, hh = img.height * sc;
      x.save(); x.beginPath(); x.rect(0, 0, 1080, ih); x.clip();
      x.drawImage(img, (1080 - w) / 2, (ih - hh) / 2, w, hh);
      x.restore();
      var g = x.createLinearGradient(0, ih - 240, 0, ih);
      g.addColorStop(0, 'rgba(14,17,19,0)'); g.addColorStop(1, 'rgba(14,17,19,.85)');
      x.fillStyle = g; x.fillRect(0, ih - 240, 1080, 240);
      x.fillStyle = '#EDE7DA'; x.fillRect(0, 680, 1080, 670);
      finish();
    };
    img.onerror = finish;
    img.src = rec.thumb;
  }

  function wrapText(ctx, text, x, y, maxW, lh, maxLines) {
    var words = String(text || '').split(' '), line = '', lines = 0;
    for (var i = 0; i < words.length; i++) {
      var test = line + words[i] + ' ';
      if (ctx.measureText(test).width > maxW && line) {
        ctx.fillText(line.trim(), x, y); y += lh; line = words[i] + ' '; lines++;
        if (lines >= maxLines - 1) { ctx.fillText(line.trim().slice(0, 58) + '…', x, y); return; }
      } else line = test;
    }
    ctx.fillText(line.trim(), x, y);
  }

  /* ── 21. Ortak akış (Supabase) ─────────────────────────── */
  var SETUP_SQL = [
    '-- LENSA ortak akışı — Supabase SQL Editor\'e yapıştırıp çalıştır.',
    'create table if not exists lensa_finds (',
    '  id uuid primary key default gen_random_uuid(),',
    '  created_at timestamptz not null default now(),',
    '  title text not null,',
    '  category text,',
    '  summary text,',
    '  narration text,',
    '  query text,',
    '  specs jsonb default \'[]\'::jsonb,',
    '  price jsonb,',
    '  lang text,',
    '  mode text,',
    '  thumb text,',
    '  author text,',
    '  likes int not null default 0,',
    '  flagged int not null default 0',
    ');',
    '',
    'alter table lensa_finds enable row level security;',
    '',
    'drop policy if exists "lensa read" on lensa_finds;',
    'create policy "lensa read" on lensa_finds for select using (flagged < 3);',
    '',
    'drop policy if exists "lensa insert" on lensa_finds;',
    'create policy "lensa insert" on lensa_finds for insert with check (',
    '  char_length(title) between 1 and 200 and char_length(coalesce(thumb,\'\')) < 200000',
    ');',
    '',
    'create or replace function lensa_like(find_id uuid) returns void',
    '  language sql security definer as $$',
    '  update lensa_finds set likes = likes + 1 where id = find_id; $$;',
    '',
    'create or replace function lensa_flag(find_id uuid) returns void',
    '  language sql security definer as $$',
    '  update lensa_finds set flagged = flagged + 1 where id = find_id; $$;',
    '',
    'grant execute on function lensa_like(uuid) to anon;',
    'grant execute on function lensa_flag(uuid) to anon;'
  ].join('\n');

  /* Yapıştırma kazaları: baştaki "apikey:", "Bearer ", tırnaklar, satır sonları */
  function cleanKey(v) {
    return String(v || '')
      .replace(/^\s*(apikey|authorization)\s*[:=]\s*/i, '')
      .replace(/^\s*Bearer\s+/i, '')
      .replace(/["'`]/g, '')
      .replace(/\s+/g, '');
  }
  function cleanUrl(v) {
    var u = String(v || '').trim().replace(/["'`]/g, '').replace(/\s+/g, '');
    if (u && !/^https?:\/\//i.test(u)) u = 'https://' + u;
    return u.replace(/\/+$/, '').replace(/\/rest\/v1$/, '');
  }
  function keyShape(k) {
    if (!k) return { kind: '-', len: 0 };
    if (/^eyJ/.test(k)) return { kind: 'legacy anon (JWT)', len: k.length, short: k.length < 100 };
    if (/^sb_publishable_/.test(k)) return { kind: 'publishable', len: k.length, short: k.length < 30 };
    if (/^sb_secret_/.test(k)) return { kind: 'SECRET', len: k.length, secret: true };
    return { kind: 'tanınmadı', len: k.length, unknown: true };
  }

  var Cloud = {
    ready: function () { return !!(S.sbUrl && S.sbKey); },
    /* Yeni sb_publishable_ anahtarları JWT değil. Authorization başlığına konursa
       ağ geçidi onu oturum jetonu sanıp 401 döndürüyor. Sadece eski eyJ... ile
       başlayan anon anahtarları Bearer olarak da gönderilebilir. */
    head: function (extra) {
      var h = { apikey: S.sbKey, 'Content-Type': 'application/json' };
      if (/^eyJ/.test(S.sbKey)) h.Authorization = 'Bearer ' + S.sbKey;
      if (extra) Object.keys(extra).forEach(function (k) { h[k] = extra[k]; });
      return h;
    },
    base: function () { return cleanUrl(S.sbUrl) + '/rest/v1'; },

    explain: function (status, msg) {
      var tr = S.ui === 'tr', m = String(msg || '');
      if (status >= 200 && status < 300) {
        return tr ? 'Her şey yolunda. Ortak akış çalışıyor.' : 'All good. The shared feed is working.';
      }
      if (/no api key found/i.test(m)) {
        return tr ? 'Sunucu anahtarı hiç görmedi. Anahtar alanı boş kalmış olabilir.'
                  : 'The server saw no key at all. The key field may be empty.';
      }
      if (/invalid api key/i.test(m) || status === 401) {
        return tr
          ? '401 — anahtar bu projeye ait değil ya da eksik kopyalanmış. Proje URL\'sindeki kod ile anahtarı aynı projeden aldığından emin ol.'
          : '401 — the key does not belong to this project, or was copied incompletely. Make sure the URL and the key come from the same project.';
      }
      if (status === 404 || /relation|does not exist/i.test(m)) {
        return tr ? '404 — lensa_finds tablosu yok. Kurulum SQL\'ini SQL Editor\'de çalıştır.'
                  : '404 — table lensa_finds is missing. Run the setup SQL in the SQL Editor.';
      }
      if (status === 403) {
        return tr ? '403 — erişim engellendi. Kurulum SQL\'indeki okuma politikası eksik olabilir.'
                  : '403 — access denied. The read policy from the setup SQL may be missing.';
      }
      if (status === 0) {
        return tr ? 'Sunucuya ulaşılamadı. URL yanlış olabilir ya da proje duraklatılmış.'
                  : 'Could not reach the server. Wrong URL, or the project is paused.';
      }
      return (status ? status + ' — ' : '') + (m || (tr ? 'bilinmeyen hata' : 'unknown error'));
    },
    check: function (r) {
      if (r.ok) return r;
      var self = this;
      return r.text().then(function (txt) {
        var msg = '';
        try { var j = JSON.parse(txt); msg = j.message || j.hint || j.error_description || j.error || ''; }
        catch (e) { msg = String(txt).slice(0, 140); }
        throw new Error(self.explain(r.status, msg));
      });
    },
    /* Ham gerçeği gösterir: ne gönderdik, sunucu ne dedi */
    diagnose: function () {
      var self = this, url = self.base() + '/lensa_finds?select=id&limit=1', t0 = Date.now();
      return fetch(url, { headers: self.head() }).then(function (r) {
        return r.text().then(function (txt) {
          return { status: r.status, body: txt.slice(0, 260), ms: Date.now() - t0, url: url };
        });
      }).catch(function (e) {
        return { status: 0, body: String(e.message || e), ms: Date.now() - t0, url: url };
      });
    },
    list: function () {
      var self = this;
      var cols = 'id,created_at,title,category,summary,narration,query,specs,price,lang,mode,thumb,author,likes';
      return withTimeout(fetch(self.base() + '/lensa_finds?select=' + cols + '&order=created_at.desc&limit=48',
        { headers: self.head() }).then(function (r) { return self.check(r); }).then(function (r) { return r.json(); }), 15000, null);
    },
    publish: function (rec) {
      var self = this, d = rec.data;
      return shrink(rec.thumb, 420, 0.6).then(function (thumb) {
        return withTimeout(fetch(self.base() + '/lensa_finds', {
          method: 'POST', headers: self.head({ Prefer: 'return=minimal' }),
          body: JSON.stringify({
            title: d.title, category: d.category, summary: d.summary, narration: d.narration,
            query: d.search.local, specs: d.specs.slice(0, 6), price: d.price.min != null ? d.price : null,
            lang: rec.lang, mode: rec.mode, thumb: thumb, author: S.nick
          })
        }).then(function (r) { return self.check(r); }).then(function () { return true; }), 20000, null);
      });
    },
    rpc: function (fn, id) {
      var self = this;
      return fetch(self.base() + '/rpc/' + fn, {
        method: 'POST', headers: self.head(), body: JSON.stringify({ find_id: id })
      }).then(function (r) { return self.check(r); });
    },
    test: function () {
      var self = this;
      return withTimeout(fetch(self.base() + '/lensa_finds?select=id&limit=1', { headers: self.head() })
        .then(function (r) { return self.check(r); }).then(function () { return true; }), 12000, null);
    }
  };

  function localFeed() { return store.json('lensa.feed', []); }
  function writeLocalFeed(f) { try { store.set('lensa.feed', JSON.stringify(f.slice(-60))); } catch (e) {} }

  function publishFind(rec) {
    var f = localFeed();
    if (!f.some(function (i) { return i.id === rec.id; })) {
      f.push({
        id: rec.id, ts: Date.now(), title: rec.data.title, category: rec.data.category,
        summary: rec.data.summary, query: rec.data.search.local, thumb: rec.thumb,
        lang: rec.lang, mode: rec.mode, price: rec.data.price, author: S.nick, mine: true
      });
      writeLocalFeed(f);
    }
    rec.published = true;
    updateRecord(rec);
    if (Cloud.ready()) {
      toast(t('publishing'));
      Cloud.publish(rec)
        .then(function () { toast(t('published')); if (S.view === 'feed') renderFeed(); })
        .catch(function () { toast(t('cloudFail')); });
    } else {
      toast(t('published'));
    }
  }

  function importLink(url) {
    try {
      var m = String(url).match(/#k=([A-Za-z0-9\-_]+)/);
      if (!m) throw new Error('yok');
      var p = JSON.parse(unb64url(m[1]));
      if (!p || !p.t) throw new Error('bos');
      var f = localFeed();
      f.push({
        id: 'i' + Date.now().toString(36), ts: Date.now(), title: p.t, category: p.c,
        summary: p.s, narration: p.n, query: p.q, thumb: p.im || '', lang: p.l,
        mode: p.m, price: p.p, specs: p.sp || [], author: '', mine: false
      });
      writeLocalFeed(f);
      renderFeed();
      toast(t('published'));
    } catch (e) { toast(t('badLink')); }
  }

  function renderFeed() {
    var body = $('feedBody');
    var head = '<div class="feed-head">' +
      '<span class="badge' + (Cloud.ready() ? ' live' : '') + '">' + esc(Cloud.ready() ? t('cloudOn') : t('cloudOff')) + '</span>' +
      '<button class="mode" id="impBtn">' + esc(t('importLink')) + '</button>' +
      (Cloud.ready() ? '<button class="mode" id="refBtn">' + esc(t('refresh')) + '</button>' : '') +
      '</div>';

    function paint(items, note) {
      if (!items.length) {
        body.innerHTML = head + emptyBlock(t('emptyFeedT'), t('emptyFeedP'), t('startScan'), 'goScan2');
        var g = $('goScan2'); if (g) g.onclick = function () { go('scan'); };
      } else {
        body.innerHTML = head + (note ? '<div class="note">' + esc(note) + '</div>' : '') +
          '<div class="grid">' + items.map(function (i) {
            var mine = i.mine ? (S.ui === 'tr' ? 'Senin keşfin' : 'Your find') : (i.author || (S.ui === 'tr' ? 'Paylaşılan' : 'Shared'));
            return '<div class="tile"><button class="tile-main" data-q="' + esc(i.query || i.title) + '" data-i="' + esc(i.id) + '">' +
              (i.thumb ? '<img src="' + i.thumb + '" alt="" loading="lazy">' : '<div class="noimg"></div>') +
              '<div class="meta"><div class="tt">' + esc(i.title || '—') + '</div>' +
              '<div class="ts">' + esc(mine) + (i.category ? ' · ' + esc(i.category) : '') + '</div></div></button>' +
              (i.cloud ? '<div class="tile-bar">' +
                '<button class="mini" data-like="' + esc(i.id) + '">' + ICON.heart + '<span>' + (i.likes || 0) + '</span></button>' +
                '<button class="mini" data-flag="' + esc(i.id) + '" aria-label="' + esc(t('report')) + '">' + ICON.flag + '</button>' +
              '</div>' : '') + '</div>';
          }).join('') + '</div>';

        Array.prototype.forEach.call(body.querySelectorAll('.tile-main'), function (b) {
          b.onclick = function () {
            window.open('https://www.google.com/search?q=' + encodeURIComponent(b.getAttribute('data-q')), '_blank', 'noopener');
          };
        });
        Array.prototype.forEach.call(body.querySelectorAll('[data-like]'), function (b) {
          b.onclick = function (e) {
            e.stopPropagation();
            var span = b.querySelector('span');
            span.textContent = (parseInt(span.textContent, 10) || 0) + 1;
            b.classList.add('liked'); buzz(10);
            Cloud.rpc('lensa_like', b.getAttribute('data-like')).catch(function () {});
          };
        });
        Array.prototype.forEach.call(body.querySelectorAll('[data-flag]'), function (b) {
          b.onclick = function (e) {
            e.stopPropagation();
            Cloud.rpc('lensa_flag', b.getAttribute('data-flag')).catch(function () {});
            b.closest('.tile').style.display = 'none';
            toast(t('reported'));
          };
        });
      }
      var ib = $('impBtn');
      if (ib) ib.onclick = function () { var v = prompt(t('pasteLink')); if (v) importLink(v); };
      var rb = $('refBtn');
      if (rb) rb.onclick = function () { renderFeed(); };
    }

    var local = localFeed().slice().reverse();
    if (!Cloud.ready()) return paint(local, '');

    body.innerHTML = head + '<div class="note">' + esc(t('loading')) + '</div>';
    var ib0 = $('impBtn');
    if (ib0) ib0.onclick = function () { var v = prompt(t('pasteLink')); if (v) importLink(v); };

    Cloud.list().then(function (rows) {
      var items = (rows || []).map(function (r) {
        return {
          id: r.id, title: r.title, category: r.category, summary: r.summary,
          query: r.query || r.title, thumb: r.thumb || '', lang: r.lang, mode: r.mode,
          price: r.price, author: r.author, likes: r.likes || 0, cloud: true,
          mine: r.author === S.nick
        };
      });
      paint(items.concat(local.filter(function (l) { return !l.mine; })), '');
    }).catch(function () {
      paint(local, t('cloudFail'));
    });
  }

      setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
    };
    $('wipeBtn').onclick = function () {
      if (!confirm(tr ? 'Tüm keşifler ve ayarlar silinsin mi?' : 'Delete all finds and settings?')) return;
      ['lensa.recs', 'lensa.feed', 'lensa.counter', 'lensa.prefs'].forEach(store.del.bind(store));
      location.reload();
    };
  }

  /* ── 23. Yönlendirme ───────────────────────────────────── */
  var VIEWS = ['scan', 'result', 'collection', 'feed', 'settings'];
  function go(v) {
    S.view = v;
    VIEWS.forEach(function (n) { $('v-' + n).classList.toggle('active', n === v); });
    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (b) {
      var g = b.getAttribute('data-go');
      b.setAttribute('aria-selected', (g === v || (v === 'result' && g === 'scan')) ? 'true' : 'false');
    });
    if (v === 'collection') renderCollection();
    if (v === 'feed') renderFeed();
    if (v === 'settings') renderSettings();
    if (v !== 'result') TTS.stop();
    if (v === 'scan') { if (!S.image && !S.stream) startCam(); }
    else stopCam();
  }

  function resetScan() {
    if (S.abort) { try { S.abort.abort(); } catch (e) {} S.abort = null; }
    S.image = null; S.fullImage = null; S.current = null; S.focusNote = '';
    $('shot').classList.add('hide');
    $('finderIdle').classList.remove('hide');
    startCam();
  }

  function applyUI() {
    document.documentElement.lang = S.lang;
    document.documentElement.dir = RTL[S.lang] ? 'rtl' : 'ltr';
    $('langBtn').textContent = S.lang.toUpperCase();
    $('idleTitle').textContent = t('idleTitle');
    $('idleSub').textContent = t('idleSub');
    $('tabScan').textContent = t('tabScan');
    $('tabCol').textContent = t('tabCol');
    $('tabFeed').textContent = t('tabFeed');
    $('tabSet').textContent = t('tabSet');
    renderModes();
  }

  function renderModes() {
    var row = $('modeRow');
    row.innerHTML = MODES.map(function (m) {
      return '<button class="mode" data-m="' + m.id + '" aria-pressed="' + (m.id === S.mode) + '">' +
        esc(S.ui === 'tr' ? m.tr : m.en) + '</button>';
    }).join('');
    Array.prototype.forEach.call(row.children, function (b) {
      b.onclick = function () {
        S.mode = b.getAttribute('data-m');
        savePrefs(); renderModes(); buzz(8);
        b.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
      };
    });
  }

  /* ── 24. Başlangıç ─────────────────────────────────────── */
  function installManifest() {
    try {
      var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">' +
        '<rect width="192" height="192" rx="42" fill="#0E1113"/>' +
        '<g fill="none" stroke="#E0AE63" stroke-width="6"><circle cx="96" cy="96" r="58"/><circle cx="96" cy="96" r="23"/>' +
        '<path d="M96 38v35M147 67 96 96M147 125 96 96M96 154v-35M45 125 96 96M45 67 96 96"/></g></svg>';
      var icon = 'data:image/svg+xml;base64,' + btoa(svg);
      var man = {
        name: 'LENSA', short_name: 'LENSA', start_url: '.', display: 'standalone',
        background_color: '#0E1113', theme_color: '#0E1113', orientation: 'portrait',
        icons: [{ src: icon, sizes: '192x192', type: 'image/svg+xml', purpose: 'any' }]
      };
      var l1 = document.createElement('link');
      l1.rel = 'manifest';
      l1.href = URL.createObjectURL(new Blob([JSON.stringify(man)], { type: 'application/json' }));
      document.head.appendChild(l1);
      var l2 = document.createElement('link');
      l2.rel = 'apple-touch-icon'; l2.href = icon;
      document.head.appendChild(l2);
    } catch (e) {}
  }

  function openSharedLink() {
    if (location.hash.indexOf('#k=') !== 0) return false;
    try {
      var p = JSON.parse(unb64url(location.hash.slice(3)));
      if (!p || !p.t) throw new Error('bos');
      S.lang = p.l || S.lang;
      S.ui = S.lang === 'tr' ? 'tr' : 'en';
      S.mode = p.m || 'genel';
      applyUI();
      var rec = {
        id: 'shared', ts: Date.now(), mode: S.mode, lang: S.lang,
        via: S.ui === 'tr' ? 'Paylaşım' : 'Shared link',
        thumb: p.im || '', qa: [], saved: false, no: null,
        data: normalize({
          title: p.t, category: p.c, confidence: 80, summary: p.s, narration: p.n,
          specs: p.sp || [], price: p.p, search: { local: p.q, global: p.q },
          questions: [], evidence: [], others: [], where: [], alts: []
        })
      };
      if (!rec.data) throw new Error('bos');
      S.current = rec;
      S.image = p.im ? asPayload(p.im) : null;
      S.fullImage = S.image;
      go('result');
      renderResult(rec);
      history.replaceState(null, '', location.pathname + location.search);
      return true;
    } catch (e) {
      history.replaceState(null, '', location.pathname + location.search);
      return false;
    }
  }

  function init() {
    video = $('video'); finder = $('finder');
    loadPrefs();
    applyUI();
    installManifest();
    setupZoom();

    $('shutterBtn').onclick = function () {
      TTS.unlock(); buzz(16);
      if (S.stream) {
        var f = grabFrame();
        if (f) { setImage(f); stopCam(); analyse(); return; }
      }
      $('camPick').click();
    };
    $('galleryBtn').onclick = function () { TTS.unlock(); $('filePick').click(); };
    $('flipBtn').onclick = function () {
      S.facing = S.facing === 'environment' ? 'user' : 'environment';
      startCam();
    };
    $('torchBtn').onclick = toggleTorch;

    function handlePick(e) {
      var f = e.target.files && e.target.files[0];
      e.target.value = '';
      if (!f) return;
      fileToImage(f)
        .then(function (url) { setImage(url); stopCam(); analyse(); })
        .catch(function () { toast(S.ui === 'tr' ? 'Bu dosya okunamadı.' : 'Could not read that file.'); });
    }
    $('filePick').onchange = handlePick;
    $('camPick').onchange = handlePick;

    $('settingsBtn').onclick = function () { go('settings'); };
    $('langBtn').onclick = function () {
      go('settings');
      setTimeout(function () {
        var s = $('setLang');
        if (s) { s.scrollIntoView({ block: 'center' }); s.focus(); }
      }, 80);
    };
    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (b) {
      b.onclick = function () { go(b.getAttribute('data-go')); };
    });

    /* çevrimdışı durumu */
    function net() {
      var b = $('netbar');
      if (navigator.onLine) { b.classList.remove('on'); }
      else { b.textContent = t('offline'); b.classList.add('on'); }
    }
    window.addEventListener('online', function () { net(); toast(t('online')); });
    window.addEventListener('offline', net);
    net();

    if (openSharedLink()) return;

    startCam().then(function (ok) {
      if (!ok) $('idleSub').textContent = t('camDenied');
    });

    document.addEventListener('visibilitychange', function () {
      if (document.hidden) { TTS.stop(); stopCam(); }
      else if (S.view === 'scan' && !S.image) startCam();
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

</script>
</body>
