    h.push('<button class="chip" data-q="__deep">' + esc(t('deeper')) + '</button>');
    h.push('</div><div class="qa" id="qaList"></div>');
    h.push('<div class="ask-row"><input id="askInput" placeholder="' + esc(t('askPh')) +
      '" enterkeyhint="send" aria-label="' + esc(t('ask')) + '"><button id="askBtn" aria-label="' + esc(t('ask')) + '">' + ICON.send + '</button></div>');

    if (d.fact) h.push('<div class="fact"><b>' + esc(t('fact')) + '</b>' + esc(d.fact) + '</div>');

    h.push('<div class="card-actions">');
    h.push('<button class="act' + (rec.saved ? ' done' : '') + '" id="saveBtn">' + ICON.save + '<span>' + esc(rec.saved ? t('saved') : t('save')) + '</span></button>');
    h.push('<button class="act filled" id="shareBtn">' + ICON.share + '<span>' + esc(t('share')) + '</span></button>');
    h.push('<button class="act" id="cardBtn">' + ICON.card + '<span>' + esc(t('card')) + '</span></button>');
    h.push('</div>');

    h.push('<div class="provenance">' + esc(t('provider')) + ': ' + esc(rec.via || '—') +
      ' · ' + esc(modeName(rec.mode)) + ' · ' + esc(langInfo(rec.lang).n) +
      (rec.focused ? ' · ' + esc(t('focusOn')) : '') + '</div>');
    h.push('</article>');

    box.innerHTML = h.join('');
    box.scrollTop = 0;
    setBackdrop(rec.thumb);
    wireResult(rec);
    renderQA(rec);
    var live = $('live');
    if (live) live.textContent = d.title + '. ' + d.summary;
  }

  function renderQA(rec) {
    var list = $('qaList');
    if (!list) return;
    list.innerHTML = (rec.qa || []).map(function (x) {
      return '<div class="qa-item"><div class="q">' + esc(x.q) + '</div><div class="a">' + esc(x.a) + '</div></div>';
    }).join('');
  }

  function wireResult(rec) {
    var d = rec.data;
    $('backScan').onclick = function () { TTS.stop(); go('scan'); resetScan(); };
    var mb = $('markBtn');
    if (mb) mb.onclick = function () { TTS.stop(); openMarker(function () { analyse(true); }); };

    $('playBtn').onclick = function () { TTS.unlock(); TTS.toggle(d.narration); buzz(8); };
    $('rateBtn').onclick = function () {
      var steps = [0.85, 1, 1.15, 1.35];
      S.rate = steps[(steps.indexOf(S.rate) + 1) % steps.length];
      $('rateBtn').textContent = S.rate.toFixed(1) + '×';
      savePrefs();
      if (TTS.on) TTS.speak(d.narration);
    };

    $('saveBtn').onclick = function () {
      if (rec.saved) { go('collection'); return; }
      saveRecord(rec);
      var b = $('saveBtn');
      b.classList.add('done');
      b.querySelector('span').textContent = t('saved');
      var k = document.querySelector('.plate .kat');
      if (k) k.textContent = catNo(rec);
      buzz(14); toast(t('saved'));
    };
    var pv = $('pinBtn');
    if (pv) pv.onclick = function () {
      pv.disabled = true;
      pv.textContent = S.ui === 'tr' ? 'Konum alınıyor…' : 'Getting location…';
      Place.nearby(true).then(function (place) {
        if (!place) { pv.textContent = S.ui === 'tr' ? 'Konum alınamadı' : 'No location'; return; }
        S.place = place;
        return Heritage.pin(rec, place).then(function (ch) {
          if (ch) { renderResult(rec); updateRecord(rec); toast(S.ui === 'tr' ? 'Konumla doğrulandı.' : 'Confirmed by location.'); }
          else { pv.disabled = false; pv.textContent = S.ui === 'tr' ? 'Yakında eşleşme yok' : 'No match nearby'; }
        });
      }).catch(function () { pv.disabled = false; });
    };

    var hp = $('histPlay');
    if (hp) hp.onclick = function () {
      TTS.unlock();
      TTS.toggle(d.heritage.story);
      buzz(8);
    };
    var lb = $('liveBtn');
    if (lb) lb.onclick = function () { runLivePrice(rec); };
    $('shareBtn').onclick = function () { shareRecord(rec); };
    $('cardBtn').onclick = function () { makeCard(rec); };

    Array.prototype.forEach.call(document.querySelectorAll('#qChips .chip'), function (b) {
      b.onclick = function () {
        var q = b.getAttribute('data-q');
        if (q === '__deep') {
          askFollowUp(rec, S.ui === 'tr'
            ? 'Bunu bir uzman gibi daha derin anlat: kökeni, nasıl üretildiği, ayırt edici detayları ve alırken nelere dikkat edilmeli.'
            : 'Explain this in more depth like an expert: origin, how it is made, distinguishing details, and what to check before buying.');
        } else askFollowUp(rec, q);
      };
    });
    var oc = $('otherChips');
    if (oc) {
      Array.prototype.forEach.call(oc.querySelectorAll('.chip'), function (b) {
        b.onclick = function () {
          var name = b.getAttribute('data-o');
          S.image = S.fullImage || S.image;
          S.focusNote = (S.ui === 'tr' ? 'Cercevedeki su nesneye odaklan: ' : 'Focus on this object in the frame: ') + name;
          TTS.stop();
          analyse(true);
        };
      });
    }
    $('askBtn').onclick = function () {
      var v = $('askInput').value.trim();
      if (v) { $('askInput').value = ''; askFollowUp(rec, v); }
    };
    $('askInput').onkeydown = function (e) { if (e.key === 'Enter') $('askBtn').click(); };
  }

  /* ── 17. Analiz akışı ──────────────────────────────────── */
  function errorText(e) {
    var m = String(e && e.message || e);
    if (!navigator.onLine || m === 'offline') return t('failOffline');
    if (/timeout/i.test(m)) return t('failTimeout');
    if (/parse/i.test(m)) return t('failParse');
    if (/all-failed/i.test(m)) return t('failAll');
    return t('failGeneric');
  }

  function analyse(keepFocus) {
    if (!S.image) { toast(t('noImage')); return; }
    if (S.busy) return;
    if (!keepFocus) S.focusNote = '';
    S.busy = true;
    TTS.unlock();
    go('result');
    mountSkeleton(t('analysing'));

    var stages = [t('reading'), t('writing')], si = 0;
    var tick = setInterval(function () { if (si < stages.length) setStage(stages[si++]); }, 3400);

    /* kırpım varsa tam kareyi bağlam olarak ekle */
    var imgs = [S.image];
    if (S.fullImage && S.fullImage.dataUrl !== S.image.dataUrl) imgs.push(S.fullImage);

    /* Barkod ve konum artık yapay zekâyı BEKLETMİYOR; paralel çalışıp
       sonuç geldiğinde kartı zenginleştiriyorlar. */
    var side = {
      bc: S.bc ? Promise.resolve(S.bc) : Barcode.sniff(S.image.dataUrl).then(function (hit) {
        if (!hit || !hit.value) return null;
        buzz(20);
        return ProductDB.lookup(hit.value).then(function (p) {
          return { code: hit.value, format: hit.format || '', product: p, origin: Barcode.origin(hit.value) };
        });
      }).catch(function () { return null; }),
      place: Place.nearby()
    };

    /* İlk kelimeler gelir gelmez başlığı göster; beklemeyi yarı yarıya kısaltır */
    var shownEarly = false;
    function onPartial(txt) {
      if (shownEarly) return;
      var m = txt.match(/"title"\s*:\s*"((?:[^"\\]|\\.){2,90})"/);
      if (!m) return;
      var c = txt.match(/"category"\s*:\s*"((?:[^"\\]|\\.){0,60})"/);
      shownEarly = true;
      clearInterval(tick);
      showEarly(unesc(m[1]), c ? unesc(c[1]) : '');
    }

    chainJSON(systemPrompt(), userPrompt(), imgs, onPartial)
      .then(function (r) {
        clearInterval(tick);
        var rec = {
          id: 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
          ts: Date.now(), mode: S.mode, lang: S.lang, via: r.via,
          thumb: S.image.dataUrl, data: r.data, qa: [], saved: false, no: null,
          focused: !!S.focusNote, bc: null
        };
        S.current = rec;
        S.busy = false;
        renderResult(rec);
        buzz(18);
        if (S.autoSpeak) setTimeout(function () { TTS.speak(r.data.narration); }, 240);

        /* Buradan sonrası kullanıcıyı bekletmez: küçük resim, barkod,
           konum doğrulaması ve gerekiyorsa ikinci geçiş arka planda işler. */
        shrink(S.image.dataUrl, 760, 0.74).then(function (thumb) {
          rec.thumb = thumb;
          if (S.autoSave) saveRecord(rec);
          else updateRecord(rec);
        });
        enrich(rec, side, imgs);
      })
      .catch(function (e) {
        clearInterval(tick);
        S.busy = false;
        var box = $('resultScroll');
        box.innerHTML =
          '<div style="height:14px"></div>' +
          (S.image ? '<div class="plate"><img src="' + S.image.dataUrl + '" alt=""></div>' : '') +
          '<div class="card"><div class="kicker">' + (S.ui === 'tr' ? 'Sorun' : 'Problem') + '</div>' +
          '<h1>' + esc(t('cantRead')) + '</h1>' +
          '<p class="lede">' + esc(errorText(e)) + '</p>' +
          '<div class="card-actions" style="grid-template-columns:1fr 1fr">' +
          '<button class="act filled" id="retryBtn"><span>' + esc(t('retry')) + '</span></button>' +
          '<button class="act" id="backScan2"><span>' + esc(t('newScan')) + '</span></button></div></div>';
        $('retryBtn').onclick = function () { analyse(true); };
        $('backScan2').onclick = function () { go('scan'); resetScan(); };
      });
  }

  function runLivePrice(rec) {
    var btn = $('liveBtn'), out = $('liveOut');
    if (!btn || btn.disabled) return;
    btn.disabled = true;
    out.innerHTML = '<div class="lp-wait">' + esc(t('priceSearching')) + '</div>';

    var openPrices = rec.bc && rec.bc.code ? ProductDB.prices(rec.bc.code) : Promise.resolve([]);

    Promise.all([livePrice(rec).catch(function (e) { return { items: [], summary: errorText(e), asOf: '', via: '' }; }), openPrices])
      .then(function (res) {
        var live = res[0], open = res[1] || [];
        btn.disabled = false;
        var rows = live.items.concat(open.map(function (o) {
          return { seller: o.seller, price: o.price, cur: o.cur, note: o.date };
        }));
        rows.sort(function (a, b) { return a.price - b.price; });
        if (!rows.length) {
          out.innerHTML = '<div class="lp-wait">' + esc(live.summary || t('priceNone')) + '</div>';
          return;
        }
        var html = '<div class="lp-box"><div class="lp-head">' + esc(t('priceLive')) +
          (live.asOf ? ' · ' + esc(live.asOf) : '') + '</div>';
        rows.slice(0, 8).forEach(function (r, i) {
          var href = /^https?:\/\//.test(r.url || '') ? r.url
            : 'https://www.google.com/search?q=' + encodeURIComponent(r.seller + ' ' + (rec.data.search.local || rec.data.title));
          html += '<a class="lp-row" target="_blank" rel="noopener" href="' + esc(href) + '">' +
            '<span class="lp-seller">' + esc(r.seller) + (r.note ? '<small>' + esc(r.note) + '</small>' : '') + '</span>' +
            '<b class="lp-price' + (i === 0 ? ' best' : '') + '">' + esc(priceTag(r.price, r.cur)) + '</b></a>';
        });
        html += '<p class="lp-note">' + esc(live.summary || t('priceWarn')) +
          (live.via ? ' · ' + esc(live.via) : '') + '</p></div>';
        out.innerHTML = html;
        buzz(12);
      });
  }

  function unesc(v) {
    try { return JSON.parse('"' + v + '"'); } catch (e) { return v.replace(/\\"/g, '"'); }
  }

  /* Yanıtın tamamı gelmeden başlığı göster */
  function showEarly(title, category) {
    var box = $('resultScroll');
    box.innerHTML =
      '<div style="height:14px"></div>' +
      (S.image ? '<div class="plate scan-lines"><img src="' + S.image.dataUrl + '" alt=""></div>' : '') +
      '<div class="card"><div class="kicker">' + esc(category || modeName(S.mode)) + '</div>' +
      '<h1>' + esc(title) + '</h1>' +
      '<div class="early"><span class="early-dot"></span>' + esc(t('writing')) + '</div>' +
      '<div class="sk-line" style="margin-top:18px"></div><div class="sk-line w7"></div><div class="sk-line w5"></div></div>';
    var live = $('live');
    if (live) live.textContent = title;
  }

  /* Kartı bekletmeden zenginleştir: barkod, konum, gerekiyorsa doğrulama */
  function enrich(rec, side, imgs) {
    side.bc.then(function (bc) {
      if (!bc || S.current !== rec) return;
      rec.bc = bc;
      S.bc = bc;
      if (bc.product && bc.product.name) {
        rec.data.title = bc.product.name;
        rec.data.confidence = Math.max(rec.data.confidence, 93);
        rec.data.search.local = bc.product.name + ' ' + bc.code;
      } else {
        rec.data.search.local = rec.data.search.local + ' ' + bc.code;
      }
      renderResult(rec);
      updateRecord(rec);
    });

    side.place.then(function (place) {
      if (!place || S.current !== rec) return;
      return Heritage.pin(rec, place).then(function (changed) {
        if (changed && S.current === rec) { renderResult(rec); updateRecord(rec); }
      });
    }).catch(function () {});

    if (S.doubleCheck && rec.data.confidence < 62 && !rec.bc) {
      verifyPass(rec.data, imgs).then(function (r2) {
        if (S.current !== rec || !r2 || !r2.data) return;
        if (r2.data.confidence <= rec.data.confidence) return;
        rec.data = r2.data;
        rec.via = r2.via + ' ×2';
        renderResult(rec);
        updateRecord(rec);
      }).catch(function () {});
    }
  }

  function askFollowUp(rec, q) {
    if (S.busy || !q) return;
    S.busy = true;
    rec.qa = rec.qa || [];
    rec.qa.push({ q: q, a: t('thinking') });
    renderQA(rec);
    var last = document.querySelector('#qaList .qa-item:last-child');
    if (last) last.scrollIntoView({ block: 'center', behavior: 'smooth' });

    var L = langInfo(S.lang);
    var sys = 'Sen LENSA\'sin. Kullanicinin fotografi ve onceki teshis hakkinda takip sorusu yanitliyorsun. ' +
      'Teshis: ' + rec.data.title + '. Ozet: ' + rec.data.summary + '. ' +
      'Kisa, net, dogrudan yanit ver. En fazla 90 kelime. Madde isareti ve markdown kullanma. ' +
      'Emin degilsen soyle. Ilac dozu, mantar yenilebilirligi ve tibbi teshis konusunda hukum verme, uzmana yonlendir. ' +
      'SADECE ' + L.n + ' dilinde yaz. JSON degil duz metin dondur.';

    chainText(sys, q, S.image ? [S.image] : [])
      .then(function (r) {
        rec.qa[rec.qa.length - 1].a = r.text;
        S.busy = false;
        renderQA(rec);
        updateRecord(rec);
        if (S.autoSpeak) TTS.speak(r.text);
      })
      .catch(function (e) {
        rec.qa[rec.qa.length - 1].a = errorText(e);
        S.busy = false;
        renderQA(rec);
      });
  }

  /* ── 18. Koleksiyon ────────────────────────────────────── */
  function allRecords() { return store.json('lensa.recs', []); }
  function writeRecords(list) {
    try { store.set('lensa.recs', JSON.stringify(list)); return true; }
    catch (e) {
      /* kota doldu: en eskileri at */
      var copyList = list.slice();
      while (copyList.length > 8) {
        copyList.shift();
        try { store.set('lensa.recs', JSON.stringify(copyList)); return true; } catch (e2) {}
      }
      return false;
    }
  }
  function nextNo() {
    var n = parseInt(store.get('lensa.counter') || '0', 10) + 1;
    try { store.set('lensa.counter', String(n)); } catch (e) {}
    return n;
  }
  function stripForStore(rec) {
    return {
      id: rec.id, ts: rec.ts, mode: rec.mode, lang: rec.lang, via: rec.via,
      thumb: rec.thumb, data: rec.data, qa: (rec.qa || []).slice(-8),
      saved: true, no: rec.no, published: !!rec.published, focused: !!rec.focused
    };
  }
  function saveRecord(rec) {
    if (rec.saved) return;
    rec.saved = true;
    rec.no = nextNo();
    var list = allRecords();
    list.push(stripForStore(rec));
    if (list.length > 80) list = list.slice(-80);
    writeRecords(list);
  }
  function updateRecord(rec) {
    if (!rec.saved) return;
    var list = allRecords();
    for (var i = 0; i < list.length; i++) {
      if (list[i].id === rec.id) { list[i] = stripForStore(rec); break; }
    }
    writeRecords(list);
  }
  function deleteRecord(id) {
    writeRecords(allRecords().filter(function (r) { return r.id !== id; }));
  }

  function emptyBlock(title, sub, btn, id) {
    return '<div class="empty">' + ICON.aperture +
      '<h3>' + esc(title) + '</h3><p>' + esc(sub) + '</p>' +
      (btn ? '<button class="ghost-btn" id="' + id + '">' + esc(btn) + '</button>' : '') + '</div>';
  }

  function renderCollection() {
    var list = allRecords().slice().reverse();
    var head = $('colHead');
    head.innerHTML = list.length
      ? '<input class="search" id="colSearch" placeholder="' + esc(t('searchPh')) + '" value="' + esc(S.colQuery) + '" aria-label="' + esc(t('searchPh')) + '">' +
        '<div class="filterbar" id="colFilters"></div>'
      : '';

    if (list.length) {
      var cats = {};
      list.forEach(function (r) { var c = (r.data && r.data.category) || '—'; cats[c] = (cats[c] || 0) + 1; });
      var keys = Object.keys(cats).sort(function (a, b) { return cats[b] - cats[a]; }).slice(0, 8);
      var fb = $('colFilters');
      fb.innerHTML = ['<button class="mode" aria-pressed="' + (!S.colFilter) + '" data-c="">' + esc(t('allCats')) + ' · ' + list.length + '</button>']
        .concat(keys.map(function (k) {
          return '<button class="mode" aria-pressed="' + (S.colFilter === k) + '" data-c="' + esc(k) + '">' + esc(k) + ' · ' + cats[k] + '</button>';
        })).join('');
      Array.prototype.forEach.call(fb.children, function (b) {
        b.onclick = function () { S.colFilter = b.getAttribute('data-c') || ''; renderCollection(); };
      });
      var si = $('colSearch');
      si.oninput = function () { S.colQuery = si.value; paintTiles(); };
    }
    paintTiles();

    function paintTiles() {
      var q = S.colQuery.toLocaleLowerCase(S.lang === 'tr' ? 'tr' : 'en');
      var shown = list.filter(function (r) {
        if (S.colFilter && (r.data && r.data.category) !== S.colFilter) return false;
        if (!q) return true;
        var hay = ((r.data && r.data.title) || '') + ' ' + ((r.data && r.data.category) || '') + ' ' + ((r.data && r.data.summary) || '');
        return hay.toLocaleLowerCase(S.lang === 'tr' ? 'tr' : 'en').indexOf(q) >= 0;
      });
      var body = $('colBody');
      if (!list.length) {
        body.innerHTML = emptyBlock(t('emptyColT'), t('emptyColP'), t('startScan'), 'goScan1');
        var b1 = $('goScan1'); if (b1) b1.onclick = function () { go('scan'); };
        return;
      }
      if (!shown.length) { body.innerHTML = '<div class="empty"><p>' + esc(t('noMatch')) + '</p></div>'; return; }
      body.innerHTML = '<div class="grid">' + shown.map(function (r) {
        return '<div class="tile"><button class="tile-main" data-id="' + r.id + '">' +
          '<img src="' + r.thumb + '" alt="" loading="lazy">' +
          '<div class="meta"><div class="tt">' + esc((r.data && r.data.title) || '—') + '</div>' +
          '<div class="ts">' + esc(catNo(r)) + ' · ' + esc((r.data && r.data.category) || '') + '</div></div></button>' +
          '<button class="tile-x" data-del="' + r.id + '" aria-label="' + esc(t('removed')) + '">×</button></div>';
      }).join('') + '</div>';
      Array.prototype.forEach.call(body.querySelectorAll('.tile-main'), function (b) {
        b.onclick = function () { openSaved(b.getAttribute('data-id')); };
      });
      Array.prototype.forEach.call(body.querySelectorAll('.tile-x'), function (b) {
        b.onclick = function (e) {
          e.stopPropagation();
          if (!confirm(t('deleteQ'))) return;
          deleteRecord(b.getAttribute('data-del'));
          renderCollection();
          toast(t('removed'));
        };
      });
    }
  }

  function openSaved(id) {
    var list = allRecords(), r = null;
    for (var i = 0; i < list.length; i++) if (list[i].id === id) r = list[i];
    if (!r) return;
    S.current = r;
    S.mode = r.mode; S.lang = r.lang; S.ui = r.lang === 'tr' ? 'tr' : 'en';
    S.image = r.thumb ? asPayload(r.thumb) : null;
    S.fullImage = S.image;
    S.focusNote = '';
    applyUI();
    go('result');
    renderResult(r);
  }

  /* ── 19. Paylaşım bağlantısı ───────────────────────────── */
  function b64url(str) {
    var bytes = new TextEncoder().encode(str), bin = '';
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function unb64url(s) {
    s = String(s).replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    var bin = atob(s), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }

  function plainText(rec) {
    var d = rec.data, tr = S.ui === 'tr';
    var lines = [d.title, ''];
    if (d.summary) lines.push(d.summary, '');
    d.specs.slice(0, 6).forEach(function (s) { lines.push(s.k + ': ' + s.v); });
    if (d.price.min != null) lines.push('', (tr ? 'Tahmini fiyat: ' : 'Estimated price: ') + money(d.price));
    if (d.search.local) lines.push('', (tr ? 'Arama terimi: ' : 'Search term: ') + d.search.local);
    lines.push('', '— LENSA');
    return lines.join('\n');
  }

  function shareLink(rec) {
    return shrink(rec.thumb, 200, 0.45).then(function (small) {
      var d = rec.data;
      var payload = {
        v: 2, t: d.title, c: d.category, s: d.summary, n: d.narration,
        sp: d.specs.slice(0, 5), q: d.search.local, p: d.price.min != null ? d.price : null,
        l: rec.lang, m: rec.mode, im: small
      };
      var enc = b64url(JSON.stringify(payload));
      if (enc.length > 60000) { delete payload.im; enc = b64url(JSON.stringify(payload)); }
      return location.origin + location.pathname + '#k=' + enc;
    });
  }

  function shareRecord(rec) {
    var text = plainText(rec);
    shareLink(rec).then(function (url) {
      publishFind(rec);
      if (navigator.share) {
        navigator.share({ title: rec.data.title, text: text, url: url })
          .catch(function () { copy(url + '\n\n' + text).then(function () { toast(t('linkCopied')); }); });
      } else {
        copy(url + '\n\n' + text).then(function () { toast(t('linkCopied')); });
      }
    });
  }

  /* ── 20. Paylaşım kartı (1080×1350) ────────────────────── */
  function makeCard(rec) {
    var ready = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
    ready.then(function () { drawCard(rec); }).catch(function () { drawCard(rec); });
  }
  function drawCard(rec) {
    var d = rec.data;
    var c = document.createElement('canvas');
    c.width = 1080; c.height = 1350;
    var x = c.getContext('2d');
    if (!x) { toast(t('failGeneric')); return; }
    x.fillStyle = '#0E1113'; x.fillRect(0, 0, 1080, 1350);

    function finish() {
      x.fillStyle = '#B8853F'; x.fillRect(72, 686, 936, 3);
      x.fillStyle = '#B8853F';
      x.font = '600 24px Archivo, Helvetica, sans-serif';
      x.fillText(String(d.category || '').toUpperCase().slice(0, 42), 72, 758);

      x.fillStyle = '#15181A';
      var size = 84;
      x.font = '500 ' + size + 'px "Bodoni Moda", Georgia, serif';
      var title = d.title;
      while (x.measureText(title).width > 936 && size > 38) {
        size -= 4; x.font = '500 ' + size + 'px "Bodoni Moda", Georgia, serif';
      }
      x.fillText(title, 72, 758 + size + 12);

      x.fillStyle = '#3A3D3F';
      x.font = '400 30px Archivo, Helvetica, sans-serif';
      wrapText(x, d.summary, 72, 758 + size + 78, 936, 44, 7);

      x.fillStyle = '#8A8578';
      x.font = '600 22px Archivo, Helvetica, sans-serif';
      x.fillText('LENSA  ·  ' + catNo(rec), 72, 1294);
      if (d.price.min != null) {
        x.textAlign = 'right'; x.fillStyle = '#B8853F';
        x.fillText(money(d.price), 1008, 1294);
        x.textAlign = 'left';
      }
      c.toBlob(function (blob) {
        if (!blob) return;
        var file = new File([blob], 'lensa-' + (rec.no || 'kesif') + '.jpg', { type: 'image/jpeg' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          navigator.share({ files: [file], title: d.title }).catch(function () {});
        } else {
          var a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = file.name; a.click();
          setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
        }
      }, 'image/jpeg', 0.92);
    }

    x.fillStyle = '#EDE7DA'; x.fillRect(0, 680, 1080, 670);
    if (!rec.thumb) return finish();
    var img = new Image();
    img.onload = function () {
      var ih = 720, sc = Math.max(1080 / img.width, ih / img.height);
      var w = img.width * sc, hh = img.height * sc;
      x.save(); x.beginPath(); x.rect(0, 0, 1080, ih); x.clip();
      x.drawImage(img, (1080 - w) / 2, (ih - hh) / 2, w, hh);
      x.restore();
      var g = x.createLinearGradient(0, ih - 240, 0, ih);
      g.addColorStop(0, 'rgba(14,17,19,0)'); g.addColorStop(1, 'rgba(14,17,19,.85)');
      x.fillStyle = g; x.fillRect(0, ih - 240, 1080, 240);
      x.fillStyle = '#EDE7DA'; x.fillRect(0, 680, 1080, 670);
      finish();
    };
    img.onerror = finish;
    img.src = rec.thumb;
  }

  function wrapText(ctx, text, x, y, maxW, lh, maxLines) {
    var words = String(text || '').split(' '), line = '', lines = 0;
    for (var i = 0; i < words.length; i++) {
      var test = line + words[i] + ' ';
      if (ctx.measureText(test).width > maxW && line) {
        ctx.fillText(line.trim(), x, y); y += lh; line = words[i] + ' '; lines++;
        if (lines >= maxLines - 1) { ctx.fillText(line.trim().slice(0, 58) + '…', x, y); return; }
      } else line = test;
    }
    ctx.fillText(line.trim(), x, y);
  }

  /* ── 21. Ortak akış (Supabase) ─────────────────────────── */
  var SETUP_SQL = [

  /* Yapıştırma kazaları: baştaki "apikey:", "Bearer ", tırnaklar, satır sonları */
  function cleanKey(v) {
    return String(v || '')
      .replace(/^\s*(apikey|authorization)\s*[:=]\s*/i, '')
      .replace(/^\s*Bearer\s+/i, '')
      .replace(/["'`]/g, '')
      .replace(/\s+/g, '');
  }
  function cleanUrl(v) {
    var u = String(v || '').trim().replace(/["'`]/g, '').replace(/\s+/g, '');
    if (u && !/^https?:\/\//i.test(u)) u = 'https://' + u;
    return u.replace(/\/+$/, '').replace(/\/rest\/v1$/, '');
  }
  function keyShape(k) {
    if (!k) return { kind: '-', len: 0 };
    if (/^eyJ/.test(k)) return { kind: 'legacy anon (JWT)', len: k.length, short: k.length < 100 };
    if (/^sb_publishable_/.test(k)) return { kind: 'publishable', len: k.length, short: k.length < 30 };
    if (/^sb_secret_/.test(k)) return { kind: 'SECRET', len: k.length, secret: true };
    return { kind: 'tanınmadı', len: k.length, unknown: true };
  }

  var Cloud = {
    ready: function () { return !!(S.sbUrl && S.sbKey); },
    /* Yeni sb_publishable_ anahtarları JWT değil. Authorization başlığına konursa
       ağ geçidi onu oturum jetonu sanıp 401 döndürüyor. Sadece eski eyJ... ile
       başlayan anon anahtarları Bearer olarak da gönderilebilir. */
    head: function (extra) {
      var h = { apikey: S.sbKey, 'Content-Type': 'application/json' };
      /* Oturum varsa kullanicinin jetonu gider; boylece kendi satirlarina
         yazma ve silme hakki dogar. Yoksa eski anon anahtari JWT ise o gider. */
      if (S.session && S.session.access_token && Date.now() < S.session.expires_at) {
        h.Authorization = 'Bearer ' + S.session.access_token;
      } else if (/^eyJ/.test(S.sbKey)) {
        h.Authorization = 'Bearer ' + S.sbKey;
      }
      if (extra) Object.keys(extra).forEach(function (k) { h[k] = extra[k]; });
      return h;
    },
    base: function () { return cleanUrl(S.sbUrl) + '/rest/v1'; },

    explain: function (status, msg) {
      var tr = S.ui === 'tr', m = String(msg || '');
      if (status >= 200 && status < 300) {
        return tr ? 'Her şey yolunda. Ortak akış çalışıyor.' : 'All good. The shared feed is working.';
      }
      if (/permission denied/i.test(m) || /42501/.test(m)) {
        return tr
          ? 'Tablo var ama anon rolüne izin verilmemiş. Kurulum SQL\'ini yeniden kopyalayıp çalıştır — GRANT satırlarını içeriyor.'
          : 'The table exists but the anon role has no privileges. Copy the setup SQL again and run it — it now includes the GRANT statements.';
      }
      if (/no api key found/i.test(m)) {
        return tr ? 'Sunucu anahtarı hiç görmedi. Anahtar alanı boş kalmış olabilir.'
                  : 'The server saw no key at all. The key field may be empty.';
      }
      if (/invalid api key/i.test(m) || status === 401) {
        return tr
          ? '401 — anahtar bu projeye ait değil ya da eksik kopyalanmış. Proje URL\'sindeki kod ile anahtarı aynı projeden aldığından emin ol.'
          : '401 — the key does not belong to this project, or was copied incompletely. Make sure the URL and the key come from the same project.';
      }
      if (status === 404 || /relation|does not exist/i.test(m)) {
        return tr ? '404 — lensa_finds tablosu yok. Kurulum SQL\'ini SQL Editor\'de çalıştır.'
                  : '404 — table lensa_finds is missing. Run the setup SQL in the SQL Editor.';
      }
      if (status === 403) {
        return tr ? '403 — erişim engellendi. Kurulum SQL\'indeki okuma politikası eksik olabilir.'
                  : '403 — access denied. The read policy from the setup SQL may be missing.';
      }
      if (status === 0) {
        return tr ? 'Sunucuya ulaşılamadı. URL yanlış olabilir ya da proje duraklatılmış.'
                  : 'Could not reach the server. Wrong URL, or the project is paused.';
      }
      return (status ? status + ' — ' : '') + (m || (tr ? 'bilinmeyen hata' : 'unknown error'));
    },
    check: function (r) {
      if (r.ok) return r;
      var self = this;
      return r.text().then(function (txt) {
        var msg = '';
        try { var j = JSON.parse(txt); msg = j.message || j.hint || j.error_description || j.error || ''; }
        catch (e) { msg = String(txt).slice(0, 140); }
        throw new Error(self.explain(r.status, msg));
      });
    },
    /* Ham gerçeği gösterir: ne gönderdik, sunucu ne dedi */
    diagnose: function () {
      var self = this, url = self.base() + '/lensa_finds?select=id&limit=1', t0 = Date.now();
      return fetch(url, { headers: self.head() }).then(function (r) {
        return r.text().then(function (txt) {
          return { status: r.status, body: txt.slice(0, 260), ms: Date.now() - t0, url: url };
        });
      }).catch(function (e) {
        return { status: 0, body: String(e.message || e), ms: Date.now() - t0, url: url };
      });
    },
    list: function () {
      var self = this;
      var cols = 'id,created_at,title,category,summary,narration,query,specs,price,lang,mode,thumb,author,likes,user_id';
      return withTimeout(fetch(self.base() + '/lensa_finds?select=' + cols + '&order=created_at.desc&limit=48',
        { headers: self.head() }).then(function (r) { return self.check(r); }).then(function (r) { return r.json(); }), 15000, null);
    },
    publish: function (rec) {
      var self = this, d = rec.data;
      return shrink(rec.thumb, 420, 0.6).then(function (thumb) {
        return withTimeout(fetch(self.base() + '/lensa_finds', {
          method: 'POST', headers: self.head({ Prefer: 'return=minimal' }),
          body: JSON.stringify({
            title: d.title, category: d.category, summary: d.summary, narration: d.narration,
            query: d.search.local, specs: d.specs.slice(0, 6), price: d.price.min != null ? d.price : null,
            lang: rec.lang, mode: rec.mode, thumb: thumb, author: S.nick,
            user_id: (S.user && S.user.id) || null
          })
        }).then(function (r) { return self.check(r); }).then(function () { return true; }), 20000, null);
      });
    },
    remove: function (id) {
      var self = this;
      return fetch(self.base() + '/lensa_finds?id=eq.' + encodeURIComponent(id), {
        method: 'DELETE', headers: self.head({ Prefer: 'return=minimal' })
      }).then(function (r) { return self.check(r); });
    },
    likeRow: function (findId) {
      var self = this;
      return fetch(self.base() + '/lensa_likes', {
        method: 'POST', headers: self.head({ Prefer: 'resolution=ignore-duplicates,return=minimal' }),
        body: JSON.stringify({ find_id: findId, user_id: S.user.id })
      }).then(function (r) { return r.ok ? true : self.check(r); });
    },
    myLikes: function () {
      var self = this;
      if (!S.user) return Promise.resolve({});
      return fetch(self.base() + '/lensa_likes?select=find_id&user_id=eq.' + encodeURIComponent(S.user.id),
        { headers: self.head() }).then(function (r) { return r.ok ? r.json() : []; })
        .then(function (rows) {
          var m = {};
          (rows || []).forEach(function (x) { m[x.find_id] = 1; });
          return m;
        }).catch(function () { return {}; });
    },
    rpc: function (fn, id) {
      var self = this;
      return fetch(self.base() + '/rpc/' + fn, {
        method: 'POST', headers: self.head(), body: JSON.stringify({ find_id: id })
      }).then(function (r) { return self.check(r); });
    },
    test: function () {
      var self = this;
      return withTimeout(fetch(self.base() + '/lensa_finds?select=id&limit=1', { headers: self.head() })
        .then(function (r) { return self.check(r); }).then(function () { return true; }), 12000, null);
    }
  };

  function localFeed() { return store.json('lensa.feed', []); }
  function writeLocalFeed(f) { try { store.set('lensa.feed', JSON.stringify(f.slice(-60))); } catch (e) {} }

  function publishFind(rec) {
    var f = localFeed();
    if (!f.some(function (i) { return i.id === rec.id; })) {
      f.push({
        id: rec.id, ts: Date.now(), title: rec.data.title, category: rec.data.category,
        summary: rec.data.summary, query: rec.data.search.local, thumb: rec.thumb,
        lang: rec.lang, mode: rec.mode, price: rec.data.price, author: S.nick, mine: true
      });
      writeLocalFeed(f);
    }
    rec.published = true;
    updateRecord(rec);
    if (Cloud.ready()) {
      toast(t('publishing'));
      Cloud.publish(rec)
        .then(function () { toast(t('published')); if (S.view === 'feed') renderFeed(); })
        .catch(function () { toast(t('cloudFail')); });
    } else {
      toast(t('published'));
    }
  }

  function importLink(url) {
    try {
      var m = String(url).match(/#k=([A-Za-z0-9\-_]+)/);
      if (!m) throw new Error('yok');
      var p = JSON.parse(unb64url(m[1]));
      if (!p || !p.t) throw new Error('bos');
      var f = localFeed();
      f.push({
        id: 'i' + Date.now().toString(36), ts: Date.now(), title: p.t, category: p.c,
        summary: p.s, narration: p.n, query: p.q, thumb: p.im || '', lang: p.l,
        mode: p.m, price: p.p, specs: p.sp || [], author: '', mine: false
      });
      writeLocalFeed(f);
      renderFeed();
      toast(t('published'));
    } catch (e) { toast(t('badLink')); }
  }

  function renderFeed() {
    var body = $('feedBody');
    var head = '<div class="feed-head">' +
      '<span class="badge' + (Cloud.ready() ? ' live' : '') + '">' + esc(Cloud.ready() ? t('cloudOn') : t('cloudOff')) + '</span>' +
      '<button class="mode" id="impBtn">' + esc(t('importLink')) + '</button>' +
      (Cloud.ready() ? '<button class="mode" id="refBtn">' + esc(t('refresh')) + '</button>' : '') +
      '</div>' +
      '<input class="search" id="feedSearch" placeholder="' + esc(t('searchFeed')) + '" value="' + esc(S.feedQuery) + '">';

    var current = [];

    function wireHead() {
      var ib = $('impBtn');
      if (ib) ib.onclick = function () { var v = prompt(t('pasteLink')); if (v) importLink(v); };
      var rb = $('refBtn');
      if (rb) rb.onclick = function () { renderFeed(); };
      var fs = $('feedSearch');
      if (fs) fs.oninput = function () { S.feedQuery = fs.value; paintGrid(); };
    }

    function paintGrid(note) {
      var host = $('feedGrid');
      if (!host) return;
      var q = S.feedQuery.toLocaleLowerCase(S.lang === 'tr' ? 'tr' : 'en');
      var items = !q ? current : current.filter(function (i) {
        return ((i.title || '') + ' ' + (i.category || '') + ' ' + (i.summary || ''))
          .toLocaleLowerCase(S.lang === 'tr' ? 'tr' : 'en').indexOf(q) >= 0;
      });
      if (!items.length) {
        host.innerHTML = current.length
          ? '<div class="empty"><p>' + esc(t('noMatch')) + '</p></div>'
          : emptyBlock(t('emptyFeedT'), t('emptyFeedP'), t('startScan'), 'goScan2');
        var g = $('goScan2'); if (g) g.onclick = function () { go('scan'); };
        return;
      }
      host.innerHTML = (note ? '<div class="note">' + esc(note) + '</div>' : '') +
        '<div class="grid">' + items.map(function (i) {
          var who = i.mine ? t('mine') : (i.author || (S.ui === 'tr' ? 'Paylaşılan' : 'Shared'));
          return '<div class="tile"><button class="tile-main" data-q="' + esc(i.query || i.title) + '">' +
            (i.thumb ? '<img src="' + i.thumb + '" alt="" loading="lazy">' : '<div class="noimg"></div>') +
            '<div class="meta"><div class="tt">' + esc(i.title || '—') + '</div>' +
            '<div class="ts">' + esc(who) + (i.category ? ' · ' + esc(i.category) : '') + '</div></div></button>' +
            (i.cloud ? '<div class="tile-bar">' +
              '<button class="mini' + (i.liked ? ' liked' : '') + '" data-like="' + esc(i.id) + '">' + ICON.heart + '<span>' + (i.likes || 0) + '</span></button>' +
              (i.owned
                ? '<button class="mini" data-del="' + esc(i.id) + '" aria-label="' + esc(t('deletePost')) + '">×</button>'
                : '<button class="mini" data-flag="' + esc(i.id) + '" aria-label="' + esc(t('report')) + '">' + ICON.flag + '</button>') +
            '</div>' : '') + '</div>';
        }).join('') + '</div>';

      Array.prototype.forEach.call(host.querySelectorAll('.tile-main'), function (b) {
        b.onclick = function () {
          window.open('https://www.google.com/search?q=' + encodeURIComponent(b.getAttribute('data-q')), '_blank', 'noopener');
        };
      });
      Array.prototype.forEach.call(host.querySelectorAll('[data-like]'), function (b) {
        b.onclick = function (e) {
          e.stopPropagation();
          if (b.classList.contains('liked')) return;
          var span = b.querySelector('span');
          span.textContent = (parseInt(span.textContent, 10) || 0) + 1;
          b.classList.add('liked'); buzz(10);
          var id = b.getAttribute('data-like');
          Cloud.rpc('lensa_like', id).catch(function () {});
          if (S.user) Cloud.likeRow(id).catch(function () {});
        };
      });
      Array.prototype.forEach.call(host.querySelectorAll('[data-flag]'), function (b) {
        b.onclick = function (e) {
          e.stopPropagation();
          Cloud.rpc('lensa_flag', b.getAttribute('data-flag')).catch(function () {});
          b.closest('.tile').style.display = 'none';
          toast(t('reported'));
        };
      });
      Array.prototype.forEach.call(host.querySelectorAll('[data-del]'), function (b) {
        b.onclick = function (e) {
          e.stopPropagation();
          if (!confirm(t('deleteQ'))) return;
          var id = b.getAttribute('data-del');
          Cloud.remove(id).then(function () {
            current = current.filter(function (x) { return x.id !== id; });
            paintGrid(); toast(t('removed'));
          }).catch(function (err) { toast(String(err.message || err)); });
        };
      });
    }

    var local = localFeed().slice().reverse();
    body.innerHTML = head + '<div id="feedGrid"></div>';
    wireHead();

    if (!Cloud.ready()) { current = local; paintGrid(); return; }

    $('feedGrid').innerHTML = '<div class="note">' + esc(t('loading')) + '</div>';
    Cloud.list().then(function (rows) {
      return (S.user ? Cloud.myLikes() : Promise.resolve({})).then(function (likes) {
        current = (rows || []).map(function (r) {
          var owned = !!(S.user && r.user_id && r.user_id === S.user.id);
          return {
            id: r.id, title: r.title, category: r.category, summary: r.summary,
            query: r.query || r.title, thumb: r.thumb || '', lang: r.lang, mode: r.mode,
            price: r.price, author: r.author, likes: r.likes || 0, cloud: true,
            owned: owned, liked: !!likes[r.id],
            mine: owned || (!S.user && r.author === S.nick)
          };
        }).concat(local.filter(function (l) { return !l.mine; }));
        paintGrid();
      });
    }).catch(function () {
      current = local;
      paintGrid(t('cloudFail'));
    });
  }

  function initial(s) {

  function wireAccount() {
    var tr = S.ui === 'tr';
    if ($('signOutBtn')) {
      $('signOutBtn').onclick = function () {
        Auth.signOut().then(function () { toast(tr ? 'Çıkış yapıldı.' : 'Signed out.'); renderSettings(); });
      };
      $('syncUpBtn').onclick = function () { runSync(Sync.up, t('synced')); };
      $('syncDownBtn').onclick = function () {
        runSync(Sync.down, t('synced'), function () { if (S.view === 'collection') renderCollection(); });
      };
      return;
    }
    if (!$('authTabs')) return;

    var mode = 'in';
    Array.prototype.forEach.call($('authTabs').children, function (b) {
      b.onclick = function () {
        mode = b.getAttribute('data-a');
        Array.prototype.forEach.call($('authTabs').children, function (x) {
          x.setAttribute('aria-pressed', x === b);
        });
        $('authName').classList.toggle('hide', mode !== 'up');
        $('authGo').textContent = mode === 'up' ? t('signUp') : t('signIn');
        $('authPass').autocomplete = mode === 'up' ? 'new-password' : 'current-password';
      };
    });

    var out = $('authOut');
    var say = function (cls, txt) { out.className = 'test-out ' + cls; out.textContent = txt; };

    $('authGo').onclick = function () {
      var em = $('authEmail').value.trim(), pw = $('authPass').value;
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) return say('bad', t('badEmail'));
      if (pw.length < 6) return say('bad', t('weakPass'));
      say('', t('testing'));
      var go = mode === 'up'
        ? Auth.signUp(em, pw, $('authName').value.trim())
        : Auth.signIn(em, pw);
      go.then(function (res) {
        if (mode === 'up' && res && res.confirm) { say('ok', t('checkMail')); return; }
        toast(t('welcome') + (S.nick ? ', ' + S.nick : ''));
        renderSettings();
      }).catch(function (e) { say('bad', String(e.message || e)); });
    };
    $('authMagic').onclick = function () {
      var em = $('authEmail').value.trim();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) return say('bad', t('badEmail'));
      say('', t('testing'));
      Auth.magic(em)
        .then(function () { say('ok', t('magicSent')); })
        .catch(function (e) { say('bad', String(e.message || e)); });
    };
  }

  function runSync(fn, okMsg, after) {
    var out = $('syncOut');
    if (S.syncing) return;
    S.syncing = true;
    out.className = 'test-out'; out.textContent = t('syncing');
    fn.call(Sync).then(function (n) {
      S.syncing = false;
      out.className = 'test-out ok';
      out.textContent = okMsg + (typeof n === 'number' ? ' · ' + n : '');
      if (after) after();
    }).catch(function (e) {
      S.syncing = false;
      out.className = 'test-out bad';
      out.textContent = String(e.message || e);
    });
  }

  /* ── 23. Yönlendirme ───────────────────────────────────── */
  var VIEWS = ['scan', 'result', 'collection', 'feed', 'settings'];
  function go(v) {
    S.view = v;
    VIEWS.forEach(function (n) { $('v-' + n).classList.toggle('active', n === v); });
    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (b) {
      var g = b.getAttribute('data-go');
      b.setAttribute('aria-selected', (g === v || (v === 'result' && g === 'scan')) ? 'true' : 'false');
    });
    if (v === 'collection') renderCollection();
    if (v === 'feed') renderFeed();
    if (v === 'settings') renderSettings();
    if (v !== 'result') { TTS.stop(); if (v !== 'scan') setBackdrop(''); }
    if (v === 'scan') { if (!S.image && !S.stream) startCam(); }
    else stopCam();
  }

  function startBarcodeScan() {
    if (!S.stream) { toast(t('camDenied')); return; }
    if (S.bcStop) return stopBarcodeScan();
    S.bc = null;
    $('bcBtn').classList.add('on');
    $('bcBand').classList.remove('hide');
    $('bcMsg').textContent = t('bcSeeking');
    $('bcCancel').textContent = t('bcStop');
    var give = setTimeout(function () {
      if (S.bcStop) { $('bcMsg').textContent = t('bcNone'); }
    }, 12000);
    S.bcStop = Barcode.live(video, function (hit) {
      clearTimeout(give);
      if (!hit || !hit.value) { $('bcMsg').textContent = t('bcNone'); return; }
      buzz(24);
      $('bcMsg').textContent = t('bcFound') + ' · ' + hit.value;
      var frame = grabFrame();
      stopBarcodeScan();
      S.bc = { code: hit.value, format: hit.format || '', origin: Barcode.origin(hit.value), product: null };
      ProductDB.lookup(hit.value).then(function (p) {
        S.bc.product = p;
        if (frame) { setImage(frame); stopCam(); }
        analyse(true);
      });
    });
  }
  function stopBarcodeScan() {
    if (S.bcStop) { try { S.bcStop(); } catch (e) {} S.bcStop = null; }
    $('bcBtn').classList.remove('on');
    $('bcBand').classList.add('hide');
  }

  function resetScan() {
    if (S.abort) { try { S.abort.abort(); } catch (e) {} S.abort = null; }
    S.image = null; S.fullImage = null; S.current = null; S.focusNote = ''; S.bc = null;
    stopBarcodeScan();
    setBackdrop('');
    $('shot').classList.add('hide');
    $('finderIdle').classList.remove('hide');
    startCam();
  }

  function applyUI() {
    document.documentElement.lang = S.lang;
    document.documentElement.dir = RTL[S.lang] ? 'rtl' : 'ltr';
    $('langBtn').textContent = S.lang.toUpperCase();
    $('idleTitle').textContent = t('idleTitle');
    $('idleSub').textContent = t('idleSub');
    $('tabScan').textContent = t('tabScan');
    $('tabCol').textContent = t('tabCol');
    $('tabFeed').textContent = t('tabFeed');
    $('tabSet').textContent = t('tabSet');
    renderModes();
  }

  function renderModes() {
    var row = $('modeRow');
    row.innerHTML = MODES.map(function (m) {
      return '<button class="mode" data-m="' + m.id + '" aria-pressed="' + (m.id === S.mode) + '">' +
        esc(S.ui === 'tr' ? m.tr : m.en) + '</button>';
    }).join('');
    Array.prototype.forEach.call(row.children, function (b) {
      b.onclick = function () {
        S.mode = b.getAttribute('data-m');

      };

  /* ── 24. Başlangıç ─────────────────────────────────────── */
  function installManifest() {
    try {
      var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 200" width="220" height="200">' +
        '<defs><radialGradient id="i" cx="36%" cy="30%" r="76%">' +
        '<stop offset="0%" stop-color="#D8B4FE"/><stop offset="34%" stop-color="#8B5CF6"/>' +
        '<stop offset="72%" stop-color="#3B82F6"/><stop offset="100%" stop-color="#22D3EE"/></radialGradient>' +
        '<linearGradient id="c" x1="0" y1="0" x2="1" y2="1">' +
        '<stop offset="0%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#22D3EE"/></linearGradient></defs>' +
        '<rect width="220" height="200" fill="#0E1113"/>' +
        '<g stroke="#EDE7DA" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M34.3 72.4 A68 68 0 0 1 165.7 72.4"/>' +
        '<path d="M165.7 107.6 A68 68 0 0 1 82.4 155.7"/>' +
        '<path d="M82.4 155.7 L44 185 L57.2 142.8 A68 68 0 0 1 34.3 72.4"/></g>' +
        '<g stroke="url(#c)" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M176 45 L195 45 Q201 45 201 51 L201 69"/>' +
        '<path d="M201 121 L201 139 Q201 145 195 145 L176 145"/></g>' +
        '<circle cx="100" cy="90" r="50" fill="#0B0E10"/>' +
        '<circle cx="100" cy="90" r="43" fill="#1B2126"/>' +
        '<circle cx="100" cy="90" r="36" fill="url(#i)"/>' +
        '<circle cx="100" cy="90" r="18" fill="#080A0C"/>' +
        '<circle cx="100" cy="90" r="9" fill="#030405"/>' +
        '<circle cx="96" cy="152" r="4.6" fill="#EDE7DA"/>' +
        '<circle cx="109" cy="152" r="4.6" fill="#3B82F6"/>' +
        '<circle cx="122" cy="152" r="4.6" fill="#8B5CF6"/></svg>';
      var icon = 'data:image/svg+xml;base64,' + btoa(svg);
      /* Manifest bir blob adresinden okunuyor; içindeki göreli yollar blob'a
         göre çözülür ve Android'de ana ekran kısayolu yanlış adrese gider.
         Bu yüzden hepsi mutlak yazılıyor. */
      var here = location.href.split('#')[0].split('?')[0];
      var scope = here.replace(/[^/]*$/, '');
      var man = {
        id: here, name: 'LENSA', short_name: 'LENSA',
        start_url: here, scope: scope, display: 'standalone',
        background_color: '#0E1113', theme_color: '#0E1113', orientation: 'portrait',
        icons: [
          { src: icon, sizes: '192x192', type: 'image/svg+xml', purpose: 'any' },
          { src: icon, sizes: '512x512', type: 'image/svg+xml', purpose: 'maskable' }
        ]
      };
      var l1 = document.createElement('link');
      l1.rel = 'manifest';
      l1.href = URL.createObjectURL(new Blob([JSON.stringify(man)], { type: 'application/json' }));
      document.head.appendChild(l1);
      var l2 = document.createElement('link');
      l2.rel = 'apple-touch-icon'; l2.href = icon;
      document.head.appendChild(l2);
    } catch (e) {}
  }

  function openSharedLink() {
    if (location.hash.indexOf('#k=') !== 0) return false;
    try {
      var p = JSON.parse(unb64url(location.hash.slice(3)));
      if (!p || !p.t) throw new Error('bos');
      S.lang = p.l || S.lang;
      S.ui = S.lang === 'tr' ? 'tr' : 'en';
      S.mode = p.m || 'genel';
      applyUI();
      var rec = {
        id: 'shared', ts: Date.now(), mode: S.mode, lang: S.lang,
        via: S.ui === 'tr' ? 'Paylaşım' : 'Shared link',
        thumb: p.im || '', qa: [], saved: false, no: null,
        data: normalize({
          title: p.t, category: p.c, confidence: 80, summary: p.s, narration: p.n,
          specs: p.sp || [], price: p.p, search: { local: p.q, global: p.q },
          questions: [], evidence: [], others: [], where: [], alts: []
        })
      };
      if (!rec.data) throw new Error('bos');
      S.current = rec;
      S.image = p.im ? asPayload(p.im) : null;
      S.fullImage = S.image;
      go('result');
      renderResult(rec);
      history.replaceState(null, '', location.pathname + location.search);
      return true;
    } catch (e) {
      history.replaceState(null, '', location.pathname + location.search);
      return false;
    }
  }

  function init() {
    // Service Worker Kaydı
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js').then(function(reg) {
          console.log('ServiceWorker kayıt başarılı:', reg.scope);
        }).catch(function(err) {
          console.log('ServiceWorker kayıt hatası:', err);
        });
      });
    }

    video = $('video'); finder = $('finder');
    loadPrefs();
    applyUI();
    runSplash();
    installManifest();
    setupZoom();

    $('shutterBtn').onclick = function () {
      TTS.unlock(); buzz(16);
      if (S.stream) {
        var f = grabFrame();
        if (f) { setImage(f); stopCam(); analyse(); return; }
      }
      toast(S.ui === 'tr' ? 'Kamera uygulaması açılıyor…' : 'Opening the camera app\u2026', 1600);
      $('camPick').click();
    };
    $('galleryBtn').onclick = function () { TTS.unlock(); $('filePick').click(); };
    $('flipBtn').onclick = function () {
      S.facing = S.facing === 'environment' ? 'user' : 'environment';
      startCam();
    };
    $('torchBtn').onclick = toggleTorch;
    $('bcBtn').onclick = function () { startBarcodeScan(); };
    $('bcCancel').onclick = function () { stopBarcodeScan(); };

    function handlePick(e) {
      var f = e.target.files && e.target.files[0];
      e.target.value = '';
      if (!f) return;
      fileToImage(f)
        .then(function (url) { setImage(url); stopCam(); analyse(); })
        .catch(function () { toast(S.ui === 'tr' ? 'Bu dosya okunamadı.' : 'Could not read that file.'); });
    }
    $('filePick').onchange = handlePick;
    $('camPick').onchange = handlePick;

    $('settingsBtn').onclick = function () { go('settings'); };
    $('langBtn').onclick = function () {
      go('settings');
      setTimeout(function () {
        var s = $('setLang');
        if (s) { s.scrollIntoView({ block: 'center' }); s.focus(); }
      }, 80);
    };
    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (b) {
      b.onclick = function () { go(b.getAttribute('data-go')); };
    });

    /* çevrimdışı durumu */
    function net() {
      var b = $('netbar');
      if (navigator.onLine) { b.classList.remove('on'); }
      else { b.textContent = t('offline'); b.classList.add('on'); }
    }
    window.addEventListener('online', function () { net(); toast(t('online')); });
    window.addEventListener('offline', net);
    net();

    Auth.load();
    Auth.catchRedirect();

    if (openSharedLink()) return;

    startCam().then(function (ok) {
      if (!ok) $('idleSub').textContent = t('camDenied');
    });

    if (!S.seenIntro) setTimeout(openIntro, 420);

    /* İzin daha önce verilmişse konumu sessizce hazırla; analiz anında beklemesin */
    setTimeout(function () {
      Place.nearby(false).then(function (p) { if (p) S.place = p; }).catch(function () {});
    }, 1200);

    document.addEventListener('visibilitychange', function () {
      if (document.hidden) { TTS.stop(); stopCam(); stopBarcodeScan(); }
      else if (S.view === 'scan' && !S.image) startCam();
    });
  }


  /* ── 25. Hesap ─────────────────────────────────────────
     Supabase Auth'a doğrudan REST ile bağlanıyoruz; kütüphane yok.
     Giriş isteğe bağlı: uygulamanın tamamı misafir olarak da çalışır. */
  var Auth = {
    base: function () { return cleanUrl(S.sbUrl) + '/auth/v1'; },
    head: function (token) {
      var h = { apikey: S.sbKey, 'Content-Type': 'application/json' };
      if (token) h.Authorization = 'Bearer ' + token;
      return h;
    },
    ready: function () { return !!(S.sbUrl && S.sbKey); },

    load: function () {
      var raw = store.json('lensa.session', null);
      if (!raw || !raw.access_token) return;
      S.session = raw;
      S.user = raw.user || null;
      if (S.user && S.user.name) S.nick = S.user.name;
    },
    save: function () {
      try {
        if (S.session) store.set('lensa.session', JSON.stringify(S.session));
        else store.del('lensa.session');
      } catch (e) {}
    },
    setSession: function (d) {
      if (!d || !d.access_token) return null;
      S.session = {
        access_token: d.access_token,
        refresh_token: d.refresh_token,
        expires_at: Date.now() + ((d.expires_in || 3600) * 1000) - 60000,
        user: d.user ? { id: d.user.id, email: d.user.email,
          name: (d.user.user_metadata && d.user.user_metadata.name) || '' } : null
      };
      S.user = S.session.user;
      if (S.user && S.user.name) { S.nick = S.user.name; savePrefs(); }
      this.save();
      return S.session;
    },

    /* Süresi dolmuşsa jetonu sessizce tazele */
    token: function () {
      var self = this;
      if (!S.session) return Promise.resolve(null);
      if (Date.now() < S.session.expires_at) return Promise.resolve(S.session.access_token);
      return fetch(self.base() + '/token?grant_type=refresh_token', {
        method: 'POST', headers: self.head(),
        body: JSON.stringify({ refresh_token: S.session.refresh_token })
      }).then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) {
          if (!d) { S.session = null; S.user = null; self.save(); return null; }
          self.setSession(d);
          return S.session.access_token;
        }).catch(function () { return null; });
    },

    fail: function (r) {
      return r.text().then(function (txt) {
        var m = '';
        try { var j = JSON.parse(txt); m = j.msg || j.message || j.error_description || j.error || ''; }
        catch (e) { m = String(txt).slice(0, 120); }
        var tr = S.ui === 'tr';
        if (/invalid login|invalid credentials/i.test(m)) m = t('wrongCreds');
        else if (/password/i.test(m) && /6|short|least/i.test(m)) m = t('weakPass');
        else if (/email/i.test(m) && /invalid|valid/i.test(m)) m = t('badEmail');
        else if (/already registered|already exists/i.test(m)) m = tr ? 'Bu e-posta zaten kayıtlı. Giriş yap.' : 'Already registered. Sign in instead.';
        else if (/rate|too many/i.test(m)) m = tr ? 'Çok fazla deneme. Biraz bekle.' : 'Too many attempts. Wait a moment.';
        throw new Error(m || (S.ui === 'tr' ? 'İşlem tamamlanamadı.' : 'Could not complete that.'));
      });
    },

    signUp: function (email, password, name) {
      var self = this;
      return fetch(self.base() + '/signup', {
        method: 'POST', headers: self.head(),
        body: JSON.stringify({ email: email, password: password, data: { name: name || '' } })
      }).then(function (r) {
        if (!r.ok) return self.fail(r);
        return r.json();
      }).then(function (d) {
        /* e-posta doğrulaması açıksa oturum gelmez */
        return { session: self.setSession(d), confirm: !d.access_token };
      });
    },
    signIn: function (email, password) {
      var self = this;
      return fetch(self.base() + '/token?grant_type=password', {
        method: 'POST', headers: self.head(),
        body: JSON.stringify({ email: email, password: password })
      }).then(function (r) {
        if (!r.ok) return self.fail(r);
        return r.json();
      }).then(function (d) { return self.setSession(d); });
    },
    magic: function (email) {
      var self = this;
      return fetch(self.base() + '/otp', {
        method: 'POST', headers: self.head(),
        body: JSON.stringify({ email: email, create_user: true,
          options: { email_redirect_to: location.origin + location.pathname } })
      }).then(function (r) { if (!r.ok) return self.fail(r); return true; });
    },
    signOut: function () {
      var self = this;
      var tk = S.session && S.session.access_token;
      S.session = null; S.user = null; self.save();
      if (tk) {
        fetch(self.base() + '/logout', { method: 'POST', headers: self.head(tk) }).catch(function () {});
      }
      return Promise.resolve(true);
    },
    updateName: function (name) {
      var self = this;
      return self.token().then(function (tk) {
        if (!tk) throw new Error(t('needAccount'));
        return fetch(self.base() + '/user', {
          method: 'PUT', headers: self.head(tk),
          body: JSON.stringify({ data: { name: name } })
        }).then(function (r) { if (!r.ok) return self.fail(r); return true; });
      });
    },
    /* Hesabı silmek için sunucu tarafı fonksiyon gerekir; kurulum SQL'i onu kuruyor */
    deleteAccount: function () {
      var self = this;
      return self.token().then(function (tk) {
        if (!tk) throw new Error(t('needAccount'));
        return fetch(cleanUrl(S.sbUrl) + '/rest/v1/rpc/lensa_delete_me', {
          method: 'POST', headers: self.head(tk), body: '{}'
        }).then(function (r) {
          if (!r.ok) return Cloud.check(r);
          return self.signOut();
        });
      });
    },

    /* Adres çubuğunda oturum bilgisi varsa (şifresiz bağlantı dönüşü) yakala */
    catchRedirect: function () {
      var h = location.hash || '';
      if (h.indexOf('access_token=') < 0) return false;
      var p = {};
      h.replace(/^#/, '').split('&').forEach(function (kv) {
        var i = kv.indexOf('=');
        if (i > 0) p[decodeURIComponent(kv.slice(0, i))] = decodeURIComponent(kv.slice(i + 1));
      });
      if (!p.access_token) return false;
      this.setSession({ access_token: p.access_token, refresh_token: p.refresh_token,
        expires_in: parseInt(p.expires_in, 10) || 3600 });
      history.replaceState(null, '', location.pathname + location.search);
      var self = this;
      fetch(self.base() + '/user', { headers: self.head(p.access_token) })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (u) {
          if (!u) return;
          S.session.user = { id: u.id, email: u.email, name: (u.user_metadata && u.user_metadata.name) || '' };
          S.user = S.session.user;
          self.save();
          if (S.view === 'settings') renderSettings();
        }).catch(function () {});
      return true;
    }
  };

  /* ── 26. Bulut senkronu ────────────────────────────────
     Yerel koleksiyon kaynak; bulut yedek. Çakışmada yeni olan kazanır. */
  var Sync = {
    up: function () {
      var list = allRecords();
      if (!list.length) return Promise.resolve(0);
      return Auth.token().then(function (tk) {
        if (!tk) throw new Error(t('needAccount'));
        var rows = list.map(function (r) {
          return {
            user_id: S.user.id, local_id: r.id, no: r.no || null,
            title: (r.data && r.data.title) || '', category: (r.data && r.data.category) || '',
            lang: r.lang, mode: r.mode, thumb: r.thumb || '', data: r.data,
            updated_at: new Date(r.ts || Date.now()).toISOString()
          };
        });
        return fetch(Cloud.base() + '/lensa_saves?on_conflict=user_id,local_id', {
          method: 'POST',
          headers: { apikey: S.sbKey, Authorization: 'Bearer ' + tk,
            'Content-Type': 'application/json', Prefer: 'resolution=merge-duplicates,return=minimal' },
          body: JSON.stringify(rows)
        }).then(function (r) {
          if (!r.ok) return Cloud.check(r);
          return rows.length;
        });
      });
    },
    down: function () {
      return Auth.token().then(function (tk) {
        if (!tk) throw new Error(t('needAccount'));
        return fetch(Cloud.base() + '/lensa_saves?select=local_id,no,lang,mode,thumb,data,updated_at&order=updated_at.desc&limit=200',
          { headers: { apikey: S.sbKey, Authorization: 'Bearer ' + tk } })
          .then(function (r) { if (!r.ok) return Cloud.check(r); return r.json(); })
          .then(function (rows) {
            var local = allRecords(), byId = {};
            local.forEach(function (r) { byId[r.id] = r; });
            var added = 0;
            (rows || []).forEach(function (row) {
              if (!row.data || byId[row.local_id]) return;
              local.push({
                id: row.local_id, ts: new Date(row.updated_at).getTime(), mode: row.mode || 'genel',
                lang: row.lang || S.lang, via: 'Bulut', thumb: row.thumb || '',
                data: row.data, qa: [], saved: true, no: row.no || null
              });
              added++;
            });
            local.sort(function (a, b) { return a.ts - b.ts; });
            writeRecords(local.slice(-120));
            return added;
          });
      });
    },
    stats: function () {
      var recs = allRecords();
      return { finds: recs.length, shared: localFeed().filter(function (f) { return f.mine; }).length };
    }
  };

  /* ── 27b. Açılış ekranı ────────────────────────────────

  function runSplash() {
    var sp = $('splash');
    if (!sp) return;
    var done = false;
    function close() {
      if (done) return;
      done = true;
      sp.classList.add('gone');
      setTimeout(function () { if (sp.parentNode) sp.parentNode.removeChild(sp); }, 620);
    }
    var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    sp.addEventListener('click', close);
    sp.addEventListener('touchstart', close, { passive: true });
    setTimeout(close, reduced ? 400 : 2350);
  }

      ['Sistem', os + ' · ' + br],
